<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scrutiny AI Extractor Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
  padding:20px;
}

h2{
  text-align:center;
  color:#222;
}

.container{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px 16px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

input[type="file"]{
  margin-bottom:10px;
}

input[type="text"]{
  padding:8px;
  width:200px;
  border-radius:6px;
  border:1px solid #ccc;
}

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:left;
}

th{
  background:#111827;
  color:white;
}

tr:nth-child(even){
  background:#f9fafb;
}

.status{
  margin-top:10px;
  font-weight:bold;
  color:green;
}

.actions button{
  background:#dc2626;
}

.actions button.edit{
  background:#16a34a;
}
</style>

</head>

<body>

<div class="container">

<h2>🏗️ Building Scrutiny Extractor PRO</h2>

<input type="file" id="pdfUpload">

<textarea id="report" placeholder="Paste report or upload PDF..."></textarea>

<br>

<button onclick="addEntry()">➕ Add Entry</button>
<button onclick="generateTable()">📊 Generate Table</button>
<button onclick="exportExcel()">⬇ Download Excel</button>
<button onclick="resetData()">♻ Reset</button>

<br><br>

<input type="text" id="search" placeholder="Search..." onkeyup="searchTable()">

<p class="status" id="status"></p>

<table id="table">
<thead>
<tr>
<th>Sr</th>
<th>Tech Person</th>
<th>Contact</th>
<th>Site</th>
<th>Type</th>
<th>Owner</th>
<th>Owner Contact</th>
<th>Owner Address</th>
<th>Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let sr=1

function cleanAddress(address){
  return address
    .replace(/PLOT NO.*?,/gi,"")
    .replace(/HOUSE NO.*?,/gi,"")
    .replace(/CTS NO.*?,/gi,"")
    .replace(/SURVEY NO.*?,/gi,"")
    .trim()
}

function extract(label,text){
  let index=text.toLowerCase().indexOf(label.toLowerCase())
  if(index===-1) return ""

  let sub=text.substring(index+label.length)
  let value=sub.split(/\n|  /)[0]
  return value.trim()
}

function addEntry(){

  let text=document.getElementById("report").value

  if(!text.trim()){
    alert("Enter or upload data first!")
    return
  }

  let techName=extract("Technical Person Name",text)
  let techContact=extract("Contact Number",text)
  let site=cleanAddress(extract("Site Address",text))
  let type=extract("Technical Person Type",text)
  let owner=extract("Owner",text)
  let ownerContact=extract("Owner Contact",text) || extract("Mobile",text)
  let ownerAddress=extract("Postal Address",text)
  let structural=extract("Structural Engineer Name",text)

  if(!techName && !owner){
    alert("Data not detected properly!")
    return
  }

  data.push({
    sr,
    techName,
    techContact,
    site,
    type,
    owner,
    ownerContact,
    ownerAddress,
    structural
  })

  document.getElementById("status").innerText="✅ Entry added (Sr "+sr+")"
  sr++

  document.getElementById("report").value=""
}

function generateTable(){
  let tbody=document.querySelector("#table tbody")
  tbody.innerHTML=""

  data.forEach((d,i)=>{
    tbody.innerHTML+=`
    <tr>
      <td>${d.sr}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.site}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td class="actions">
        <button class="edit" onclick="editRow(${i})">Edit</button>
        <button onclick="deleteRow(${i})">Delete</button>
      </td>
    </tr>
    `
  })
}

function deleteRow(index){
  if(confirm("Delete this entry?")){
    data.splice(index,1)
    generateTable()
  }
}

function editRow(index){
  let d=data[index]

  document.getElementById("report").value=
`Technical Person Name ${d.techName}
Contact Number ${d.techContact}
Site Address ${d.site}
Technical Person Type ${d.type}
Owner ${d.owner}
Owner Contact ${d.ownerContact}
Postal Address ${d.ownerAddress}
Structural Engineer Name ${d.structural}`

  data.splice(index,1)
  generateTable()
}

function searchTable(){
  let input=document.getElementById("search").value.toLowerCase()
  let rows=document.querySelectorAll("#table tbody tr")

  rows.forEach(row=>{
    row.style.display=row.innerText.toLowerCase().includes(input) ? "" : "none"
  })
}

function exportExcel(){
  let table=document.getElementById("table").outerHTML
  let url='data:application/vnd.ms-excel,'+encodeURIComponent(table)

  let link=document.createElement("a")
  link.href=url
  link.download="scrutiny_data.xls"
  link.click()
}

function resetData(){
  if(confirm("Clear all data?")){
    data=[]
    sr=1
    generateTable()
    document.getElementById("status").innerText="♻ Reset complete"
  }
}

document.getElementById('pdfUpload').addEventListener('change',function(e){

  let file=e.target.files[0]
  let reader=new FileReader()

  reader.onload=function(){

    let typedarray=new Uint8Array(this.result)

    pdfjsLib.getDocument(typedarray).promise.then(function(pdf){

      let text=""
      let pages=[]

      for(let i=1;i<=pdf.numPages;i++){
        pages.push(
          pdf.getPage(i).then(page=>{
            return page.getTextContent().then(content=>{
              let strings=content.items.map(item=>item.str)
              text+=strings.join("\n")+"\n"
            })
          })
        )
      }

      Promise.all(pages).then(()=>{
        document.getElementById("report").value=text
        document.getElementById("status").innerText="📄 PDF Loaded Successfully"
      })

    })

  }

  reader.readAsArrayBuffer(file)
})

</script>

</body>
  </html>
