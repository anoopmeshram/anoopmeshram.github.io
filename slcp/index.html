<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scrutiny Extractor PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:#f1f5f9;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{text-align:center;margin-bottom:15px;}

textarea{
  width:100%;
  height:130px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px 14px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover{background:#1d4ed8;}

.danger{background:#dc2626;}
.edit{background:#16a34a;}

input{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
}

th{
  background:#111827;
  color:white;
  font-weight:700;
}

tr:nth-child(even){background:#f9fafb;}

.status{color:green;font-weight:bold;margin-top:10px;}
</style>
</head>

<body>

<div class="container">

<h2>🏗️ Scrutiny Extractor (Table 3 Smart)</h2>

<input type="file" id="pdfUpload"><br><br>

<textarea id="report" placeholder="Paste full data or upload PDF..."></textarea>

<br>

<button onclick="addEntry()">➕ Extract Table 3</button>
<button onclick="exportExcel()">⬇ Download Excel</button>
<button onclick="clearInput()">🧹 Clear Input</button>
<button onclick="resetData()" class="danger">♻ Reset All</button>

<br><br>

<input type="text" id="search" placeholder="Search..." onkeyup="searchTable()">

<p id="status" class="status"></p>

<table id="table">
<thead>
<tr>
<th>Sr. No.</th>
<th>Technical Person Name</th>
<th>Technical Person Contact No.</th>
<th>Site Address</th>
<th>Technical Person Type</th>
<th>Owner Name</th>
<th>Owner Contact No.</th>
<th>Owner Address</th>
<th>Structural Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let sr=1

// 🔥 FINAL ADDRESS CLEANER
function cleanAddress(addr){

  if(!addr) return ""

  addr = addr
    .replace(/PLOT NO\.?\s*\d+,?/gi,"")
    .replace(/FLAT NO\.?\s*\d+,?/gi,"")
    .replace(/HOUSE NO\.?\s*\d+,?/gi,"")
    .replace(/CTS NO\.?\s*\d+,?/gi,"")
    .replace(/KH\.?NO\.?\s*\d+,?/gi,"")
    .replace(/SURVEY NO\.?\s*\d+,?/gi,"")

  addr = addr
    .replace(/nagpur city/gi,"")
    .replace(/maharashtra[-\s]*\d+/gi,"")

  let parts = addr.split(",").map(x=>x.trim()).filter(x=>x)

  let unique = []

  parts.forEach(p=>{
    if(!unique.includes(p.toLowerCase())){
      unique.push(p)
    }
  })

  if(!unique.some(p=>p.toLowerCase()==="nagpur")){
    unique.push("Nagpur")
  }

  return unique.length > 1 ? unique[0] + ", Nagpur" : unique.join(", ")
}

// 🔥 TABLE 3 FILTER
function extractTable3(text){

  let start = text.toLowerCase().indexOf("table 3")

  if(start === -1){
    start = text.toLowerCase().indexOf("applicant/technical person")
    if(start === -1) return ""
  }

  let sub = text.substring(start)

  let next = sub.toLowerCase().match(/table\s*\d+/g)

  if(next && next.length > 1){
    let idx = sub.toLowerCase().indexOf(next[1])
    sub = sub.substring(0,idx)
  }

  return sub
}

// 🔥 PARSER
function parseData(text){

  let lines=text.split(/\n+/).map(l=>l.trim()).filter(l=>l)

  let r={}

  for(let i=0;i<lines.length;i++){

    let line=lines[i].toLowerCase()

    if(line.includes("technical person name")){
      r.techName = lines[i].replace(/technical person name/i,"") || lines[i+1]
    }

    else if(line.includes("contact number") && !r.techContact){
      r.techContact = lines[i].replace(/contact number/i,"") || lines[i+1]
    }

    else if(line.includes("site address")){
      r.site = cleanAddress(lines[i].replace(/site address/i,"") || lines[i+1])
    }

    else if(line.includes("technical person type")){
      r.type = lines[i].replace(/.*technical person type/i,"") || lines[i+1]
    }

    else if(line.includes("owner") && !r.owner){
      r.owner = lines[i].replace(/individual owner|owner/i,"") || lines[i+1]
    }

    else if(line.includes("contact number") && r.techContact && !r.ownerContact){
      r.ownerContact = lines[i].replace(/contact number/i,"") || lines[i+1]
    }

    else if(line.includes("postal address")){
      r.ownerAddress = cleanAddress(lines[i].replace(/postal address/i,"") || lines[i+1])
    }

    else if(line.includes("structural engineer name")){
      let val = lines[i].replace(/structural engineer name/i,"") || lines[i+1]
      r.structural = val.toLowerCase().includes("only") ? "-" : val
    }
  }

  return r
}

// ADD
function addEntry(){

  let full=document.getElementById("report").value

  let table3 = extractTable3(full)

  if(!table3){
    alert("Table 3 not found!")
    return
  }

  let p=parseData(table3)

  data.push({
    sr,
    techName:p.techName?.trim(),
    techContact:p.techContact?.trim(),
    site:p.site,
    type:p.type?.trim(),
    owner:p.owner?.trim(),
    ownerContact:p.ownerContact?.trim(),
    ownerAddress:p.ownerAddress,
    structural:p.structural || "-"
  })

  sr++
  document.getElementById("report").value=""
  document.getElementById("status").innerText="✅ Extracted Successfully"

  generateTable()
}

// TABLE
function generateTable(){

  let tbody=document.querySelector("#table tbody")
  tbody.innerHTML=""

  data.forEach((d,i)=>{
    tbody.innerHTML+=`
    <tr>
      <td>${i+1}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.site}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td>
        <button class="edit" onclick="editRow(${i})">Edit</button>
        <button class="danger" onclick="deleteRow(${i})">Delete</button>
      </td>
    </tr>`
  })
}

// DELETE
function deleteRow(i){
  data.splice(i,1)
  generateTable()
}

// EDIT
function editRow(i){
  let d=data[i]

  document.getElementById("report").value=
`Technical Person Name ${d.techName}
Contact Number ${d.techContact}
Site Address ${d.site}
Technical Person Type ${d.type}
Individual Owner ${d.owner}
Contact Number ${d.ownerContact}
Postal Address ${d.ownerAddress}`

  data.splice(i,1)
  generateTable()
}

// SEARCH
function searchTable(){
  let val=document.getElementById("search").value.toLowerCase()
  document.querySelectorAll("#table tbody tr").forEach(r=>{
    r.style.display=r.innerText.toLowerCase().includes(val)?"":"none"
  })
}

// CLEAR INPUT
function clearInput(){
  document.getElementById("report").value=""
}

// RESET
function resetData(){
  data=[]
  sr=1
  generateTable()
}

// EXCEL
function exportExcel(){

  let ws=XLSX.utils.json_to_sheet(data.map((d,i)=>({
    "Sr. No.":i+1,
    "Technical Person Name":d.techName,
    "Technical Person Contact No.":d.techContact,
    "Site Address":d.site,
    "Technical Person Type":d.type,
    "Owner Name":d.owner,
    "Owner Contact No.":d.ownerContact,
    "Owner Address":d.ownerAddress,
    "Structural Engineer":d.structural
  })))

  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Table 3")

  XLSX.writeFile(wb,"table3_data.xlsx")
}

// PDF
document.getElementById('pdfUpload').addEventListener('change',function(e){

  let file=e.target.files[0]
  let reader=new FileReader()

  reader.onload=function(){
    let typedarray=new Uint8Array(this.result)

    pdfjsLib.getDocument(typedarray).promise.then(function(pdf){

      let text=""
      let pages=[]

      for(let i=1;i<=pdf.numPages;i++){
        pages.push(
          pdf.getPage(i).then(page=>{
            return page.getTextContent().then(content=>{
              let strings=content.items.map(item=>item.str)
              text+=strings.join("\n")+"\n"
            })
          })
        )
      }

      Promise.all(pages).then(()=>{
        document.getElementById("report").value=text
      })

    })
  }

  reader.readAsArrayBuffer(file)
})

</script>

</body>
</html>
