<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scrutiny Table Extractor PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:'Segoe UI',sans-serif;
  background:#f1f5f9;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{text-align:center;margin-bottom:15px;}

textarea{
  width:100%;
  height:120px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px 14px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover{background:#1d4ed8;}

input{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:left;
}

th{
  background:#0f172a;
  color:white;
}

tr:nth-child(even){background:#f9fafb;}

.actions button{background:#dc2626;}
.actions .edit{background:#16a34a;}

.status{color:green;font-weight:bold;margin-top:10px;}
</style>
</head>

<body>

<div class="container">

<h2>🏗️ Scrutiny Data Extractor (Table Version)</h2>

<input type="file" id="pdfUpload"><br><br>

<textarea id="report" placeholder="Paste or upload PDF..."></textarea><br>

<button onclick="addEntry()">Add Entry</button>
<button onclick="exportExcel()">Download Excel</button>
<button onclick="resetData()">Reset</button>

<br><br>

<input type="text" placeholder="Search..." onkeyup="searchTable()" id="search">

<p id="status" class="status"></p>

<table id="table">
<thead>
<tr>
<th>Sr</th>
<th>Technical Person Name</th>
<th>Technical Person Contact No.</th>
<th>Site Address</th>
<th>Technical Person Type</th>
<th>Owner Name</th>
<th>Owner Contact No.</th>
<th>Owner Address</th>
<th>Structural Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let sr=1

function formatSite(site){
  let match = site.match(/MOUZA\s*[-–]?\s*([A-Z ]+)/i)
  if(match){
    return "Mouza – " + match[1].trim() + ", Nagpur"
  }
  return site
}

function formatOwnerAddress(addr){
  let parts = addr.split(",")
  if(parts.length >= 2){
    return parts[1].trim() + ", Nagpur"
  }
  return addr
}

// 🔥 Extraction
function parseData(text){

  let lines=text.split(/\n+/).map(l=>l.trim()).filter(l=>l)

  let r={}

  for(let i=0;i<lines.length;i++){

    let line=lines[i].toLowerCase()

    if(line.includes("technical person name")){
      r.techName = lines[i].replace(/technical person name/i,"") || lines[i+1]
    }

    else if(line.includes("contact number") && !r.techContact){
      r.techContact = lines[i].replace(/contact number/i,"") || lines[i+1]
    }

    else if(line.includes("site address")){
      r.site = lines[i].replace(/site address/i,"") || lines[i+1]
    }

    else if(line.includes("technical person type")){
      r.type = lines[i].replace(/.*technical person type/i,"") || lines[i+1]
    }

    else if(line.includes("owner") && !r.owner){
      r.owner = lines[i].replace(/individual owner|owner/i,"") || lines[i+1]
    }

    else if(line.includes("contact number") && r.techContact && !r.ownerContact){
      r.ownerContact = lines[i].replace(/contact number/i,"") || lines[i+1]
    }

    else if(line.includes("postal address")){
      r.ownerAddress = lines[i].replace(/postal address/i,"") || lines[i+1]
    }

    else if(line.includes("structural engineer name")){
      let val = lines[i].replace(/structural engineer name/i,"") || lines[i+1]
      r.structural = val.includes("only") ? "-" : val
    }
  }

  return r
}

function addEntry(){

  let text=document.getElementById("report").value

  let p=parseData(text)

  data.push({
    sr,
    techName:p.techName?.trim(),
    techContact:p.techContact?.trim(),
    site:formatSite(p.site || ""),
    type:p.type?.trim(),
    owner:p.owner?.trim(),
    ownerContact:p.ownerContact?.trim(),
    ownerAddress:formatOwnerAddress(p.ownerAddress || ""),
    structural:p.structural?.trim() || "-"
  })

  sr++
  document.getElementById("status").innerText="Added Successfully"
  document.getElementById("report").value=""

  generateTable()
}

function generateTable(){

  let tbody=document.querySelector("#table tbody")
  tbody.innerHTML=""

  data.forEach((d,i)=>{
    tbody.innerHTML+=`
    <tr>
      <td>${d.sr}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.site}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td class="actions">
        <button class="edit" onclick="editRow(${i})">Edit</button>
        <button onclick="deleteRow(${i})">Delete</button>
      </td>
    </tr>`
  })
}

function deleteRow(i){
  data.splice(i,1)
  generateTable()
}

function editRow(i){
  let d=data[i]

  document.getElementById("report").value=
`Technical Person Name ${d.techName}
Contact Number ${d.techContact}
Site Address ${d.site}
Technical Person Type ${d.type}
Individual Owner ${d.owner}
Contact Number ${d.ownerContact}
Postal Address ${d.ownerAddress}`

  data.splice(i,1)
  generateTable()
}

function searchTable(){
  let val=document.getElementById("search").value.toLowerCase()
  document.querySelectorAll("#table tbody tr").forEach(r=>{
    r.style.display=r.innerText.toLowerCase().includes(val)?"":"none"
  })
}

// 🔥 Excel TABLE EXPORT
function exportExcel(){

  let ws=XLSX.utils.json_to_sheet(data.map(d=>({
    "Sr":d.sr,
    "Technical Person Name":d.techName,
    "Technical Person Contact No.":d.techContact,
    "Site Address":d.site,
    "Technical Person Type":d.type,
    "Owner Name":d.owner,
    "Owner Contact No.":d.ownerContact,
    "Owner Address":d.ownerAddress,
    "Structural Engineer":d.structural
  })))

  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Data")

  XLSX.writeFile(wb,"scrutiny_table.xlsx")
}

function resetData(){
  data=[]
  sr=1
  generateTable()
}

// PDF
document.getElementById('pdfUpload').addEventListener('change',function(e){

  let file=e.target.files[0]
  let reader=new FileReader()

  reader.onload=function(){
    let typedarray=new Uint8Array(this.result)

    pdfjsLib.getDocument(typedarray).promise.then(function(pdf){

      let text=""
      let pages=[]

      for(let i=1;i<=pdf.numPages;i++){
        pages.push(
          pdf.getPage(i).then(page=>{
            return page.getTextContent().then(content=>{
              let strings=content.items.map(item=>item.str)
              text+=strings.join("\n")+"\n"
            })
          })
        )
      }

      Promise.all(pages).then(()=>{
        document.getElementById("report").value=text
      })

    })
  }

  reader.readAsArrayBuffer(file)
})

</script>

</body>
</html>
