<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scrutiny Table 3 Extractor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Segoe UI;background:#f1f5f9;padding:20px;}
.container{max-width:1200px;margin:auto;background:white;padding:20px;border-radius:12px;}
textarea{width:100%;height:120px;padding:10px;}
button{padding:10px;margin:5px;background:#2563eb;color:white;border:none;border-radius:6px;}
table{width:100%;margin-top:20px;border-collapse:collapse;}
th,td{border:1px solid #ddd;padding:8px;}
th{background:#111;color:white;}
</style>
</head>

<body>

<div class="container">

<h2>📊 Table 3 Extractor (Smart AI)</h2>

<textarea id="report" placeholder="Paste full data..."></textarea><br>

<button onclick="addEntry()">Extract Table 3</button>
<button onclick="exportExcel()">Download Excel</button>

<table id="table">
<thead>
<tr>
<th>Sr</th>
<th>Technical Person Name</th>
<th>Technical Person Contact No.</th>
<th>Site Address</th>
<th>Technical Person Type</th>
<th>Owner Name</th>
<th>Owner Contact No.</th>
<th>Owner Address</th>
<th>Structural Engineer</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let sr=1

// 🔥 SHORT ADDRESS CLEANER
function cleanAddress(addr){

  if(!addr) return ""

  // remove plot/flat numbers etc.
  addr = addr.replace(/PLOT NO.*?,|FLAT NO.*?,|HOUSE NO.*?,|CTS NO.*?,|KH.NO.*?,|SURVEY NO.*?,/gi,"")

  // extract meaningful part
  let parts = addr.split(",").map(x=>x.trim())

  // keep area + city (last 2 useful parts)
  if(parts.length >= 2){
    return parts[parts.length-2] + ", " + parts[parts.length-1]
  }

  return addr
}

// 🔥 TABLE 3 FILTER
function extractTable3(text){

  let start = text.toLowerCase().indexOf("table 3")
  if(start === -1) return ""

  let sub = text.substring(start)

  // stop at next table (if exists)
  let endMatch = sub.toLowerCase().match(/table\s*\d+/g)
  if(endMatch && endMatch.length > 1){
    let nextIndex = sub.toLowerCase().indexOf(endMatch[1])
    sub = sub.substring(0,nextIndex)
  }

  return sub
}

// 🔥 PARSE TABLE 3
function parseData(text){

  let lines=text.split(/\n+/).map(l=>l.trim()).filter(l=>l)

  let r={}

  for(let i=0;i<lines.length;i++){

    let line=lines[i].toLowerCase()

    if(line.includes("technical person name")){
      r.techName = lines[i].replace(/technical person name/i,"") || lines[i+1]
    }

    else if(line.includes("contact number") && !r.techContact){
      r.techContact = lines[i].replace(/contact number/i,"") || lines[i+1]
    }

    else if(line.includes("site address")){
      r.site = cleanAddress(lines[i].replace(/site address/i,"") || lines[i+1])
    }

    else if(line.includes("technical person type")){
      r.type = lines[i].replace(/.*technical person type/i,"") || lines[i+1]
    }

    else if(line.includes("owner") && !r.owner){
      r.owner = lines[i].replace(/individual owner|owner/i,"") || lines[i+1]
    }

    else if(line.includes("contact number") && r.techContact && !r.ownerContact){
      r.ownerContact = lines[i].replace(/contact number/i,"") || lines[i+1]
    }

    else if(line.includes("postal address")){
      r.ownerAddress = cleanAddress(lines[i].replace(/postal address/i,"") || lines[i+1])
    }

    else if(line.includes("structural engineer name")){
      let val = lines[i].replace(/structural engineer name/i,"") || lines[i+1]
      r.structural = val.toLowerCase().includes("only") ? "-" : val
    }
  }

  return r
}

function addEntry(){

  let fullText=document.getElementById("report").value

  let table3 = extractTable3(fullText)

  if(!table3){
    alert("Table 3 not found!")
    return
  }

  let p=parseData(table3)

  data.push({
    sr,
    techName:p.techName?.trim(),
    techContact:p.techContact?.trim(),
    site:p.site,
    type:p.type?.trim(),
    owner:p.owner?.trim(),
    ownerContact:p.ownerContact?.trim(),
    ownerAddress:p.ownerAddress,
    structural:p.structural || "-"
  })

  sr++
  generateTable()
}

function generateTable(){

  let tbody=document.querySelector("#table tbody")
  tbody.innerHTML=""

  data.forEach(d=>{
    tbody.innerHTML+=`
    <tr>
      <td>${d.sr}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.site}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
    </tr>`
  })
}

// 🔥 EXCEL TABLE EXPORT
function exportExcel(){

  let ws=XLSX.utils.json_to_sheet(data.map(d=>({
    "Sr":d.sr,
    "Technical Person Name":d.techName,
    "Technical Person Contact No.":d.techContact,
    "Site Address":d.site,
    "Technical Person Type":d.type,
    "Owner Name":d.owner,
    "Owner Contact No.":d.ownerContact,
    "Owner Address":d.ownerAddress,
    "Structural Engineer":d.structural
  })))

  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Table 3")

  XLSX.writeFile(wb,"table3_data.xlsx")
}

</script>

</body>
</html>
