<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scrutiny AI Extractor PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  padding:20px;
}

.container{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
}

textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px 16px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover{background:#1d4ed8;}

input[type="text"]{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
  width:200px;
}

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
}

th{
  background:#111827;
  color:white;
}

tr:nth-child(even){background:#f9fafb;}

.status{margin-top:10px;color:green;font-weight:bold;}

.actions button{background:#dc2626;}
.actions .edit{background:#16a34a;}
</style>
</head>

<body>

<div class="container">

<h2>🏗️ Building Scrutiny Extractor PRO</h2>

<input type="file" id="pdfUpload">

<textarea id="report" placeholder="Paste report or upload PDF..."></textarea>

<br>

<button onclick="addEntry()">➕ Add Entry</button>
<button onclick="generateTable()">📊 Generate Table</button>
<button onclick="exportExcel()">⬇ Download Excel</button>
<button onclick="resetData()">♻ Reset</button>

<br><br>

<input type="text" id="search" placeholder="Search..." onkeyup="searchTable()">

<p class="status" id="status"></p>

<table id="table">
<thead>
<tr>
<th>Sr</th>
<th>Tech Person</th>
<th>Contact</th>
<th>Site</th>
<th>Type</th>
<th>Owner</th>
<th>Owner Contact</th>
<th>Owner Address</th>
<th>Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let sr=1

function cleanAddress(address){
  return address
    .replace(/PLOT NO.*?,/gi,"")
    .replace(/HOUSE NO.*?,/gi,"")
    .replace(/CTS NO.*?,/gi,"")
    .replace(/KH.NO.*?,/gi,"")
    .replace(/SURVEY NO.*?,/gi,"")
    .trim()
}

// 🔥 SMART EXTRACTION ENGINE
function parseData(text){

  let lines=text.split(/\n+/).map(l=>l.trim()).filter(l=>l)

  let result={
    techName:"",
    techContact:"",
    site:"",
    type:"",
    owner:"",
    ownerContact:"",
    ownerAddress:"",
    structural:""
  }

  for(let i=0;i<lines.length;i++){

    let line=lines[i].toLowerCase()

    if(line.includes("technical person name")){
      result.techName = lines[i].replace(/technical person name/i,"").trim() || lines[i+1] || ""
    }

    else if(line.includes("contact number") && !result.techContact){
      result.techContact = lines[i].replace(/contact number/i,"").trim() || lines[i+1] || ""
    }

    else if(line.includes("site address")){
      result.site = cleanAddress(lines[i].replace(/site address/i,"").trim() || lines[i+1] || "")
    }

    else if(line.includes("technical person type")){
      result.type = lines[i].replace(/.*technical person type/i,"").trim() || lines[i+1] || ""
    }

    else if(line.includes("individual owner") || (line.includes("owner") && !result.owner)){
      result.owner = lines[i].replace(/individual owner|owner/i,"").trim() || lines[i+1] || ""
    }

    else if(line.includes("contact number") && result.techContact && !result.ownerContact){
      result.ownerContact = lines[i].replace(/contact number/i,"").trim() || lines[i+1] || ""
    }

    else if(line.includes("postal address")){
      result.ownerAddress = lines[i].replace(/postal address/i,"").trim() || lines[i+1] || ""
    }

    else if(line.includes("structural engineer name")){
      let val = lines[i].replace(/structural engineer name/i,"").trim() || lines[i+1] || ""
      if(!val.toLowerCase().includes("only in case")){
        result.structural = val
      }
    }
  }

  return result
}

function addEntry(){

  let text=document.getElementById("report").value

  if(!text.trim()){
    alert("Enter or upload data first!")
    return
  }

  let parsed=parseData(text)

  if(!parsed.techName && !parsed.owner){
    alert("Data not detected properly!")
    return
  }

  data.push({
    sr,
    techName:parsed.techName,
    techContact:parsed.techContact,
    site:parsed.site,
    type:parsed.type,
    owner:parsed.owner,
    ownerContact:parsed.ownerContact,
    ownerAddress:parsed.ownerAddress,
    structural:parsed.structural
  })

  document.getElementById("status").innerText="✅ Auto Extracted Successfully (Sr "+sr+")"

  sr++
  document.getElementById("report").value=""
}

function generateTable(){
  let tbody=document.querySelector("#table tbody")
  tbody.innerHTML=""

  data.forEach((d,i)=>{
    tbody.innerHTML+=`
    <tr>
      <td>${d.sr}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.site}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td class="actions">
        <button class="edit" onclick="editRow(${i})">Edit</button>
        <button onclick="deleteRow(${i})">Delete</button>
      </td>
    </tr>`
  })
}

function deleteRow(i){
  if(confirm("Delete entry?")){
    data.splice(i,1)
    generateTable()
  }
}

function editRow(i){
  let d=data[i]

  document.getElementById("report").value=
`Technical Person Name ${d.techName}
Contact Number ${d.techContact}
Site Address ${d.site}
Technical Person Type ${d.type}
Individual Owner ${d.owner}
Contact Number ${d.ownerContact}
Postal Address ${d.ownerAddress}
Structural Engineer Name ${d.structural}`

  data.splice(i,1)
  generateTable()
}

function searchTable(){
  let val=document.getElementById("search").value.toLowerCase()
  document.querySelectorAll("#table tbody tr").forEach(r=>{
    r.style.display=r.innerText.toLowerCase().includes(val)?"":"none"
  })
}

function exportExcel(){
  let table=document.getElementById("table").outerHTML
  let url='data:application/vnd.ms-excel,'+encodeURIComponent(table)
  let a=document.createElement("a")
  a.href=url
  a.download="scrutiny_data.xls"
  a.click()
}

function resetData(){
  if(confirm("Reset all data?")){
    data=[]
    sr=1
    generateTable()
    document.getElementById("status").innerText="♻ Reset Done"
  }
}

// PDF Extract
document.getElementById('pdfUpload').addEventListener('change',function(e){

  let file=e.target.files[0]
  let reader=new FileReader()

  reader.onload=function(){
    let typedarray=new Uint8Array(this.result)

    pdfjsLib.getDocument(typedarray).promise.then(function(pdf){

      let text=""
      let pages=[]

      for(let i=1;i<=pdf.numPages;i++){
        pages.push(
          pdf.getPage(i).then(page=>{
            return page.getTextContent().then(content=>{
              let strings=content.items.map(item=>item.str)
              text+=strings.join("\n")+"\n"
            })
          })
        )
      }

      Promise.all(pages).then(()=>{
        document.getElementById("report").value=text
        document.getElementById("status").innerText="📄 PDF Loaded"
      })

    })
  }

  reader.readAsArrayBuffer(file)
})

</script>

</body>
</html>
