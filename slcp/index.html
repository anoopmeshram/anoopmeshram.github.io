<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scrutiny Extractor PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{font-family:'Segoe UI';background:#f1f5f9;padding:20px;}
.container{max-width:1200px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.1);}
.topbar{display:flex;justify-content:space-between;flex-wrap:wrap;}
textarea{width:100%;height:130px;padding:10px;border-radius:8px;border:1px solid #ccc;}
button{padding:10px;margin:5px;border:none;border-radius:8px;background:#2563eb;color:white;cursor:pointer;}
.danger{background:#dc2626;}
.edit{background:#16a34a;}
input,select{padding:8px;border-radius:6px;border:1px solid #ccc;margin:5px;}
table{width:100%;margin-top:20px;border-collapse:collapse;}
th,td{border:1px solid #ddd;padding:10px;}
th{background:#111827;color:white;font-weight:bold;cursor:pointer;}
.status{color:green;font-weight:bold;margin-top:10px;}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
<h2>🏗️ Scrutiny Extractor</h2>

<div>
<select id="filterColumn">
  <option value="all">All Columns</option>
  <option value="techName">Technical Person Name</option>
  <option value="techContact">Technical Person Contact No.</option>
  <option value="type">Technical Person Type</option>
  <option value="owner">Owner Name</option>
  <option value="ownerContact">Owner Contact No.</option>
  <option value="ownerAddress">Owner Address</option>
  <option value="structural">Structural Engineer</option>
</select>

<input type="text" id="search" placeholder="Search..." onkeyup="applyFilter()">
</div>
</div>

<!-- MULTI SORT -->
<div>
<b>Sort By:</b><br>

<label><input type="checkbox" value="techName"> Technical Person Name</label>
<label><input type="checkbox" value="techContact"> Technical Person Contact No.</label>
<label><input type="checkbox" value="type"> Technical Person Type</label>
<label><input type="checkbox" value="owner"> Owner Name</label>
<label><input type="checkbox" value="ownerContact"> Owner Contact No.</label>
<label><input type="checkbox" value="ownerAddress"> Owner Address</label>
<label><input type="checkbox" value="structural"> Structural Engineer</label>

<select id="sortOrder">
  <option value="asc">Ascending</option>
  <option value="desc">Descending</option>
</select>

<button onclick="applyMultiSort()">Apply Sort</button>
</div>

<input type="file" id="pdfUpload"><br><br>

<textarea id="report" placeholder="Paste data or upload PDF..."></textarea>

<br>

<button onclick="addEntry()">➕ Extract Table 3</button>
<button onclick="exportExcel()">⬇ Download Excel</button>
<button onclick="clearInput()">🧹 Clear Input</button>
<button onclick="resetData()" class="danger">♻ Reset</button>

<p id="status" class="status"></p>

<table id="table">
<thead>
<tr>
<th onclick="sortTable(0)">Sr. No.</th>
<th onclick="sortTable(1)">Technical Person Name</th>
<th onclick="sortTable(2)">Technical Person Contact No.</th>
<th onclick="sortTable(3)">Technical Person Type</th>
<th onclick="sortTable(4)">Owner Name</th>
<th onclick="sortTable(5)">Owner Contact No.</th>
<th onclick="sortTable(6)">Owner Address</th>
<th onclick="sortTable(7)">Structural Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let sortDir=true

function extractTable3(text){
  let start=text.toLowerCase().indexOf("table 3")
  if(start===-1){
    start=text.toLowerCase().indexOf("applicant/technical person")
    if(start===-1) return ""
  }
  return text.substring(start)
}

function parseData(text){

  let lines=text.split(/\n+/).map(l=>l.trim()).filter(l=>l)
  let r={}

  for(let i=0;i<lines.length;i++){

    let line=lines[i].toLowerCase()

    if(line.includes("technical person name"))
      r.techName = lines[i].replace(/technical person name/i,"") || lines[i+1]

    else if(line.includes("contact number") && !r.techContact)
      r.techContact = lines[i].replace(/contact number/i,"") || lines[i+1]

    else if(line.includes("technical person type"))
      r.type = lines[i].replace(/.*technical person type/i,"") || lines[i+1]

    else if(line.includes("owner") && !r.owner)
      r.owner = lines[i].replace(/individual owner|owner/i,"") || lines[i+1]

    else if(line.includes("contact number") && r.techContact && !r.ownerContact)
      r.ownerContact = lines[i].replace(/contact number/i,"") || lines[i+1]

    else if(line.includes("postal address"))
      r.ownerAddress = lines[i].replace(/postal address/i,"") || lines[i+1]

    else if(line.includes("structural engineer name")){
      let val = lines[i].replace(/structural engineer name/i,"") || lines[i+1]
      r.structural = val.toLowerCase().includes("only") ? "-" : val
    }
  }

  return r
}

function addEntry(){

  let text=document.getElementById("report").value
  let table3=extractTable3(text)

  if(!table3){alert("Table 3 not found!");return}

  let p=parseData(table3)

  data.push({
    techName:p.techName?.trim(),
    techContact:p.techContact?.trim(),
    type:p.type?.trim(),
    owner:p.owner?.trim(),
    ownerContact:p.ownerContact?.trim(),
    ownerAddress:p.ownerAddress?.trim(),
    structural:p.structural||"-"
  })

  document.getElementById("status").innerText=`✅ Entry Added (Sr. No. ${data.length})`
  document.getElementById("report").value=""

  generateTable()
}

function generateTable(){

  let tbody=document.querySelector("#table tbody")
  tbody.innerHTML=""

  data.forEach((d,i)=>{
    tbody.innerHTML+=`
    <tr>
      <td>${i+1}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td>
        <button class="edit" onclick="editRow(${i})">Edit</button>
        <button class="danger" onclick="deleteRow(${i})">Delete</button>
      </td>
    </tr>`
  })

  applyFilter()
}

function applyFilter(){

  let val=document.getElementById("search").value.toLowerCase()
  let col=document.getElementById("filterColumn").value

  let map={techName:1,techContact:2,type:3,owner:4,ownerContact:5,ownerAddress:6,structural:7}

  document.querySelectorAll("#table tbody tr").forEach(row=>{
    if(col==="all"){
      row.style.display=row.innerText.toLowerCase().includes(val)?"":"none"
    }else{
      let text=row.children[map[col]].innerText.toLowerCase()
      row.style.display=text.includes(val)?"":"none"
    }
  })
}

function applyMultiSort(){

  let selected=[...document.querySelectorAll("input[type=checkbox]:checked")].map(cb=>cb.value)
  let order=document.getElementById("sortOrder").value

  data.sort((a,b)=>{
    for(let key of selected){
      let A=(a[key]||"").toLowerCase()
      let B=(b[key]||"").toLowerCase()
      if(A<B) return order==="asc"?-1:1
      if(A>B) return order==="asc"?1:-1
    }
    return 0
  })

  generateTable()
}

function sortTable(col){

  let keys=["","techName","techContact","type","owner","ownerContact","ownerAddress","structural"]

  data.sort((a,b)=>{
    let A=(a[keys[col]]||"").toLowerCase()
    let B=(b[keys[col]]||"").toLowerCase()
    return sortDir?A.localeCompare(B):B.localeCompare(A)
  })

  sortDir=!sortDir
  generateTable()
}

function exportExcel(){

  let rows=[...document.querySelectorAll("#table tbody tr")]
    .filter(r=>r.style.display!=="none")

  let dataExport=rows.map((r,i)=>({
    "Sr. No.":i+1,
    "Technical Person Name":r.children[1].innerText,
    "Technical Person Contact No.":r.children[2].innerText,
    "Technical Person Type":r.children[3].innerText,
    "Owner Name":r.children[4].innerText,
    "Owner Contact No.":r.children[5].innerText,
    "Owner Address":r.children[6].innerText,
    "Structural Engineer":r.children[7].innerText
  }))

  let ws=XLSX.utils.json_to_sheet(dataExport)
  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Data")
  XLSX.writeFile(wb,"filtered_data.xlsx")
}

function deleteRow(i){data.splice(i,1);generateTable()}
function clearInput(){document.getElementById("report").value=""}

function resetData(){
  data=[]
  document.querySelector("#table tbody").innerHTML=""
  document.getElementById("report").value=""
  document.getElementById("search").value=""
  document.getElementById("filterColumn").value="all"
  document.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.checked=false)
  document.getElementById("status").innerText="✅ Successfully Reset"
}

function editRow(i){
  document.getElementById("report").value=data[i].techName
  data.splice(i,1)
  generateTable()
}

// PDF
document.getElementById('pdfUpload').addEventListener('change',function(e){

  let file=e.target.files[0]
  let reader=new FileReader()

  reader.onload=function(){
    let typedarray=new Uint8Array(this.result)

    pdfjsLib.getDocument(typedarray).promise.then(function(pdf){

      let text=""
      let pages=[]

      for(let i=1;i<=pdf.numPages;i++){
        pages.push(
          pdf.getPage(i).then(page=>{
            return page.getTextContent().then(content=>{
              let strings=content.items.map(item=>item.str)
              text+=strings.join("\n")+"\n"
            })
          })
        )
      }

      Promise.all(pages).then(()=>{
        document.getElementById("report").value=text
      })

    })
  }

  reader.readAsArrayBuffer(file)
})

</script>

</body>
</html>
