<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leads Extractor Tool</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body { font-family: Arial; padding: 20px; }

#dropArea {
  border: 2px dashed #999;
  padding: 20px;
  text-align: center;
  margin-bottom: 10px;
}

table {
  border-collapse: collapse;
  margin-top: 20px;
  width: 100%;
}

th, td {
  border: 1px solid #000;
  padding: 6px;
}

th { background: #f2f2f2; }
</style>
</head>

<body>

<h2>📸 Screenshot to Leads Table Extractor</h2>

<div id="dropArea">
📋 Paste (Ctrl+V) OR 📁 Upload OR 🖱 Drag & Drop Screenshot Here
</div>

<input type="file" id="imageInput">
<button onclick="extractText()">Extract Table</button>

<br><br>
<img id="preview" style="max-width:300px;"/>

<p id="status"></p>

<table id="resultTable">
<thead>
<tr>
  <th>Lead No.</th>
  <th>Policy No.</th>
  <th>Customer Name</th>
  <th>Mobile No.</th>
  <th>Lead Mode</th>
  <th>Lead Code</th>
  <th>Status</th>
  <th>Register Date</th>
  <th>Owner</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
let selectedImage = null;

// Upload
imageInput.addEventListener("change", e => {
  selectedImage = e.target.files[0];
  preview(selectedImage);
});

// Paste
document.addEventListener("paste", e => {
  for (let item of e.clipboardData.items) {
    if (item.type.includes("image")) {
      selectedImage = item.getAsFile();
      preview(selectedImage);
      extractText();
    }
  }
});

// Drag drop
dropArea.addEventListener("dragover", e => {
  e.preventDefault();
  dropArea.style.background = "#eee";
});

dropArea.addEventListener("dragleave", () => {
  dropArea.style.background = "";
});

dropArea.addEventListener("drop", e => {
  e.preventDefault();
  dropArea.style.background = "";
  selectedImage = e.dataTransfer.files[0];
  preview(selectedImage);
  extractText();
});

// Preview
function preview(file) {
  const reader = new FileReader();
  reader.onload = e => previewImg.src = e.target.result;
  reader.readAsDataURL(file);
}

// MAIN LOGIC
function extractText() {
  if (!selectedImage) return alert("Upload/Paste image first");

  status.innerText = "Processing...";

  Tesseract.recognize(selectedImage, 'eng')
    .then(({ data: { text } }) => {

      status.innerText = "Extraction Done";

      const tbody = document.querySelector("#resultTable tbody");
      tbody.innerHTML = "";

      const lines = text.split("\n");

      lines.forEach(line => {

        const lead = line.match(/\b\d{8}\b/);
        const numbers = line.match(/\d{10}/g) || [];
        const date = line.match(/\d{2}-[A-Z]{3}-\d{2}/);

        if (!lead) return;

        // Identify policy & mobile correctly
        let policy = "";
        let mobile = "";

        numbers.forEach(num => {
          if (num.startsWith("0") && !policy) policy = num;
          else if (!mobile) mobile = num;
        });

        // Clean name properly
        let name = line;

        name = name
          .replace(/\d+/g, "") // remove numbers
          .replace(/D2SM_AVER|UPS_PROP|ASSIGNED|APR|DSM|AVER/gi, "")
          .replace(/Anoop bandu Meshram/gi, "")
          .replace(/\d{2}-[A-Z]{3}-\d{2}/g, "")
          .replace(/[^\w\s]/g, "")
          .replace(/\s+/g, " ")
          .trim();

        // Remove extra words after 3–4 tokens (optional refinement)
        let words = name.split(" ");
        if (words.length > 4) {
          name = words.slice(0, 4).join(" ");
        }

        const row = `
        <tr>
          <td>${lead[0]}</td>
          <td>${policy}</td>
          <td>${name}</td>
          <td>${mobile}</td>
          <td>D2SM_AVER</td>
          <td>UPS_PROP</td>
          <td>ASSIGNED</td>
          <td>${date ? date[0] : ""}</td>
          <td>Anoop bandu Meshram</td>
        </tr>
        `;

        tbody.innerHTML += row;

      });

    });
}
</script>

</body>
</html>
