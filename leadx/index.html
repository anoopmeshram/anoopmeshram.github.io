<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leads Extractor</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body { font-family: Arial; padding: 20px; }

#dropArea {
  border: 2px dashed #999;
  padding: 20px;
  text-align: center;
  margin-bottom: 10px;
}

table {
  border-collapse: collapse;
  margin-top: 20px;
  width: 100%;
}

th, td {
  border: 1px solid #000;
  padding: 6px;
}

th { background: #eee; }
</style>
</head>

<body>

<h2>📸 Leads Extractor</h2>

<div id="dropArea">Paste (Ctrl+V) / Upload / Drag Image</div>

<input type="file" id="imageInput">
<button onclick="extractText()">Extract</button>

<br><br>
<img id="preview" style="max-width:300px;">

<p id="status"></p>

<table id="resultTable">
<thead>
<tr>
<th>Lead No.</th>
<th>Policy No.</th>
<th>Customer Name</th>
<th>Mobile No.</th>
<th>Lead Mode</th>
<th>Lead Code</th>
<th>Status</th>
<th>Register Date</th>
<th>Owner</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
let selectedImage = null;

// Upload
imageInput.onchange = e => {
  selectedImage = e.target.files[0];
  preview(selectedImage);
};

// Paste
document.addEventListener("paste", e => {
  for (let item of e.clipboardData.items) {
    if (item.type.includes("image")) {
      selectedImage = item.getAsFile();
      preview(selectedImage);
      extractText();
    }
  }
});

// Drag & Drop
dropArea.ondragover = e => e.preventDefault();

dropArea.ondrop = e => {
  e.preventDefault();
  selectedImage = e.dataTransfer.files[0];
  preview(selectedImage);
  extractText();
};

// Preview
function preview(file){
  const r = new FileReader();
  r.onload = e => preview.src = e.target.result;
  r.readAsDataURL(file);
}

// MAIN FUNCTION
function extractText(){

  if(!selectedImage) return alert("Upload image");

  status.innerText = "Processing...";

  Tesseract.recognize(selectedImage, 'eng')
  .then(({data:{text}})=>{

    status.innerText = "Done";

    const tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = "";

    const lines = text.split("\n");

    lines.forEach(line=>{

      const lead = line.match(/\b\d{8}\b/);
      if(!lead) return;

      const numbers = line.match(/\d{10}/g) || [];
      const dateMatch = line.match(/\d{2}-[A-Z]{3}-\d{2}/);

      let policy = "";
      let mobile = "";

      numbers.forEach(n=>{
        if(n.startsWith("0") && !policy) policy = n;
        else if(!mobile) mobile = n;
      });

      // 🔥 FINAL NAME CLEANING LOGIC
      let clean = line
        .replace(/\d+/g," ")
        .replace(/ASSIGNED|D2SM_AVER|UPS_PROP|APR|DSM|AVER/gi," ")
        .replace(/Anoop bandu Meshram/gi," ")
        .replace(/\d{2}-[A-Z]{3}-\d{2}/g," ")
        .replace(/[^A-Za-z\s]/g," ")
        .replace(/\s+/g," ")
        .trim();

      let words = clean.split(" ").filter(w => w.length >= 3);

      let fixed = [];

      words.forEach(w=>{
        if(w.length > 8){
          let mid = Math.floor(w.length/2);
          fixed.push(w.slice(0,mid), w.slice(mid));
        } else {
          fixed.push(w);
        }
      });

      let name = fixed.slice(0,3).join(" ");

      const row = `
      <tr>
        <td>${lead[0]}</td>
        <td>${policy}</td>
        <td>${name}</td>
        <td>${mobile}</td>
        <td>D2SM_AVER</td>
        <td>UPS_PROP</td>
        <td>ASSIGNED</td>
        <td>${dateMatch ? dateMatch[0] : ""}</td>
        <td>Anoop bandu Meshram</td>
      </tr>`;

      tbody.innerHTML += row;

    });

  });
}
</script>

</body>
</html>
