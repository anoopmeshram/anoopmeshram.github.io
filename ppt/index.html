<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Slide Generator Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Lora:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --bg: #f1f5f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Tool Interface Styles */
        .input-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 40px;
        }

        h1 { color: var(--primary); margin-bottom: 20px; }

        input {
            width: 70%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 25px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover { background: #2563eb; }

        /* Slide Preview Area */
        #presentation-area {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Dynamic Slide Styling (Same as previous design) */
        .slide {
            background: white;
            aspect-ratio: 16/9;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 50px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .slide-title-layout {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: var(--primary);
            color: white;
            margin: -50px; /* Offset parent padding */
        }

        .slide-title-layout h2 { font-family: 'Lora', serif; font-size: 4rem; margin: 0; }

        .slide-header {
            border-bottom: 3px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .slide-header h3 { font-family: 'Lora', serif; font-size: 2rem; margin: 0; color: var(--primary); }

        .slide-body { flex: 1; font-size: 1.2rem; line-height: 1.6; color: #334155; }

        .slide-footer {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .list-item { margin-bottom: 15px; display: flex; align-items: start; gap: 10px; }
        .list-item i { color: var(--accent); margin-top: 5px; }

        /* Print Mode */
        @media print {
            .input-section { display: none; }
            body { padding: 0; background: white; }
            .slide { box-shadow: none; border: none; page-break-after: always; }
        }
    </style>
</head>
<body>

    <div class="input-section">
        <h1>PPT Generator Tool</h1>
        <p>Apna topic enter karein aur magically slides generate karein!</p>
        <input type="text" id="topicInput" placeholder="Ex: IS 456, Digital Marketing, Global Warming...">
        <button onclick="generatePPT()">Slides Banayein</button>
    </div>

    <div id="presentation-area">
        </div>

    <script>
        function generatePPT() {
            const topic = document.getElementById('topicInput').value;
            if (!topic) { alert("Please enter a topic!"); return; }

            const container = document.getElementById('presentation-area');
            container.innerHTML = ''; // Clear previous

            // Dummy Data Structure (Asli tool mein aap AI API use kar sakte hain)
            const slidesData = [
                { type: 'title', title: topic, subtitle: 'Comprehensive Overview and Analysis' },
                { type: 'content', header: 'Introduction', points: [`What is ${topic}?`, `Historical background and evolution.`, `Importance in the current industry standards.`] },
                { type: 'content', header: 'Key Objectives', points: ['Ensuring structural safety and durability.', 'Providing standardized guidelines for professionals.', 'Improving quality control and efficiency.'] },
                { type: 'content', header: 'Core Provisions', points: ['Material specifications and testing.', 'Design methodologies and safety factors.', 'Serviceability and maintenance requirements.'] },
                { type: 'title', title: 'Questions?', subtitle: 'Thank you for your attention!' }
            ];

            slidesData.forEach((data, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';

                if (data.type === 'title') {
                    slideDiv.innerHTML = `
                        <div class="slide-title-layout">
                            <h2>${data.title}</h2>
                            <p style="font-size:1.5rem; opacity:0.8; margin-top:20px;">${data.subtitle}</p>
                        </div>
                    `;
                } else {
                    let pointsHTML = data.points.map(p => `
                        <div class="list-item">
                            <i class="fa-solid fa-circle-check"></i>
                            <span>${p}</span>
                        </div>
                    `).join('');

                    slideDiv.innerHTML = `
                        <div class="slide-header">
                            <h3>${data.header}</h3>
                        </div>
                        <div class="slide-body">
                            ${pointsHTML}
                        </div>
                        <div class="slide-footer">Page ${index + 1} | Generated by AI Tool</div>
                    `;
                }
                container.appendChild(slideDiv);
            });

            // Scroll to slides
            window.scrollTo({ top: document.querySelector('.input-section').scrollHeight + 40, behavior: 'smooth' });
        }
    </script>
</body>
</html>
