<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Pencil Sketch Generator</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:30px;
}

.container{
  max-width:700px;
  margin:auto;
  background:#1e293b;
  padding:20px;
  border-radius:12px;
}

input, button{
  margin:10px;
  padding:10px;
  border-radius:8px;
  border:none;
}

button{
  background:#22c55e;
  color:white;
  cursor:pointer;
}

img{
  margin-top:20px;
  max-width:100%;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🔥 AI Pencil Sketch Generator</h2>

  <input type="file" id="imageInput">
  <br>
  <button onclick="generate()">Convert to Sketch</button>

  <div id="output"></div>
</div>

<script>
async function generate(){
  const file = document.getElementById("imageInput").files[0];
  if(!file){
    alert("Upload image first");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function(){
    const base64 = reader.result.split(",")[1];

    const response = await fetch("https://api.openai.com/v1/images/edits", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer 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"
      },
      body: JSON.stringify({
        model: "gpt-image-1",
        prompt: "convert this image into ultra realistic pencil sketch, highly detailed shading, professional drawing, black and white",
        image: base64,
        size: "1024x1024"
      })
    });

    const data = await response.json();

    const img = document.createElement("img");
    img.src = "data:image/png;base64," + data.data[0].b64_json;

    document.getElementById("output").innerHTML = "";
    document.getElementById("output").appendChild(img);
  }

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
