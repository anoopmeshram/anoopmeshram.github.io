<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MECL Measurement Sheet</title>

<style>
body {
    font-family: "Times New Roman", serif;
    margin: 0;
    background: #e6e6e6;
}

/* HEADER */
.header {
    background: maroon;
    color: white;
    text-align: center;
    padding: 12px;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
}

/* MAIN BOX */
.container {
    width: 85%;
    margin: 20px auto;
    background: white;
    border: 2px solid black;
    padding: 20px;
}

/* FORM GRID */
.row {
    display: flex;
    margin-bottom: 10px;
}

.label {
    width: 30%;
    font-weight: bold;
}

.input {
    width: 70%;
}

input, textarea {
    width: 100%;
    padding: 5px;
    border: 1px solid black;
    font-family: "Times New Roman";
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th {
    background: #d9d9d9;
    font-weight: bold;
}

table, th, td {
    border: 1px solid black;
}

td, th {
    padding: 6px;
    text-align: center;
}

/* TOTAL */
.total-row td {
    font-weight: bold;
    background: #f2f2f2;
}

/* BUTTONS */
.buttons {
    margin-top: 15px;
    text-align: center;
}

button {
    padding: 8px 15px;
    margin: 5px;
    border: 1px solid black;
    background: white;
    cursor: pointer;
}

button:hover {
    background: #ddd;
}

/* PRINT */
@media print {
    .buttons {
        display: none;
    }
    body {
        background: white;
    }
}
</style>

</head>

<body>

<div class="header">
MECL MEASUREMENT SHEET
</div>

<div class="container">

<h3 style="text-align:center;">General Details</h3>

<div class="row">
<div class="label">Division:</div>
<div class="input"><input></div>
</div>

<div class="row">
<div class="label">Name of Work:</div>
<div class="input"><textarea></textarea></div>
</div>

<div class="row">
<div class="label">Agency:</div>
<div class="input"><input></div>
</div>

<div class="row">
<div class="label">Work Order No:</div>
<div class="input"><input></div>
</div>

<div class="row">
<div class="label">Date:</div>
<div class="input"><input type="date"></div>
</div>

<h3 style="text-align:center;">Measurement</h3>

<table>
<thead>
<tr>
<th>Sr. No.</th>
<th>Description</th>
<th>L (m)</th>
<th>B (m)</th>
<th>D (m)</th>
<th>Contents (m³)</th>
</tr>
</thead>

<tbody id="tbody">
<tr>
<td>1</td>
<td><input></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input readonly></td>
</tr>
</tbody>

<tfoot>
<tr class="total-row">
<td colspan="5">Total</td>
<td id="total">0.00</td>
</tr>
</tfoot>

</table>

<div class="buttons">
<button onclick="addRow()">➕ Add Row</button>
<button onclick="window.print()">🖨️ Print</button>
<button onclick="resetForm()">🔄 Reset</button>
</div>

</div>

<script>

function calc(el) {
    let row = el.parentElement.parentElement;
    let inputs = row.querySelectorAll("input");

    let l = parseFloat(inputs[1].value) || 0;
    let b = parseFloat(inputs[2].value) || 0;
    let d = parseFloat(inputs[3].value) || 0;

    let contents = l * b * d;

    inputs[4].value = contents.toFixed(2);

    updateTotal();
}

function updateTotal() {
    let rows = document.querySelectorAll("#tbody tr");
    let total = 0;

    rows.forEach(row => {
        let val = parseFloat(row.querySelectorAll("input")[4].value) || 0;
        total += val;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

function addRow() {
    let tbody = document.getElementById("tbody");
    let rowCount = tbody.rows.length + 1;

    let row = tbody.insertRow();

    row.innerHTML = `
        <td>${rowCount}</td>
        <td><input></td>
        <td><input type="number" oninput="calc(this)"></td>
        <td><input type="number" oninput="calc(this)"></td>
        <td><input type="number" oninput="calc(this)"></td>
        <td><input readonly></td>
    `;
}

function resetForm() {
    document.querySelectorAll("input, textarea").forEach(el => el.value = "");

    let tbody = document.getElementById("tbody");
    tbody.innerHTML = `
        <tr>
            <td>1</td>
            <td><input></td>
            <td><input type="number" oninput="calc(this)"></td>
            <td><input type="number" oninput="calc(this)"></td>
            <td><input type="number" oninput="calc(this)"></td>
            <td><input readonly></td>
        </tr>
    `;

    document.getElementById("total").innerText = "0.00";
}

</script>

</body>
</html>
