<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MECL Measurement</title>

<style>
body {
    font-family: "Times New Roman", serif;
    margin: 0;
    background: #f2f2f2;
}

/* HEADER */
.header {
    background: maroon;
    color: white;
    text-align: center;
    padding: 10px;
    font-size: 22px;
    font-weight: bold;
}

/* PAGE */
.page {
    width: 900px;
    margin: 20px auto;
    background: white;
    border: 2px solid black;
    padding: 15px;
}

/* DETAILS */
.details {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

.details td {
    padding: 6px;
    vertical-align: middle;
}

/* INPUT */
input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: "Times New Roman";
}

/* TEXTAREA */
textarea {
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    overflow: hidden;
    background: transparent;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    table-layout: fixed;
}

th {
    background: maroon;
    color: white;
}

table, th, td {
    border: 1px solid black;
}

td, th {
    padding: 5px;
    height: 30px;
}

/* COLUMN WIDTH */
colgroup col:nth-child(1){width:6%}
colgroup col:nth-child(2){width:34%}
colgroup col:nth-child(3){width:10%}
colgroup col:nth-child(4){width:12%}
colgroup col:nth-child(5){width:12%}
colgroup col:nth-child(6){width:12%}
colgroup col:nth-child(7){width:14%}

/* ALIGN */
td:nth-child(1){text-align:right;}
td:nth-child(2){text-align:left;}
td:nth-child(n+3){text-align:center;}

/* BUTTONS */
.buttons {
    text-align: center;
    margin-top: 10px;
}

button {
    background: maroon;
    color: white;
    border: none;
    padding: 8px 15px;
    margin: 5px;
}

/* PRINT DARK */
@media print {
    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .buttons { display: none; }

    table, th, td {
        border: 1.5px solid black !important;
    }

    textarea {
        height: auto !important;
        overflow: visible !important;
    }

    body { background: white; }
}
</style>

</head>

<body>

<div class="header">MECL</div>

<div class="page">

<!-- DETAILS -->
<table class="details">

<tr>
<td style="width:25%;"><b>Division:</b></td>
<td colspan="3"><input></td>
</tr>

<tr>
<td><b>Name of Work:</b></td>
<td colspan="3"><input></td>
</tr>

<tr>
<td><b>Agency by which work is executed:</b></td>
<td colspan="3"><input></td>
</tr>

<tr>
<td><b>Work Order No.:</b></td>
<td><input></td>
<td><b>Date:</b></td>
<td><input type="date"></td>
</tr>

<tr>
<td><b>Date of Start/Handling Over the Site:</b></td>
<td><input type="date" placeholder="dd/mm/yyyy"></td>
<td></td>
<td></td>
</tr>

<tr>
<td><b>Date of Completion of the Work:</b></td>
<td><input type="date" placeholder="dd/mm/yyyy"></td>
<td></td>
<td></td>
</tr>

</table>

<h3 style="text-align:center;">MEASUREMENT</h3>

<!-- TABLE -->
<table>
<colgroup>
<col><col><col><col><col><col><col>
</colgroup>

<thead>
<tr>
<th>Sr. No.</th>
<th>Description</th>
<th>No.</th>
<th>L</th>
<th>B</th>
<th>D</th>
<th>Contents</th>
</tr>
</thead>

<tbody id="tbody">
<tr>
<td>1</td>
<td><textarea oninput="autoGrow(this)"></textarea></td>
<td><input type="number"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input readonly></td>
</tr>
</tbody>

<tfoot>
<tr>
<td colspan="6" style="font-weight:bold;">Total</td>
<td id="total">0.00</td>
</tr>
</tfoot>

</table>

<div class="buttons">
<button onclick="addRow()">Add Row</button>
<button onclick="window.print()">Print</button>
<button onclick="resetForm()">Reset</button>
</div>

</div>

<script>

function calc(el){
    let row = el.closest("tr");
    let inputs = row.querySelectorAll("input");

    let l = parseFloat(inputs[2].value)||0;
    let b = parseFloat(inputs[3].value)||0;
    let d = parseFloat(inputs[4].value)||0;

    inputs[5].value = (l*b*d).toFixed(2);
    updateTotal();
}

function updateTotal(){
    let total=0;
    document.querySelectorAll("#tbody tr").forEach(r=>{
        total+=parseFloat(r.querySelectorAll("input")[5].value)||0;
    });
    document.getElementById("total").innerText=total.toFixed(2);
}

function addRow(){
    let tbody=document.getElementById("tbody");
    let n=tbody.rows.length+1;

    let row=tbody.insertRow();
    row.innerHTML=`
    <td>${n}</td>
    <td><textarea oninput="autoGrow(this)"></textarea></td>
    <td><input type="number"></td>
    <td><input type="number" oninput="calc(this)"></td>
    <td><input type="number" oninput="calc(this)"></td>
    <td><input type="number" oninput="calc(this)"></td>
    <td><input readonly></td>`;
}

function resetForm(){
    document.querySelectorAll("input,textarea").forEach(e=>e.value="");
    document.getElementById("total").innerText="0.00";
}

function autoGrow(el){
    el.style.height="auto";
    el.style.height=el.scrollHeight+"px";
}

</script>

</body>
</html>
