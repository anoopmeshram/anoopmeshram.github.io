<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MECL Measurement Book</title>

<style>
body {
    font-family: "Times New Roman", serif;
    margin: 0;
    background: #f2f2f2;
}

/* HEADER */
.header {
    background: maroon;
    color: white;
    text-align: center;
    padding: 12px;
    font-size: 24px;
    font-weight: bold;
}

/* PAGE */
.page {
    width: 900px;
    margin: 20px auto;
    background: white;
    border: 2px solid black;
    padding: 20px;
}

/* DETAILS TABLE */
.details {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

.details td {
    padding: 6px;
    vertical-align: middle;
}

.label {
    width: 30%;
    font-weight: bold;
}

input {
    width: 98%;
    border: none;
    border-bottom: 1px solid black;
    font-family: "Times New Roman";
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    table-layout: fixed;
}

th {
    background: maroon;
    color: white;
}

table, th, td {
    border: 1px solid black;
}

td, th {
    padding: 5px;
    height: 35px;
}

/* COLUMN WIDTH */
colgroup col:nth-child(1){width:6%}
colgroup col:nth-child(2){width:34%}
colgroup col:nth-child(3){width:10%}
colgroup col:nth-child(4){width:12%}
colgroup col:nth-child(5){width:12%}
colgroup col:nth-child(6){width:12%}
colgroup col:nth-child(7){width:14%}

/* ALIGNMENT */
td:nth-child(1){text-align:right;}
td:nth-child(2){text-align:left;}
td:nth-child(n+3){text-align:center;}

/* TEXTAREA */
textarea {
    width: 98%;
    border: none;
    resize: none;
    overflow: hidden;
}

/* TOTAL */
.total-row td {
    font-weight: bold;
}

/* BUTTONS */
.buttons {
    text-align: center;
    margin-top: 15px;
}

button {
    padding: 8px 15px;
    margin: 5px;
    background: maroon;
    color: white;
    border: none;
}

/* PRINT */
@media print {
    .buttons {display:none;}
}
</style>

</head>

<body>

<div class="header">MECL</div>

<div class="page">

<table class="details">
<tr>
<td class="label">Division:</td>
<td><input></td>
</tr>

<tr>
<td class="label">Name of Work:</td>
<td><input></td>
</tr>

<tr>
<td class="label">Agency by which work is executed:</td>
<td><input></td>
</tr>

<tr>
<td class="label">Work Order No:</td>
<td><input></td>
<td class="label">Date:</td>
<td><input type="date"></td>
</tr>

<tr>
<td class="label">Date of Start/Handling Over the Site:</td>
<td><input type="date"></td>
</tr>

<tr>
<td class="label">Date of Completion of the Work:</td>
<td><input type="date"></td>
</tr>
</table>

<h3 style="text-align:center; margin-top:15px;">MEASUREMENT</h3>

<table>
<colgroup>
<col><col><col><col><col><col><col>
</colgroup>

<thead>
<tr>
<th>Sr. No.</th>
<th>Description</th>
<th>No.</th>
<th>L (m)</th>
<th>B (m)</th>
<th>D (m)</th>
<th>Contents</th>
</tr>
</thead>

<tbody id="tbody">
<tr>
<td>1</td>
<td><textarea oninput="autoGrow(this)"></textarea></td>
<td><input type="number"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input readonly></td>
</tr>
</tbody>

<tfoot>
<tr class="total-row">
<td colspan="6">Total</td>
<td id="total">0.00</td>
</tr>
</tfoot>
</table>

<div class="buttons">
<button onclick="addRow()">Add Row</button>
<button onclick="window.print()">Print</button>
<button onclick="resetForm()">Reset</button>
</div>

</div>

<script>

function calc(el){
    let row = el.closest("tr");
    let inputs = row.querySelectorAll("input");

    let l = parseFloat(inputs[2].value)||0;
    let b = parseFloat(inputs[3].value)||0;
    let d = parseFloat(inputs[4].value)||0;

    let result = l*b*d;
    inputs[5].value = result.toFixed(2);

    updateTotal();
}

function updateTotal(){
    let rows = document.querySelectorAll("#tbody tr");
    let total = 0;

    rows.forEach(r=>{
        let val = parseFloat(r.querySelectorAll("input")[5].value)||0;
        total+=val;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

function addRow(){
    let tbody = document.getElementById("tbody");
    let n = tbody.rows.length+1;

    let row = tbody.insertRow();

    row.innerHTML = `
    <td>${n}</td>
    <td><textarea oninput="autoGrow(this)"></textarea></td>
    <td><input type="number"></td>
    <td><input type="number" oninput="calc(this)"></td>
    <td><input type="number" oninput="calc(this)"></td>
    <td><input type="number" oninput="calc(this)"></td>
    <td><input readonly></td>
    `;
}

function resetForm(){
    document.querySelectorAll("input, textarea").forEach(e=>e.value="");
    document.getElementById("total").innerText="0.00";
}

function autoGrow(el){
    el.style.height="auto";
    el.style.height=el.scrollHeight+"px";
}

</script>

</body>
</html>
