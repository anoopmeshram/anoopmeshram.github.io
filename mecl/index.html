<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MECL Measurement Book</title>

<style>
body {
    font-family: "Times New Roman", serif;
    margin: 0;
    background: #f2f2f2;
}

/* TOP BAR */
.topbar {
    background: maroon;
    color: white;
    padding: 10px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

/* PAGE */
.page {
    width: 900px;
    margin: 20px auto;
    background: white;
    border: 2px solid black;
    padding: 20px;
}

/* HEADER */
.header {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

/* MB INFO */
.mbinfo {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

/* DETAILS */
.details {
    border: 1px solid black;
    margin-top: 10px;
}

.details div {
    border-bottom: 1px solid black;
    padding: 5px;
}

.details div:last-child {
    border-bottom: none;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    table-layout: fixed;
}

th {
    background: maroon;
    color: white;
}

table, th, td {
    border: 1px solid black;
}

td, th {
    padding: 5px;
    height: 35px;
    vertical-align: middle;
}

/* ALIGNMENTS */
td:nth-child(1) { text-align: right; }   /* Sr. No. */
td:nth-child(2) { text-align: left; }    /* Description */
td:nth-child(n+3) { text-align: center; } /* Rest */

/* INPUT */
input {
    width: 95%;
    border: none;
    text-align: center;
    font-family: "Times New Roman";
}

/* TOTAL */
.total-row td {
    font-weight: bold;
    background: #eee;
}

/* SIGNATURE */
.sign {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    text-align: center;
}

/* BUTTONS */
.buttons {
    text-align: center;
    margin-top: 15px;
}

button {
    padding: 8px 15px;
    margin: 5px;
    border: 1px solid maroon;
    background: maroon;
    color: white;
    cursor: pointer;
}

button:hover {
    background: darkred;
}

/* PRINT */
@media print {
    .buttons { display: none; }
    body { background: white; }
}
</style>

</head>

<body>

<div class="topbar">
MECL MEASUREMENT BOOK
</div>

<div class="page">

<div class="header">Measurement Book</div>

<div class="mbinfo">
<div>MB No: <input></div>
<div>Page No: <input></div>
</div>

<div class="details">
<div>Division: <input></div>
<div>Name of Work: <input></div>
<div>Agency: <input></div>
<div>Work Order No: <input></div>
<div>Date: <input type="date"></div>
</div>

<table>
<thead>
<tr>
<th>Sr. No.</th>
<th>Description of Item</th>
<th>No.</th>
<th>L (m)</th>
<th>B (m)</th>
<th>D (m)</th>
<th>Contents</th>
</tr>
</thead>

<tbody id="tbody">
<tr>
<td>1</td>
<td><input></td>
<td><input type="number"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input readonly></td>
</tr>
</tbody>

<tfoot>
<tr class="total-row">
<td colspan="6">Total</td>
<td id="total">0.00</td>
</tr>
</tfoot>

</table>

<div class="sign">
<div>
<br><br>
_________________<br>
Contractor
</div>

<div>
<br><br>
_________________<br>
Junior Engineer
</div>

<div>
<br><br>
_________________<br>
Assistant Engineer
</div>
</div>

<div class="buttons">
<button onclick="addRow()">➕ Add Row</button>
<button onclick="window.print()">🖨️ Print</button>
<button onclick="resetForm()">🔄 Reset</button>
</div>

</div>

<script>

function calc(el) {
    let row = el.closest("tr");
    let inputs = row.querySelectorAll("input");

    let l = parseFloat(inputs[2].value) || 0;
    let b = parseFloat(inputs[3].value) || 0;
    let d = parseFloat(inputs[4].value) || 0;

    let contents = l * b * d;

    inputs[5].value = contents.toFixed(2);

    updateTotal();
}

function updateTotal() {
    let rows = document.querySelectorAll("#tbody tr");
    let total = 0;

    rows.forEach(row => {
        let val = parseFloat(row.querySelectorAll("input")[5].value) || 0;
        total += val;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

function addRow() {
    let tbody = document.getElementById("tbody");
    let rowCount = tbody.rows.length + 1;

    let row = tbody.insertRow();

    row.innerHTML = `
        <td>${rowCount}</td>
        <td><input></td>
        <td><input type="number"></td>
        <td><input type="number" oninput="calc(this)"></td>
        <td><input type="number" oninput="calc(this)"></td>
        <td><input type="number" oninput="calc(this)"></td>
        <td><input readonly></td>
    `;
}

function resetForm() {
    document.querySelectorAll("input").forEach(el => el.value = "");

    let tbody = document.getElementById("tbody");
    tbody.innerHTML = `
        <tr>
            <td>1</td>
            <td><input></td>
            <td><input type="number"></td>
            <td><input type="number" oninput="calc(this)"></td>
            <td><input type="number" oninput="calc(this)"></td>
            <td><input type="number" oninput="calc(this)"></td>
            <td><input readonly></td>
        </tr>
    `;

    document.getElementById("total").innerText = "0.00";
}

</script>

</body>
</html>
