<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MECL Measurement System</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

/* HEADER */
.header {
    background: maroon;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

/* CONTAINER */
.container {
    width: 90%;
    margin: 20px auto;
    background: white;
    padding: 20px;
    box-shadow: 0 0 10px gray;
}

/* FORM */
input, textarea, select {
    width: 100%;
    padding: 6px;
    margin: 5px 0;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

table, th, td {
    border: 1px solid black;
}

th {
    background: maroon;
    color: white;
}

td, th {
    padding: 8px;
    text-align: center;
}

.total {
    font-weight: bold;
    background: #eee;
}

/* BUTTON */
button {
    padding: 10px;
    margin-top: 10px;
    background: maroon;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: darkred;
}

/* PRINT */
@media print {
    button {
        display: none;
    }
    input, textarea {
        border: none;
    }
}
</style>

</head>

<body>

<div class="header">
MECL MEASUREMENT SYSTEM
</div>

<div class="container">

<h3>General Details</h3>

<label>Division</label>
<input type="text">

<label>Name of Work</label>
<textarea></textarea>

<label>Agency by which work is executed</label>
<input type="text">

<label>Work Order No</label>
<input type="text">

<label>Date of measurement</label>
<input type="date">

<h3>Measurement</h3>

<table id="table">
<thead>
<tr>
<th>Sr</th>
<th>Description</th>
<th>No</th>
<th>L</th>
<th>B</th>
<th>D</th>
<th>Contents or area</th>
</tr>
</thead>

<tbody id="tbody">
<tr>
<td>1</td>
<td><input></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input readonly></td>
</tr>
</tbody>

<tfoot>
<tr class="total">
<td colspan="6">Total</td>
<td id="total">0</td>
</tr>
</tfoot>

</table>

<button onclick="addRow()">➕ Add Row</button>
<button onclick="window.print()">🖨️ Print</button>

</div>

<script>

function calc(el) {
    let row = el.parentElement.parentElement;
    let inputs = row.querySelectorAll("input");

    let no = parseFloat(inputs[1].value) || 0;
    let l = parseFloat(inputs[2].value) || 0;
    let b = parseFloat(inputs[3].value) || 0;
    let d = parseFloat(inputs[4].value) || 0;

    let Contents or area = d > 0 ? no*l*b*d : no*l*b;

    inputs[5].value = Contents or area.toFixed(2);

    updateTotal();
}

function updateTotal() {
    let rows = document.querySelectorAll("#tbody tr");
    let total = 0;

    rows.forEach(row => {
        let val = parseFloat(row.querySelectorAll("input")[5].value) || 0;
        total += val;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

function addRow() {
    let tbody = document.getElementById("tbody");
    let rowCount = tbody.rows.length + 1;

    let row = tbody.insertRow();

    row.innerHTML = `
        <td>${rowCount}</td>
        <td><input></td>
        <td><input type="number" oninput="calc(this)"></td>
        <td><input type="number" oninput="calc(this)"></td>
        <td><input type="number" oninput="calc(this)"></td>
        <td><input type="number" oninput="calc(this)"></td>
        <td><input readonly></td>
    `;
}

</script>

</body>
</html>
