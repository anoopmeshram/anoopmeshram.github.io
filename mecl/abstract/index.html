<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MECL Measurement Book</title>

<style>
body {
    font-family: "Times New Roman", serif;
    margin: 0;
    background: #f2f2f2;
}

.header {
    background: maroon;
    color: white;
    text-align: center;
    padding: 10px;
    font-size: 22px;
    font-weight: bold;
}

.page {
    width: 900px;
    margin: 20px auto;
    background: white;
    border: 2px solid black;
    padding: 20px;
}

/* INPUT */
input, select {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    text-align: center;
}

textarea {
    width: 100%;
    border: none;
    resize: none;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    table-layout: fixed;
}

th {
    background: maroon;
    color: white;
}

table, th, td {
    border: 1px solid black;
}

td, th {
    padding: 5px;
}

/* WIDTH */
colgroup col:nth-child(1){width:40%}
colgroup col:nth-child(2){width:12%}
colgroup col:nth-child(3){width:12%}
colgroup col:nth-child(4){width:12%}
colgroup col:nth-child(5){width:12%}
colgroup col:nth-child(6){width:12%}

/* SIGN */
.sign {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    text-align: center;
}

/* BUTTON */
.buttons {
    text-align: center;
    margin-top: 15px;
}

button {
    background: maroon;
    color: white;
    border: none;
    padding: 8px 15px;
    margin: 5px;
}

/* PRINT */
@media print {
    * {
        -webkit-print-color-adjust: exact !important;
    }
    .buttons { display: none; }
}
</style>

</head>

<body>

<div class="header">MECL</div>

<div class="page">

<h3 style="text-align:center;">ABSTRACT / BILL</h3>

<table>
<colgroup>
<col><col><col><col><col><col>
</colgroup>

<thead>
<tr>
<th>Description of Work</th>
<th>Quantity</th>
<th>Unit</th>
<th>Rate</th>
<th>Amount</th>
</tr>
</thead>

<tbody id="tbody">
<tr>
<td><textarea></textarea></td>
<td><input type="number" oninput="calc(this)"></td>
<td>
<select>
<option value="m²">m²</option>
<option value="m³">m³</option>
</select>
</td>
<td><input type="number" oninput="calc(this)"></td>
<td><input readonly></td>
</tr>
</tbody>

<tfoot>
<tr>
<td colspan="4"><b>Total Amount</b></td>
<td id="total">0.00</td>
</tr>
</tfoot>

</table>

<div class="sign">
<div><br><br>__________<br>Contractor</div>
<div><br><br>__________<br>Engineer</div>
<div><br><br>__________<br>Authority</div>
</div>

<div class="buttons">
<button onclick="addRow()">Add Row</button>
<button onclick="window.print()">Print</button>
</div>

</div>

<script>

function calc(el){
    let row = el.closest("tr");
    let inputs = row.querySelectorAll("input");

    let qty = parseFloat(inputs[0].value) || 0;
    let rate = parseFloat(inputs[1].value) || 0;

    let amount = qty * rate;

    inputs[2].value = amount.toFixed(2);

    updateTotal();
}

function updateTotal(){
    let total = 0;

    document.querySelectorAll("#tbody tr").forEach(row=>{
        let val = parseFloat(row.querySelectorAll("input")[2].value) || 0;
        total += val;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

function addRow(){
    let tbody = document.getElementById("tbody");

    let row = tbody.insertRow();

    row.innerHTML = `
    <td><textarea></textarea></td>
    <td><input type="number" oninput="calc(this)"></td>
    <td>
    <select>
        <option value="m²">m²</option>
        <option value="m³">m³</option>
    </select>
    </td>
    <td><input type="number" oninput="calc(this)"></td>
    <td><input readonly></td>`;
}

</script>

</body>
</html>fff
