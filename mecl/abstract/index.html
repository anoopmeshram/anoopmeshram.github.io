<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MECL Measurement Book</title>

<style>
body {
    font-family: "Times New Roman", serif;
    margin: 0;
    background: #f2f2f2;
}

.header {
    background: maroon;
    color: white;
    text-align: center;
    padding: 10px;
    font-size: 22px;
    font-weight: bold;
}

.page {
    width: 950px;
    margin: 20px auto;
    background: white;
    border: 2px solid black;
    padding: 20px;
}

/* INPUT */
input, select {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    text-align: center;
}

textarea {
    width: 100%;
    border: none;
    resize: none;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    table-layout: fixed;
}

th {
    background: maroon;
    color: white;
}

table, th, td {
    border: 1px solid black;
}

td, th {
    padding: 5px;
}

/* SIGN */
.sign {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    text-align: center;
}

/* BUTTON */
.buttons {
    text-align: center;
    margin-top: 15px;
}

button {
    background: maroon;
    color: white;
    border: none;
    padding: 8px 15px;
    margin: 5px;
}

/* PRINT */
@media print {
    * {
        -webkit-print-color-adjust: exact !important;
    }
    .buttons { display: none; }
}
</style>

</head>

<body>

<div class="header">MECL</div>

<div class="page">

<!-- ================= MEASUREMENT ================= -->

<h3 style="text-align:center;">MEASUREMENT</h3>

<table>
<thead>
<tr>
<th>Sr. No.</th>
<th>Description</th>
<th>L (m)</th>
<th>B (m)</th>
<th>D (m)</th>
<th>Contents</th>
<th>Unit</th>
</tr>
</thead>

<tbody id="mBody">
<tr>
<td>1</td>
<td><textarea></textarea></td>
<td><input type="number" oninput="calcM(this)"></td>
<td><input type="number" oninput="calcM(this)"></td>
<td><input type="number" oninput="calcM(this)"></td>
<td><input readonly></td>
<td><input readonly></td>
</tr>
</tbody>

<tfoot>
<tr>
<td colspan="5"><b>Total</b></td>
<td id="mTotal">0.00</td>
<td></td>
</tr>
</tfoot>

</table>

<!-- ================= BOQ ================= -->

<h3 style="text-align:center;">ABSTRACT / BILL</h3>

<table>
<thead>
<tr>
<th>Description of Work</th>
<th>Quantity</th>
<th>Unit</th>
<th>Rate</th>
<th>Amount</th>
</tr>
</thead>

<tbody id="bBody">
<tr>
<td><textarea></textarea></td>
<td><input type="number" oninput="calcB(this)"></td>
<td>
<select>
<option>m²</option>
<option>m³</option>
</select>
</td>
<td><input type="number" oninput="calcB(this)"></td>
<td><input readonly></td>
</tr>
</tbody>

<tfoot>
<tr>
<td colspan="4"><b>Total Amount</b></td>
<td id="bTotal">0.00</td>
</tr>
</tfoot>

</table>

<!-- SIGNATURE -->
<div class="sign">
<div><br><br>__________<br>Contractor</div>
<div><br><br>__________<br>Engineer</div>
<div><br><br>__________<br>Authority</div>
</div>

<!-- BUTTONS -->
<div class="buttons">
<button onclick="addM()">Add Measurement Row</button>
<button onclick="addB()">Add BOQ Row</button>
<button onclick="window.print()">Print</button>
</div>

</div>

<script>

/* MEASUREMENT CALC */
function calcM(el){
    let row = el.closest("tr");
    let inputs = row.querySelectorAll("input");

    let l = parseFloat(inputs[0].value)||0;
    let b = parseFloat(inputs[1].value)||0;
    let d = parseFloat(inputs[2].value)||0;

    let result = 0;
    let unit = "";

    if(d>0){
        result = l*b*d;
        unit = "m³";
    } else {
        result = l*b;
        unit = "m²";
    }

    inputs[3].value = result.toFixed(2);
    inputs[4].value = unit;

    updateM();
}

function updateM(){
    let total = 0;
    document.querySelectorAll("#mBody tr").forEach(r=>{
        total += parseFloat(r.querySelectorAll("input")[3].value)||0;
    });
    document.getElementById("mTotal").innerText = total.toFixed(2);
}

function addM(){
    let tbody = document.getElementById("mBody");
    let n = tbody.rows.length+1;

    let row = tbody.insertRow();

    row.innerHTML = `
    <td>${n}</td>
    <td><textarea></textarea></td>
    <td><input type="number" oninput="calcM(this)"></td>
    <td><input type="number" oninput="calcM(this)"></td>
    <td><input type="number" oninput="calcM(this)"></td>
    <td><input readonly></td>
    <td><input readonly></td>`;
}

/* BOQ CALC */
function calcB(el){
    let row = el.closest("tr");
    let inputs = row.querySelectorAll("input");

    let qty = parseFloat(inputs[0].value)||0;
    let rate = parseFloat(inputs[1].value)||0;

    inputs[2].value = (qty*rate).toFixed(2);

    updateB();
}

function updateB(){
    let total = 0;
    document.querySelectorAll("#bBody tr").forEach(r=>{
        total += parseFloat(r.querySelectorAll("input")[2].value)||0;
    });
    document.getElementById("bTotal").innerText = total.toFixed(2);
}

function addB(){
    let tbody = document.getElementById("bBody");

    let row = tbody.insertRow();

    row.innerHTML = `
    <td><textarea></textarea></td>
    <td><input type="number" oninput="calcB(this)"></td>
    <td>
    <select>
        <option>m²</option>
        <option>m³</option>
    </select>
    </td>
    <td><input type="number" oninput="calcB(this)"></td>
    <td><input readonly></td>`;
}

</script>

</body>
</html>
