<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPMS DupliChecker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:#fff;
    min-height:100vh;
}

/* Header */
header{
    text-align:center;
    padding:20px;
    font-size:26px;
    font-weight:600;
}

/* Layout */
.container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    padding:20px;
}

/* Card */
.card{
    flex:1;
    min-width:300px;
    backdrop-filter:blur(12px);
    background:rgba(255,255,255,0.08);
    border-radius:16px;
    padding:15px;
    box-shadow:0 8px 30px rgba(0,0,0,0.3);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

/* Input */
textarea{
    width:100%;
    height:240px;
    border:none;
    border-radius:10px;
    padding:10px;
    background:rgba(255,255,255,0.1);
    color:#fff;
    outline:none;
}

/* Result */
.result{
    min-height:240px;
    white-space:pre-line;
    padding:10px;
    border-radius:10px;
    background:rgba(0,0,0,0.3);
}

/* Text */
h3{
    margin-bottom:10px;
}

.total{
    margin-top:8px;
    font-weight:500;
}

/* Buttons */
.actions{
    display:flex;
    gap:15px;
    justify-content:center;
    padding:20px;
    flex-wrap:wrap;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:25px;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    color:#fff;
    cursor:pointer;
    transition:0.3s;
    font-size:14px;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

/* Footer */
footer{
    text-align:center;
    font-size:12px;
    opacity:0.7;
    padding-bottom:10px;
}
</style>
</head>

<body>

<header>🚀 BPMS DupliChecker</header>

<div class="container">

<div class="card">
    <h3>Existing Approved List</h3>
    <textarea id="existing" placeholder="Paste existing list..."></textarea>
    <div class="total">Total: <span id="existingCount">0</span></div>
</div>

<div class="card">
    <h3>Latest Approved List</h3>
    <textarea id="latest" placeholder="Paste latest list (extra text allowed)..."></textarea>
    <div class="total">Total: <span id="latestCount">0</span></div>
</div>

<div class="card">
    <h3>Not in Existing List</h3>
    <div class="result" id="result"></div>
    <div class="total">Total: <span id="resultCount">0</span></div>
</div>

</div>

<div class="actions">
    <button onclick="copyResult(event)">📋 Copy</button>
    <button onclick="downloadResult()">⬇ Download</button>
    <button onclick="clearAll()">🗑 Clear</button>
</div>

<footer>Premium BPMS Tool • Fast • Smart • Reliable ⚡</footer>

<script>
function extractNMO(text){
    const matches = text.match(/NMO\d+/g);
    return matches ? [...new Set(matches)] : [];
}

function process(){
    const existing = extractNMO(document.getElementById("existing").value);
    const latest = extractNMO(document.getElementById("latest").value);

    document.getElementById("existingCount").innerText = existing.length;
    document.getElementById("latestCount").innerText = latest.length;

    const set = new Set(existing);
    const result = latest.filter(x => !set.has(x));

    document.getElementById("result").innerText = result.join("\n");
    document.getElementById("resultCount").innerText = result.length;
}

/* Premium Copy Feedback */
function copyResult(event){
    const btn = event.target;
    const text = document.getElementById("result").innerText;

    navigator.clipboard.writeText(text).then(() => {
        const original = btn.innerText;

        btn.innerText = "✅ Copied!";
        btn.style.background = "linear-gradient(135deg,#00ff87,#60efff)";

        setTimeout(() => {
            btn.innerText = original;
            btn.style.background = "linear-gradient(135deg,#00c6ff,#0072ff)";
        }, 1500);
    });
}

function downloadResult(){
    const text = document.getElementById("result").innerText;
    const blob = new Blob([text], {type:"text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "BPMS_Result.txt";
    a.click();
}

function clearAll(){
    document.getElementById("existing").value="";
    document.getElementById("latest").value="";
    document.getElementById("result").innerText="";
    process();
}

document.getElementById("existing").addEventListener("input", process);
document.getElementById("latest").addEventListener("input", process);
</script>

</body>
</html>
