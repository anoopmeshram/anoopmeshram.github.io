<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DupliChecker NMO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#222;
    --primary:#007bff;
}

.dark {
    --bg:#1e1e1e;
    --card:#2b2b2b;
    --text:#eee;
}

body {
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

header {
    background:var(--primary);
    color:white;
    padding:15px;
    text-align:center;
    font-size:20px;
}

.container {
    display:flex;
    gap:20px;
    padding:20px;
    flex-wrap:wrap;
}

.box {
    flex:1;
    min-width:300px;
}

textarea {
    width:100%;
    height:260px;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

.card {
    background:var(--card);
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

.result {
    min-height:260px;
    white-space:pre-line;
}

.total {
    margin-top:5px;
    font-weight:bold;
}

.actions {
    display:flex;
    gap:10px;
    padding:0 20px 20px;
    flex-wrap:wrap;
}

button {
    padding:10px 15px;
    border:none;
    border-radius:6px;
    background:var(--primary);
    color:white;
    cursor:pointer;
}

.toggle {
    margin-left:auto;
    background:black;
}
</style>
</head>

<body>

<header>🚀 DupliChecker NMO</header>

<div class="container">

<div class="box">
    <h3>Existing Approved List</h3>
    <textarea id="existing" placeholder="Paste existing list..."></textarea>
    <div class="total">Total: <span id="existingCount">0</span></div>
</div>

<div class="box">
    <h3>Latest Approved List</h3>
    <textarea id="latest" placeholder="Paste latest list (extra text allowed)..."></textarea>
    <div class="total">Total: <span id="latestCount">0</span></div>
</div>

<div class="box">
    <h3>Not in Existing List</h3>
    <div class="card result" id="result"></div>
    <div class="total">Total: <span id="resultCount">0</span></div>
</div>

</div>

<div class="actions">
    <button onclick="copyResult()">📋 Copy</button>
    <button onclick="downloadResult()">⬇ Download</button>
    <button onclick="clearAll()">🗑 Clear</button>
    <button class="toggle" onclick="toggleDark()">🌙 Toggle Dark</button>
</div>

<script>

function extractNMO(text) {
    const matches = text.match(/NMO\d+/g);
    return matches ? [...new Set(matches)] : [];
}

function process() {
    const existing = extractNMO(document.getElementById("existing").value);
    const latest = extractNMO(document.getElementById("latest").value);

    document.getElementById("existingCount").innerText = existing.length;
    document.getElementById("latestCount").innerText = latest.length;

    const set = new Set(existing);
    const result = latest.filter(x => !set.has(x));

    document.getElementById("result").innerText = result.join("\n");
    document.getElementById("resultCount").innerText = result.length;
}

function copyResult() {
    const text = document.getElementById("result").innerText;
    navigator.clipboard.writeText(text);
    alert("Copied!");
}

function downloadResult() {
    const text = document.getElementById("result").innerText;
    const blob = new Blob([text], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "NMO_Result.txt";
    a.click();
}

function clearAll() {
    document.getElementById("existing").value="";
    document.getElementById("latest").value="";
    document.getElementById("result").innerText="";
    process();
}

function toggleDark() {
    document.body.classList.toggle("dark");
}

document.getElementById("existing").addEventListener("input", process);
document.getElementById("latest").addEventListener("input", process);

</script>

</body>
</html>
