<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPMS Premium Access</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
    background:linear-gradient(270deg,#020617,#0f172a,#020617);
    background-size:600% 600%;
    animation:bgMove 10s ease infinite;
    color:white;
    text-align:center;
}

/* BACKGROUND ANIMATION */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* FLOATING BALL */
.ball{
    position:absolute;
    width:200px;
    height:200px;
    background:radial-gradient(circle,#22c55e55,transparent);
    border-radius:50%;
    animation:float 6s ease-in-out infinite;
}
.ball2{
    left:70%;
    top:60%;
    animation-delay:2s;
}
@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-40px);}
}

/* TOPBAR */
.topbar{
    position:fixed;
    top:0;
    width:100%;
    padding:14px;
    backdrop-filter:blur(15px);
    background:rgba(0,0,0,0.3);
}

.status{color:#22c55e;font-weight:bold;}
.timer{font-size:13px;color:#94a3b8;}

/* CARD */
.card{
    margin-top:120px;
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    padding:30px;
    width:90%;
    max-width:420px;
    margin:auto;
    backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    animation:fadeUp 0.8s ease;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px) scale(1.02);
}

/* FADE */
@keyframes fadeUp{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;}
}

/* BUTTON */
button{
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    color:white;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

button::after{
    content:"";
    position:absolute;
    width:0;
    height:0;
    background:rgba(255,255,255,0.3);
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    transition:0.4s;
}

button:active::after{
    width:200%;
    height:200%;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:none;
}

/* HIDDEN */
.hidden{display:none;}

footer{
    margin-top:40px;
    font-size:12px;
    color:#64748b;
}
</style>

</head>

<body>

<div class="ball"></div>
<div class="ball ball2"></div>

<div class="topbar">
    <div id="status"></div>
    <div id="timer"></div>
</div>

<div id="main" class="card">
    <h1>🚀 BPMS Premium Tool</h1>
    <p>Interactive • Animated • Premium UI</p>
</div>

<div id="payment" class="card hidden">
    <h2>💳 Unlock Premium</h2>
    <p>UPI: abmcollection@ybl</p>
    <input id="utr" placeholder="Enter Code">
    <button onclick="verify()">Activate</button>
</div>

<footer>
© 2026 Anoop Meshram ❤️
</footer>

<script>

// CONFIG
const ADMIN_CODE="ANOOP123";
const trialKey="trial";
const subKey="sub";

// INIT
let now=Date.now();

if(!localStorage.getItem(trialKey)){
    localStorage.setItem(trialKey,now);
}

let trialStart=localStorage.getItem(trialKey);
let trialEnd=parseInt(trialStart)+(60*1000); // 1 min
let subEnd=localStorage.getItem(subKey);

// LOOP
setInterval(()=>{
    let current=Date.now();

    if(subEnd && current<subEnd){
        status.innerText="Subscription Active ✅";
    }
    else if(current<trialEnd){
        status.innerText="Free Trial ⏳";

        let sec=Math.floor((trialEnd-current)/1000);
        timer.innerText=sec+" sec left";
    }
    else{
        status.innerText="Trial Expired ❌";
        main.classList.add("hidden");
        payment.classList.remove("hidden");
    }

},1000);

// VERIFY
function verify(){
    if(utr.value===ADMIN_CODE){
        localStorage.setItem(subKey,Date.now()+2592000000);
        alert("Activated ✅");
        location.reload();
    }else{
        alert("Wrong Code ❌");
    }
}

</script>

</body>
</html>
