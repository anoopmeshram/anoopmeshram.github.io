<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPMS Premium Access</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
    background:linear-gradient(270deg,#020617,#0f172a,#020617);
    background-size:600% 600%;
    animation:bgMove 10s ease infinite;
    color:white;
    text-align:center;
}

/* BG ANIMATION */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* FLOAT BALLS */
.ball{
    position:absolute;
    width:200px;
    height:200px;
    background:radial-gradient(circle,#22c55e55,transparent);
    border-radius:50%;
    animation:float 6s ease-in-out infinite;
}
.ball2{left:70%;top:60%;animation-delay:2s;}

@keyframes float{
    50%{transform:translateY(-40px);}
}

/* TOPBAR */
.topbar{
    position:fixed;
    top:0;
    width:100%;
    padding:14px;
    backdrop-filter:blur(15px);
    background:rgba(0,0,0,0.3);
}

.status{color:#22c55e;font-weight:bold;}
.timer{font-size:13px;color:#94a3b8;}

/* CARD */
.card{
    margin-top:120px;
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    padding:30px;
    width:90%;
    max-width:420px;
    margin:auto;
    backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    animation:fadeUp 0.8s ease;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px) scale(1.02);
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;}
}

/* BUTTON */
button{
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    color:white;
    cursor:pointer;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:none;
}

/* HIDDEN */
.hidden{display:none;}

.block{color:#ef4444;}

footer{
    margin-top:40px;
    font-size:12px;
    color:#64748b;
}
</style>

</head>

<body>

<div class="ball"></div>
<div class="ball ball2"></div>

<div class="topbar">
    <div id="status"></div>
    <div id="timer"></div>
</div>

<!-- MAIN -->
<div id="main" class="card">
    <h1>🚀 BPMS Premium Tool</h1>
    <p>Animated • Secure • Premium</p>
</div>

<!-- PAYMENT -->
<div id="payment" class="card hidden">
    <h2>💳 Unlock Premium</h2>
    <p>Pay ₹80 (~$1)</p>
    <p><b>UPI: abmcollection@ybl</b></p>

    <input id="utr" placeholder="Enter UTR / Code">
    <button onclick="verify()">Activate</button>
</div>

<!-- BLOCK -->
<div id="blocked" class="card hidden">
    <h2 class="block">❌ Access Denied</h2>
    <p id="reason"></p>

    <p>✔ Normal Browser use karo</p>
    <p>✔ VPN band karo</p>
</div>

<footer>© 2026 Anoop Meshram ❤️</footer>

<script>

// CONFIG
const ADMIN_CODE="ANOOP123";

// STORAGE
const trialKey="trial";
const subKey="sub";

// BLOCK
function block(msg){
    main.classList.add("hidden");
    payment.classList.add("hidden");
    blocked.classList.remove("hidden");
    reason.innerText=msg;
}

// INCOGNITO
function detectIncognito(){
    return new Promise(resolve=>{
        let fs=window.RequestFileSystem||window.webkitRequestFileSystem;
        if(!fs) resolve(false);
        else fs(window.TEMPORARY,100,()=>resolve(false),()=>resolve(true));
    });
}

// LOCATION
async function checkLocation(){
    try{
        let r=await fetch("https://ipapi.co/json/");
        let d=await r.json();
        if(d.country_name!=="India"){
            block("VPN / Non-India 🚫");
            return false;
        }
        return true;
    }catch{
        block("Network error 🚫");
        return false;
    }
}

// INIT
let now=Date.now();

if(!localStorage.getItem(trialKey)){
    localStorage.setItem(trialKey,now);
}

let trialStart=localStorage.getItem(trialKey);
let trialEnd=parseInt(trialStart)+(60*1000); // 1 min
let subEnd=localStorage.getItem(subKey);

// LOOP
setInterval(()=>{
    let current=Date.now();

    if(subEnd && current<subEnd){
        status.innerText="Subscription Active ✅";
        main.classList.remove("hidden");
        payment.classList.add("hidden");
    }
    else if(current<trialEnd){
        status.innerText="Free Trial ⏳";

        let sec=Math.floor((trialEnd-current)/1000);
        timer.innerText=sec+" sec left";
    }
    else{
        status.innerText="Trial Expired ❌";
        main.classList.add("hidden");
        payment.classList.remove("hidden");
    }

},1000);

// VERIFY
function verify(){
    if(utr.value===ADMIN_CODE){
        localStorage.setItem(subKey,Date.now()+2592000000);
        alert("Activated ✅");
        location.reload();
    }else{
        alert("Invalid ❌");
    }
}

// SECURITY
(async()=>{
    let current=Date.now();

    if(subEnd && current<subEnd) return;

    let incog=await detectIncognito();
    if(incog){
        block("Incognito detected 🚫");
        return;
    }

    let ok=await checkLocation();
    if(!ok) return;
})();

</script>

</body>
</html>
