<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPMS Premium Access</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}



    
body{
    background: radial-gradient(circle at top,#0f172a,#020617);
    color:white;
    text-align:center;
}

/* TOP BAR */
.topbar{
    position:fixed;
    top:0;
    width:100%;
    padding:14px;
    backdrop-filter:blur(15px);
    background:rgba(2,6,23,0.7);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.status{font-weight:600;color:#22c55e;}
.timer{font-size:13px;color:#94a3b8;}

/* CARD */
.card{
    margin-top:120px;
    background:rgba(255,255,255,0.05);
    border-radius:24px;
    padding:35px;
    width:90%;
    max-width:420px;
    margin:auto;
    backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    animation:fade 0.6s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(25px);}
    to{opacity:1;}
}

h1{margin-bottom:10px;}
p{color:#94a3b8;}

button{
    margin-top:18px;
    padding:13px;
    width:100%;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{transform:scale(1.05);}

input{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:none;
    margin-top:12px;
    background:#020617;
    color:white;
}

.block{color:#ef4444;}
.hidden{display:none;}

footer{
    margin-top:40px;
    font-size:12px;
    color:#64748b;
}
</style>

</head>

<body>

<div class="topbar">
    <div id="status" class="status"></div>
    <div id="timer" class="timer"></div>
</div>

<!-- MAIN -->
<div id="main" class="card">
    <h1>🚀 BPMS Premium Tool</h1>
    <p>Fast • Secure • Powerful</p>
</div>

<!-- PAYMENT -->
<div id="payment" class="card hidden">
    <h1>💳 Unlock Premium</h1>
    <p>Pay ₹80 (~$1) for 30 days</p>
    <p><b>UPI: abmcollection@ybl</b></p>

    <input id="utr" placeholder="Enter UTR / Code">
    <button onclick="verify()">Activate</button>
</div>

<!-- BLOCK -->
<div id="blocked" class="card hidden">
    <h1 class="block">❌ Access Denied</h1>
    <p id="reason"></p>

    <br>
    <p>✔ Use Normal Browser</p>
    <p>✔ Turn OFF VPN</p>
    <p>✔ Use Indian Network</p>
</div>

<footer>
Premium BPMS Tool • Built for Speed ⚡ • © 2026 Anoop Meshram ❤️
</footer>

<script>

// CONFIG
const ADMIN_CODE="ANOOP123";

// STORAGE
const trialKey="bpms_trial";
const subKey="bpms_sub";

// BLOCK
function block(msg){
    main.classList.add("hidden");
    payment.classList.add("hidden");
    blocked.classList.remove("hidden");
    reason.innerText=msg;
}

// INCOGNITO
function detectIncognito(){
    return new Promise(resolve=>{
        let fs=window.RequestFileSystem||window.webkitRequestFileSystem;
        if(!fs) resolve(false);
        else fs(window.TEMPORARY,100,()=>resolve(false),()=>resolve(true));
    });
}

// LOCATION
async function checkLocation(){
    try{
        let r=await fetch("https://ipapi.co/json/");
        let d=await r.json();
        if(d.country_name!=="India"){
            block("VPN / Non-India detected 🚫");
            return false;
        }
        return true;
    }catch{
        block("Network verification failed 🚫");
        return false;
    }
}

// INIT
let now=Date.now();

if(!localStorage.getItem(trialKey)){
    localStorage.setItem(trialKey,now);
}

let trialStart=localStorage.getItem(trialKey);
let trialEnd=parseInt(trialStart)+(1*60*1000); // 1 min trial
let subEnd=localStorage.getItem(subKey);

// TIMER
function setStatus(text,ms){
    status.innerText=text;

    let h=Math.floor(ms/(1000*60*60));
    let m=Math.floor((ms%(1000*60*60))/(1000*60));
    let s=Math.floor((ms%(1000*60))/1000);

    timer.innerText=h+"h "+m+"m "+s+"s";
}

// LOOP
setInterval(()=>{
    let current=Date.now();

    if(subEnd && current<subEnd){
        setStatus("Subscription Active ✅",subEnd-current);
        main.classList.remove("hidden");
        payment.classList.add("hidden");
    }
    else if(current<trialEnd){
        setStatus("Free Trial ⏳",trialEnd-current);
    }
    else{
        status.innerText="Trial Expired ❌";
        timer.innerText="";
        main.classList.add("hidden");
        payment.classList.remove("hidden");
    }
},1000);

// VERIFY
function verify(){
    let val=utr.value;

    if(val===ADMIN_CODE){
        let newSub=Date.now()+(30*24*60*60*1000);
        localStorage.setItem(subKey,newSub);
        alert("Subscription Activated ✅");
        location.reload();
    }else{
        alert("Invalid ❌");
    }
}

// SECURITY (FIXED)
(async()=>{
    let current=Date.now();

    // ✅ Skip security if subscribed
    if(subEnd && current<subEnd){
        return;
    }

    let incog=await detectIncognito();
    if(incog){
        block("Incognito Mode Detected 🚫");
        return;
    }

    let ok=await checkLocation();
    if(!ok) return;

})();

</script>

</body>
</html>
