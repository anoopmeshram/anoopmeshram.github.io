<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPMS Premium Access</title>

<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:#0f172a;
    color:white;
    text-align:center;
}

/* TOP BAR */
.topbar{
    position:fixed;
    top:0;
    width:100%;
    background:#020617;
    padding:12px;
    border-bottom:1px solid #1e293b;
}

#status{
    font-weight:bold;
    color:#22c55e;
}

#timer{
    font-size:13px;
    color:#94a3b8;
}

/* CARD */
.card{
    margin-top:120px;
    background:#020617;
    padding:30px;
    border-radius:12px;
    width:90%;
    max-width:400px;
    margin-left:auto;
    margin-right:auto;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h1{margin-bottom:10px;}
p{color:#94a3b8;}

button{
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    background:#22c55e;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:6px;
}

.hidden{display:none;}
.block{color:#ef4444;}

footer{
    margin-top:30px;
    font-size:12px;
    color:#64748b;
}
</style>

</head>

<body>

<div class="topbar">
    <div id="status"></div>
    <div id="timer"></div>
</div>

<!-- MAIN -->
<div id="main" class="card">
    <h1>BPMS Premium Tool</h1>
    <p>System Active</p>
</div>

<!-- PAYMENT -->
<div id="payment" class="card hidden">
    <h1>Unlock Premium</h1>
    <p>Pay ₹80 for 30 days</p>
    <p><b>UPI: abmcollection@ybl</b></p>

    <input id="utr" placeholder="Enter Code">
    <button onclick="verify()">Activate</button>
</div>

<!-- BLOCK -->
<div id="blocked" class="card hidden">
    <h1 class="block">Access Denied</h1>
    <p id="reason"></p>
</div>

<footer>
© 2026 Anoop Meshram ❤️
</footer>

<script>

// ===== CONFIG =====
const ADMIN_CODE = "ANOOP123";

// ===== STORAGE =====
const trialKey="trial";
const subKey="sub";

// ===== BLOCK =====
function block(msg){
    main.classList.add("hidden");
    payment.classList.add("hidden");
    blocked.classList.remove("hidden");
    reason.innerText=msg;
}

// ===== INIT =====
let now = Date.now();

if(!localStorage.getItem(trialKey)){
    localStorage.setItem(trialKey, now);
}

let trialStart = localStorage.getItem(trialKey);
let trialEnd = parseInt(trialStart) + (60 * 1000); // 1 min
let subEnd = localStorage.getItem(subKey);

// ===== LOOP =====
setInterval(()=>{
    let current = Date.now();

    if(subEnd && current < subEnd){
        status.innerText="Subscription Active";
        main.classList.remove("hidden");
        payment.classList.add("hidden");
    }
    else if(current < trialEnd){
        status.innerText="Free Trial";

        let sec = Math.floor((trialEnd-current)/1000);
        timer.innerText = sec + " sec left";
    }
    else{
        status.innerText="Trial Expired";
        main.classList.add("hidden");
        payment.classList.remove("hidden");
    }

},1000);

// ===== VERIFY =====
function verify(){
    if(utr.value === ADMIN_CODE){
        localStorage.setItem(subKey, Date.now() + 2592000000);
        alert("Activated");
        location.reload();
    }else{
        alert("Invalid Code");
    }
}

</script>

</body>
</html>
