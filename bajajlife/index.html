<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Universal Lead Extractor PRO 🚀</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:#0f172a;
  color:white;
  padding:20px;
}
.container{
  max-width:1200px;
  margin:auto;
  background:#1e293b;
  padding:20px;
  border-radius:12px;
}
h2{text-align:center;}

textarea{
  width:100%;
  height:160px;
  background:black;
  color:#00ff9c;
  padding:10px;
  border-radius:8px;
  border:1px solid #00ff9c;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  cursor:pointer;
}

button:hover{background:#16a34a;}

.danger{background:#dc2626;}

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #334155;
  padding:8px;
  text-align:left;
}

th{
  background:#020617;
}
</style>
</head>

<body>

<div class="container">

<h2>📊 Universal Lead Extractor PRO</h2>

<textarea id="input" placeholder="Paste full raw lead data here..."></textarea><br>

<button onclick="extract()">➕ Extract</button>
<button onclick="download()">⬇ Download Excel</button>
<button onclick="clearInput()">🧹 Clear</button>
<button onclick="resetAll()" class="danger">♻ Reset</button>

<table>
<thead id="thead"></thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>

let data=[]
let allKeys=new Set()

function extract(){

  let text=document.getElementById("input").value

  if(!text){
    alert("Please paste data first")
    return
  }

  let lines=text.split(/\n+/).map(x=>x.trim()).filter(x=>x)

  let obj={}

  for(let i=0;i<lines.length;i++){

    let label=lines[i]
    let value=lines[i+1] || ""

    let l=label.toLowerCase().trim()
    let v=value.toLowerCase().trim()

    // ❌ skip useless labels
    if(
      l.includes("click here") ||
      l.includes("know more")
    ){
      continue
    }

    // ✅ MAIN LOGIC (IMPORTANT)
    if(!value || l===v){
      value="-"
    }

    // ✅ prevent overwrite of valid data
    if(obj[label] && value==="-" ){
      i++
      continue
    }

    obj[label]=value
    allKeys.add(label)

    i++
  }

  data.push(obj)
  render()

  document.getElementById("input").value=""
}

// TABLE
function render(){

  let thead=document.getElementById("thead")
  let tbody=document.getElementById("tbody")

  thead.innerHTML=""
  tbody.innerHTML=""

  let keys=[...allKeys]

  let header="<tr>"
  keys.forEach(k=>{
    header+=`<th>${k}</th>`
  })
  header+="</tr>"

  thead.innerHTML=header

  data.forEach(d=>{
    let row="<tr>"
    keys.forEach(k=>{
      row+=`<td>${d[k] || ""}</td>`
    })
    row+="</tr>"
    tbody.innerHTML+=row
  })
}

// DOWNLOAD
function download(){

  if(!data.length){
    alert("No data to export")
    return
  }

  let ws=XLSX.utils.json_to_sheet(data)
  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Leads")

  XLSX.writeFile(wb,"Extracted_Leads.xlsx")
}

// CLEAR INPUT
function clearInput(){
  document.getElementById("input").value=""
}

// RESET ALL
function resetAll(){
  data=[]
  allKeys=new Set()
  document.getElementById("thead").innerHTML=""
  document.getElementById("tbody").innerHTML=""
}

</script>

</body>
</html>
