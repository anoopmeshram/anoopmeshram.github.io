<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Advanced Lead Extractor</title>

<style>
body { font-family: Arial; background:#f5f5f5; }
.container { max-width:900px; margin:auto; }
textarea { width:100%; height:200px; padding:10px; }
button { padding:10px; margin-top:10px; cursor:pointer; }

.output {
  background:white;
  padding:20px;
  margin-top:20px;
}

.field { margin-bottom:10px; }
.label { font-weight:bold; }

/* PRINT */
@media print {
  .no-print { display:none; }
  .output {
    width:210mm;
    min-height:297mm;
  }
}
</style>
</head>

<body>

<div class="container">
<h2>Lead Extractor (Rule Based)</h2>

<textarea id="raw"></textarea>

<div class="no-print">
<button onclick="process()">Extract</button>
<button onclick="window.print()">Print</button>
</div>

<div class="output" id="out"></div>
</div>

<script>

// helper
function getValue(data, field){
    let regex = new RegExp(field + "\\s*:?\\s*(.*)", "i");
    let match = data.match(regex);
    if(!match) return "-";

    let val = match[1].trim();

    if(!val || val.toLowerCase() === field.toLowerCase()) return "-";
    return val;
}

// special rules
function getLeadID(data){
    let match = data.match(/Lead Details\s*-\s*(\d+)/i);
    return match ? match[1] : "-";
}

function getZip(data){
    let val = getValue(data,"Zip");
    return isNaN(val) ? "-" : val;
}

function getDOB(data){
    let val = getValue(data,"DOB");
    if(val.toLowerCase() === "dob") return "dd-mm-yyyy";
    return val;
}

function getDate(data){
    let val = getValue(data,"Appointment Date");
    if(val.includes("dd-mm-yyyy")) return "-";
    return val;
}

function getProduct(data){
    let val = getValue(data,"Product Interested");
    if(val.toLowerCase() === "select") return "-";
    return val;
}

function process(){

let data = document.getElementById("raw").value;

let html = `
<h2 style="text-align:center;">Lead Report</h2>
<hr>

<div class="field"><div class="label">Lead ID</div>${getLeadID(data)}</div>

<div class="field"><div class="label">First Name</div>${getValue(data,"First Name")}</div>
<div class="field"><div class="label">Middle Name</div>${getValue(data,"Middle Name")}</div>
<div class="field"><div class="label">Last Name</div>${getValue(data,"Last Name")}</div>

<div class="field"><div class="label">Address</div>${getValue(data,"Address")}</div>
<div class="field"><div class="label">City</div>${getValue(data,"City")}</div>
<div class="field"><div class="label">State</div>${getValue(data,"State")}</div>
<div class="field"><div class="label">Pin/Zip Code</div>${getZip(data)}</div>

<div class="field"><div class="label">Persona Type</div>${getValue(data,"Persona Type")}</div>
<div class="field"><div class="label">Lead Event</div>${getValue(data,"Lead Event")}</div>
<div class="field"><div class="label">Last Comment</div>${getValue(data,"Last Comment")}</div>

<div class="field"><div class="label">Contact No. 1</div>${getValue(data,"Primary Contact No 1")}</div>
<div class="field"><div class="label">Contact No. 2</div>${getValue(data,"Primary Contact No 2")}</div>
<div class="field"><div class="label">Contact No. 3</div>${getValue(data,"Primary Contact No 3")}</div>

<div class="field"><div class="label">Email</div>${getValue(data,"Email")}</div>

<div class="field"><div class="label">Hot Lead</div>${getValue(data,"Hot Lead")}</div>
<div class="field"><div class="label">Pan Card/Aadhar No.</div>${getValue(data,"Pan Card/Aadhar No")}</div>

<div class="field"><div class="label">Appointment Date</div>${getDate(data)}</div>
<div class="field"><div class="label">Appointment Time</div>${getValue(data,"Appointment Time")}</div>

<div class="field"><div class="label">Application No.</div>${getValue(data,"Application No")}</div>

<div class="field"><div class="label">Customer Segment</div>${getValue(data,"Customer Segment")}</div>
<div class="field"><div class="label">Lead Potential</div>${getValue(data,"Lead Potential")}</div>

<div class="field"><div class="label">Product Interested</div>${getProduct(data)}</div>

<div class="field"><div class="label">Policy No.</div>${getValue(data,"Policy No")}</div>

<div class="field"><div class="label">MVC</div>${getValue(data,"MVC")}</div>
<div class="field"><div class="label">PFV</div>${getValue(data,"PFV")}</div>
<div class="field"><div class="label">PHV</div>${getValue(data,"PHV")}</div>

<div class="field"><div class="label">Priority</div>${getValue(data,"Priority")}</div>

<div class="field"><div class="label">Product Recommendation</div>${getValue(data,"Product Recommendation")}</div>

<div class="field"><div class="label">Source</div>${getValue(data,"Source")}</div>

<div class="field"><div class="label">Comments</div>${getValue(data,"Comments")}</div>

<div class="field"><div class="label">DOB</div>${getDOB(data)}</div>

<div class="field"><div class="label">Alternate No.</div>${getValue(data,"Alternate Number")}</div>

<hr>
`;

document.getElementById("out").innerHTML = html;
}
</script>

</body>
</html>
