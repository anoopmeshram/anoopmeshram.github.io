<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fixed CRM Extractor</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<textarea id="input" style="width:100%;height:150px;"></textarea><br>
<button onclick="extract()">Extract</button>
<button onclick="download()">Download</button>

<table border="1" id="table"></table>

<script>

let data=[]
let headers=new Set()

function cleanLabel(label){

  if(label.includes("Lead Details")) return "Lead ID"
  if(label.includes("Address /")) return "Address"
  if(label.includes("PASA Details")) return "PASA Details"
  if(label==="Zip") return "Pin/Zip Code"

  if(label.includes("Primary Contact No 1")) return "Contact No. 1"
  if(label.includes("Primary Contact No 2")) return "Contact No. 2"
  if(label.includes("Primary Contact No 3")) return "Contact No. 3"

  if(label.includes("Pan Card/Aadhar")) return "Pan Card/Aadhar No."
  if(label.includes("Application No")) return "Application No."
  if(label.includes("Appointment Date")) return "Appointment Date"
  if(label.includes("Appointment Time")) return "Appointment Time"
  if(label.includes("Alternate Number")) return "Alternate No."

  return label.replace(/\*/g,"").trim()
}

function skip(label){
  let l=label.toLowerCase()
  return l.includes("favourite") ||
         l.includes("additional contact")
}

function cleanValue(label,value){

  let v=value.trim().toLowerCase()
  let l=label.trim().toLowerCase()

  if(!value || v===l) return "-"
  if(v==="select") return "-"
  if(v==="primary contact no.") return "-"
  if(v==="application number") return "-"
  if(v==="dd-mm-yyyy") return "-"

  return value
}

function extract(){

  let text=document.getElementById("input").value
  let lines=text.split(/\n+/).map(x=>x.trim()).filter(x=>x)

  let obj={}

  for(let i=0;i<lines.length;i++){

    let label=lines[i]

    if(skip(label)) continue

    // Lead ID
    if(label.includes("Lead Details")){
      let id=label.match(/\d+/)
      obj["Lead ID"]=id? id[0] : "-"
      headers.add("Lead ID")
      continue
    }

    let value=lines[i+1] || ""

    let newLabel=cleanLabel(label)
    let finalValue=cleanValue(newLabel,value)

    obj[newLabel]=finalValue
    headers.add(newLabel)

    i++
  }

  data.push(obj)
  render()
}

function render(){

  let table=document.getElementById("table")
  table.innerHTML=""

  let keys=[...headers]

  let header="<tr>"+keys.map(k=>`<th>${k}</th>`).join("")+"</tr>"
  table.innerHTML+=header

  data.forEach(d=>{
    let row="<tr>"+keys.map(k=>`<td>${d[k]||""}</td>`).join("")+"</tr>"
    table.innerHTML+=row
  })
}

function download(){
  let ws=XLSX.utils.json_to_sheet(data)
  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Data")
  XLSX.writeFile(wb,"fixed_data.xlsx")
}

</script>

</body>
</html>
