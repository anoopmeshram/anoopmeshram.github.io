<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Deterministic CRM Extractor</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
  body{font-family:Segoe UI;background:#0f172a;color:#e2e8f0;padding:20px}
  textarea{width:100%;height:180px;background:#000;color:#00ff9c;border:1px solid #00ff9c;border-radius:8px;padding:10px}
  button{margin:6px 6px 6px 0;padding:10px 14px;border:0;border-radius:8px;background:#22c55e;color:#022;cursor:pointer}
  table{width:100%;border-collapse:collapse;margin-top:16px}
  th,td{border:1px solid #334155;padding:8px;text-align:left}
  th{background:#020617}
</style>
</head>
<body>

<h3>Deterministic CRM Extractor</h3>

<textarea id="input" placeholder="Paste raw data..."></textarea><br>
<button onclick="extract()">Extract</button>
<button onclick="download()">Download Excel</button>

<table id="table"></table>

<script>
const KNOWN = new Set([
  "First Name","Middle Name","Last Name",
  "Address","PASA Details","Sales Narrative","Profile Summary",
  "City","State","Zip","Persona Type","Lead Event","Last Comment",
  "Primary Contact No 1.","Primary Contact No 2.","Primary Contact No 3.",
  "Child education tool","Email","Hot Lead","Pan Card/Aadhar No",
  "Appointment Date**","Appointment Time *","Application No",
  "Marital Status","Customer Segment","Lead Potential","Product Interested",
  "Policy No","MVC","PFV","Upsell propensity","PHV","Priority","SPG eligible",
  "PERSONA","Product Recommendation","Source","Account Aggregator",
  "Ticket size recommendation","Comments","DOB","Alternate Number"
]);

const SKIP = new Set([
  "Favourite / Un-Favourite",
  "Alternate Contact Numbers",
  "Click Here for Additional Contact Numbers"
]);

function normalizeLabel(raw){
  let l = raw.replace(/[*]/g,"").trim();

  if(l.includes("Address /")) l = "Address";
  if(l.includes("PASA Details")) l = "PASA Details";
  if(l === "Zip") l = "Pin/Zip Code";
  if(l.includes("Primary Contact No 1")) l = "Contact No. 1";
  if(l.includes("Primary Contact No 2")) l = "Contact No. 2";
  if(l.includes("Primary Contact No 3")) l = "Contact No. 3";
  if(l.includes("Pan Card/Aadhar")) l = "Pan Card/Aadhar No.";
  if(l.includes("Application No")) l = "Application No.";
  if(l.includes("Appointment Date")) l = "Appointment Date";
  if(l.includes("Appointment Time")) l = "Appointment Time";
  if(l.includes("Alternate Number")) l = "Alternate No.";
  if(l === "Policy No") l = "Policy No.";

  return l;
}

function isKnownLabel(line){
  if(line.startsWith("Lead Details")) return true;
  if(SKIP.has(line)) return true;
  return KNOWN.has(line) || KNOWN.has(line.replace(/[*]/g,"").trim());
}

function cleanValue(label, value){
  if(!value) return "-";
  const v = value.trim().toLowerCase();
  const l = label.trim().toLowerCase();

  if(v === l) return "-";
  if(v === "select") return "-";
  if(v === "primary contact no.") return "-";
  if(v === "application number") return "-";
  if(v === "dd-mm-yyyy") return "-";
  if(v === "appointment time") return "-";

  return value.trim();
}

let data = [];
let headers = new Set();

function extract(){
  const text = document.getElementById("input").value;
  const lines = text.split(/\n+/).map(s=>s.trim()).filter(Boolean);

  const obj = {};

  for(let i=0;i<lines.length;i++){
    let line = lines[i];

    if(SKIP.has(line)) continue;

    // Lead ID
    if(line.startsWith("Lead Details")){
      const id = (line.match(/\d+/) || [])[0] || "-";
      obj["Lead ID"] = id;
      headers.add("Lead ID");
      continue;
    }

    if(!isKnownLabel(line)) continue;

    const rawLabel = line;
    const next = lines[i+1];

    let value = "-";

    if(next && !isKnownLabel(next)){
      value = next;
      i++; // consume value
    }

    const label = normalizeLabel(rawLabel);
    const finalVal = cleanValue(label, value);

    obj[label] = finalVal;
    headers.add(label);
  }

  data.push(obj);
  render();
}

function render(){
  const table = document.getElementById("table");
  const keys = [...headers];

  table.innerHTML = "<tr>"+keys.map(k=>`<th>${k}</th>`).join("")+"</tr>";

  data.forEach(d=>{
    table.innerHTML += "<tr>"+keys.map(k=>`<td>${d[k]||""}</td>`).join("")+"</tr>";
  });
}

function download(){
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Data");
  XLSX.writeFile(wb, "crm_clean.xlsx");
}
</script>

</body>
</html>
