<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>One Page Client Report</title>

<style>
body {
  font-family: Arial;
  background:#f0f2f5;
}

.container {
  max-width:900px;
  margin:auto;
}

textarea {
  width:100%;
  height:150px;
}

button {
  padding:8px 12px;
  margin-top:10px;
  cursor:pointer;
}

/* DOCUMENT */
.doc {
  background:white;
  padding:20px;
  margin-top:20px;
  font-size:13px;
  line-height:1.4;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  border-bottom:2px solid #000;
  padding-bottom:5px;
}

.company { font-weight:bold; font-size:16px; }
.rm { text-align:right; font-size:11px; }

/* GRID */
.grid {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.box {
  border:1px solid #ccc;
  padding:6px;
}

.title {
  font-weight:bold;
  background:#f5f5f5;
  padding:3px;
  margin-bottom:5px;
}

/* SMALL TABLE */
table {
  width:100%;
  border-collapse:collapse;
}

td {
  border:1px solid #ddd;
  padding:4px;
}

.label {
  font-weight:bold;
  width:45%;
}

/* FOOTER */
.footer {
  margin-top:10px;
  font-size:10px;
  text-align:center;
}

/* PRINT STRICT A4 */
@media print {
  body { margin:0; }
  .no-print { display:none !important; }

  .doc {
    width:210mm;
    height:297mm;
    padding:10mm;
    font-size:11px;
    overflow:hidden;
  }
}
</style>
</head>

<body>

<div class="container">

<h3>One Page Lead Generator</h3>

<textarea id="raw"></textarea>

<div class="no-print">
<button onclick="generate()">Generate</button>
<button onclick="window.print()">Print</button>
</div>

<div id="output"></div>

</div>

<script>

// helpers
function getValue(d,f){
 let m = d.match(new RegExp(f+"\\s*:?\\s*(.*)","i"));
 if(!m) return "-";
 let v = m[1].trim();
 if(!v || v.toLowerCase()===f.toLowerCase()) return "-";
 return v;
}

function leadID(d){
 let m = d.match(/Lead Details\\s*-\\s*(\\d+)/i);
 return m?m[1]:"-";
}

function name(d){
 return `${getValue(d,"First Name")} ${getValue(d,"Middle Name")} ${getValue(d,"Last Name")}`;
}

function zip(d){
 let v = getValue(d,"Zip");
 return isNaN(v)?"-":v;
}

function generate(){

let d = document.getElementById("raw").value;

let html = `
<div class="doc">

<div class="header">
<div class="company">INSURANCE REPORT</div>
<div class="rm">
Anoop Meshram<br>
RM | 8999053974
</div>
</div>

<div class="grid">

<div class="box">
<div class="title">Client</div>
<table>
<tr><td class="label">Lead ID</td><td>${leadID(d)}</td></tr>
<tr><td class="label">Name</td><td>${name(d)}</td></tr>
<tr><td class="label">Phone</td><td>${getValue(d,"Primary Contact No 1")}</td></tr>
<tr><td class="label">Email</td><td>${getValue(d,"Email")}</td></tr>
<tr><td class="label">DOB</td><td>${getValue(d,"DOB")}</td></tr>
</table>
</div>

<div class="box">
<div class="title">Address</div>
<table>
<tr><td class="label">Address</td><td>${getValue(d,"Address")}</td></tr>
<tr><td class="label">City</td><td>${getValue(d,"City")}</td></tr>
<tr><td class="label">State</td><td>${getValue(d,"State")}</td></tr>
<tr><td class="label">Pin</td><td>${zip(d)}</td></tr>
</table>
</div>

<div class="box">
<div class="title">Lead</div>
<table>
<tr><td class="label">Persona</td><td>${getValue(d,"Persona Type")}</td></tr>
<tr><td class="label">Potential</td><td>${getValue(d,"Lead Potential")}</td></tr>
<tr><td class="label">Segment</td><td>${getValue(d,"Customer Segment")}</td></tr>
<tr><td class="label">Event</td><td>${getValue(d,"Lead Event")}</td></tr>
</table>
</div>

<div class="box">
<div class="title">Product</div>
<table>
<tr><td class="label">Interested</td><td>${getValue(d,"Product Interested")}</td></tr>
<tr><td class="label">Recommended</td><td>${getValue(d,"Product Recommendation")}</td></tr>
<tr><td class="label">Policy No</td><td>${getValue(d,"Policy No")}</td></tr>
</table>
</div>

<div class="box">
<div class="title">Interaction</div>
<table>
<tr><td class="label">Last Comment</td><td>${getValue(d,"Last Comment")}</td></tr>
<tr><td class="label">Date</td><td>${getValue(d,"Appointment Date")}</td></tr>
<tr><td class="label">Time</td><td>${getValue(d,"Appointment Time")}</td></tr>
</table>
</div>

<div class="box">
<div class="title">Other</div>
<table>
<tr><td class="label">Customer Segment</td><td>${getValue(d,"Customer Segment")}</td></tr>
<tr><td class="label">Priority</td><td>${getValue(d,"Priority")}</td></tr>
<tr><td class="label">Source</td><td>${getValue(d,"Source")}</td></tr>
</table>
</div>

</div>

<div class="footer">
Confidential | Internal Use | Generated Report
</div>

</div>
`;

document.getElementById("output").innerHTML = html;
}
</script>

</body>
</html>
