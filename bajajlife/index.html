<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Client Lead Report</title>

<style>
body {
    font-family: 'Segoe UI', Arial;
    background: #f0f2f5;
}

.container {
    max-width: 900px;
    margin: auto;
}

textarea {
    width: 100%;
    height: 180px;
    padding: 10px;
}

button {
    padding: 10px 15px;
    margin-top: 10px;
    cursor: pointer;
}

/* DOCUMENT */
.document {
    background: white;
    padding: 30px;
    margin-top: 20px;
    border-radius: 8px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    border-bottom: 2px solid #000;
    padding-bottom: 10px;
}

.company {
    font-size: 20px;
    font-weight: bold;
}

.rm {
    text-align: right;
    font-size: 14px;
}

/* TITLE */
.title {
    text-align: center;
    margin: 20px 0;
    font-size: 22px;
    font-weight: bold;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

td {
    border: 1px solid #ccc;
    padding: 8px;
}

.label {
    font-weight: bold;
    width: 35%;
    background: #f7f7f7;
}

/* PRINT */
@media print {
    body { background: white; }
    .no-print { display: none; }

    .document {
        width: 210mm;
        min-height: 297mm;
        border-radius: 0;
    }
}
</style>
</head>

<body>

<div class="container">

<h2>Premium Lead Generator</h2>

<textarea id="raw"></textarea>

<div class="no-print">
<button onclick="generate()">Generate Report</button>
<button onclick="window.print()">Print / Save PDF</button>
</div>

<div id="output"></div>

</div>

<script>

// helpers
function getValue(data, field){
    let regex = new RegExp(field + "\\s*:?\\s*(.*)", "i");
    let match = data.match(regex);
    if(!match) return "-";

    let val = match[1].trim();
    if(!val || val.toLowerCase() === field.toLowerCase()) return "-";
    return val;
}

function getLeadID(data){
    let match = data.match(/Lead Details\\s*-\\s*(\\d+)/i);
    return match ? match[1] : "-";
}

function getZip(data){
    let val = getValue(data,"Zip");
    return isNaN(val) ? "-" : val;
}

function generate(){

let data = document.getElementById("raw").value;

let html = `
<div class="document">

<div class="header">
    <div class="company">INSURANCE CONSULTANCY REPORT</div>
    <div class="rm">
        <b>Anoop Meshram</b><br>
        Relationship Manager<br>
        📞 8999053974
    </div>
</div>

<div class="title">Client Lead Summary</div>

<table>
<tr><td class="label">Lead ID</td><td>${getLeadID(data)}</td></tr>

<tr><td class="label">Full Name</td>
<td>${getValue(data,"First Name")} ${getValue(data,"Middle Name")} ${getValue(data,"Last Name")}</td></tr>

<tr><td class="label">Contact No.</td><td>${getValue(data,"Primary Contact No 1")}</td></tr>
<tr><td class="label">Email</td><td>${getValue(data,"Email")}</td></tr>

<tr><td class="label">Address</td><td>${getValue(data,"Address")}</td></tr>
<tr><td class="label">City / State</td>
<td>${getValue(data,"City")} / ${getValue(data,"State")}</td></tr>

<tr><td class="label">Pin Code</td><td>${getZip(data)}</td></tr>

<tr><td class="label">Customer Segment</td><td>${getValue(data,"Customer Segment")}</td></tr>
<tr><td class="label">Lead Potential</td><td>${getValue(data,"Lead Potential")}</td></tr>

<tr><td class="label">Product Interested</td><td>${getValue(data,"Product Interested")}</td></tr>
<tr><td class="label">Product Recommendation</td><td>${getValue(data,"Product Recommendation")}</td></tr>

<tr><td class="label">Lead Event</td><td>${getValue(data,"Lead Event")}</td></tr>
<tr><td class="label">Last Comment</td><td>${getValue(data,"Last Comment")}</td></tr>

<tr><td class="label">DOB</td><td>${getValue(data,"DOB")}</td></tr>
<tr><td class="label">Appointment Date</td><td>${getValue(data,"Appointment Date")}</td></tr>

</table>

<br><br>

<div style="text-align:center; font-size:12px;">
This is a system generated report for internal use.
</div>

</div>
`;

document.getElementById("output").innerHTML = html;
}
</script>

</body>
</html>
