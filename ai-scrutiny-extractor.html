<!DOCTYPE html>
<html>

<head>

<title>Ultra AI Scrutiny Report Extractor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:20px;
}

h1{
color:#222;
}

textarea{
width:100%;
height:200px;
padding:10px;
}

button{
padding:10px 18px;
margin:6px;
background:#007bff;
border:none;
color:white;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
}

th,td{
border:1px solid #ddd;
padding:8px;
}

th{
background:#333;
color:white;
}

</style>

</head>

<body>

<h1>AI Building Scrutiny Extractor</h1>

<input type="file" id="pdfUpload">

<br><br>

<textarea id="reportText" placeholder="Report text will appear here"></textarea>

<br>

<button onclick="processReport()">AI Extract</button>

<button onclick="downloadExcel()">Download Excel</button>

<button onclick="resetApp()">Reset</button>

<p id="status"></p>

<table id="resultTable">

<thead>

<tr>

<th>Sr No</th>
<th>Technical Person</th>
<th>Contact</th>
<th>Site Address</th>
<th>Type</th>
<th>Owner Name</th>
<th>Owner Contact</th>
<th>Owner Address</th>
<th>Structural Engineer</th>

</tr>

</thead>

<tbody></tbody>

</table>

<script>

let data=[]
let sr=1

function cleanAddress(address){

address=address.replace(/PLOT NO.*?,/gi,"")
address=address.replace(/CTS NO.*?,/gi,"")
address=address.replace(/KH NO.*?,/gi,"")
address=address.replace(/SHEET NO.*?,/gi,"")
address=address.replace(/SURVEY NO.*?,/gi,"")

return address.trim()

}

function findValue(keyword,text){

let reg=new RegExp(keyword+"\\s*:?\\s*(.+)","i")

let match=text.match(reg)

return match?match[1].trim():""

}

function processReport(){

let text=document.getElementById("reportText").value

let techName=findValue("Technical Person Name",text)

let techContact=findValue("Contact Number",text)

let site=findValue("Site Address",text)

site=cleanAddress(site)

let type=findValue("Technical Person Type",text)

let owner=findValue("Owner",text)

let ownerContact=findValue("Owner Contact",text)

let ownerAddress=findValue("Postal Address",text)

let structural=findValue("Structural Engineer",text)

data.push({
sr,
techName,
techContact,
site,
type,
owner,
ownerContact,
ownerAddress,
structural
})

document.getElementById("status").innerText="Entry noted. (Sr No. "+sr+")"

sr++

renderTable()

}

function renderTable(){

let tbody=document.querySelector("#resultTable tbody")

tbody.innerHTML=""

data.forEach(d=>{

tbody.innerHTML+=`
<tr>

<td>${d.sr}</td>
<td>${d.techName}</td>
<td>${d.techContact}</td>
<td>${d.site}</td>
<td>${d.type}</td>
<td>${d.owner}</td>
<td>${d.ownerContact}</td>
<td>${d.ownerAddress}</td>
<td>${d.structural}</td>

</tr>
`

})

}

function downloadExcel(){

let table=document.getElementById("resultTable").outerHTML

let url='data:application/vnd.ms-excel,'+encodeURIComponent(table)

let link=document.createElement("a")

link.href=url

link.download="scrutiny-data.xls"

link.click()

}

function resetApp(){

data=[]
sr=1

document.querySelector("#resultTable tbody").innerHTML=""

document.getElementById("status").innerText="All data cleared"

}

document.getElementById('pdfUpload').addEventListener('change',function(e){

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

let typedarray=new Uint8Array(this.result)

pdfjsLib.getDocument(typedarray).promise.then(function(pdf){

let text=""

let pages=[]

for(let i=1;i<=pdf.numPages;i++){

pages.push(

pdf.getPage(i).then(function(page){

return page.getTextContent().then(function(content){

let strings=content.items.map(item=>item.str)

text+=strings.join(" ")+" "

})

})

)

}

Promise.all(pages).then(function(){

document.getElementById("reportText").value=text

})

})

}

reader.readAsArrayBuffer(file)

})

</script>

</body>

</html>
