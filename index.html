<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anoop Future Login</title>

<style>
/* 🔥 MINIMAL STYLING (tera full CSS bada hai, yaha optimized diya) */
body{
    background:#0a0a2e;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.future-card{
    background:#111;
    padding:30px;
    border-radius:12px;
    text-align:center;
    width:320px;
}

button{
    width:100%;
    padding:10px;
    margin:10px 0;
    cursor:pointer;
}

.social-retro{
    background:#222;
    color:white;
}

.retro-button{
    background:linear-gradient(45deg,#ff00ff,#00ffff);
    color:white;
}

</style>
</head>

<body>

<div class="future-card">

<h2>ENTER THE FUTURE 🚀</h2>

<form id="loginForm">
<input type="email" id="email" placeholder="Email" required><br>
<input type="password" id="password" placeholder="Password" required><br>
<button type="submit" class="retro-button">LOGIN</button>
</form>

<hr>

<button class="social-retro" id="googleBtn">GOOGLE LOGIN</button>
<button class="social-retro" id="githubBtn">GITHUB LOGIN</button>

</div>

<!-- 🔥 Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
// 🔥 Firebase Config (tera real)
const firebaseConfig = {
  apiKey: "AIzaSyCxwMhsc4jlvDBvDXNVjOThR0C2fmJzVNA",
  authDomain: "anoop-meshram.firebaseapp.com",
  projectId: "anoop-meshram",
  storageBucket: "anoop-meshram.firebasestorage.app",
  messagingSenderId: "405659754599",
  appId: "1:405659754599:web:7bb26bb3a4ed9357d774c2",
  measurementId: "G-SDTBQBVPSS"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// 🔐 EMAIL LOGIN (dummy local)
document.getElementById("loginForm").addEventListener("submit", (e)=>{
    e.preventDefault();
    alert("Login Success (Demo)");
});

// 🟢 GOOGLE LOGIN
document.getElementById("googleBtn").onclick = async ()=>{
    try{
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        alert("Google Login Success: " + result.user.email);
    }catch(err){
        alert(err.message);
    }
};

// 🐙 GITHUB LOGIN
document.getElementById("githubBtn").onclick = async ()=>{
    try{
        const provider = new firebase.auth.GithubAuthProvider();
        const result = await auth.signInWithPopup(provider);
        alert("GitHub Login Success: " + result.user.email);
    }catch(err){
        alert(err.message);
    }
};
</script>

</body>
</html>
