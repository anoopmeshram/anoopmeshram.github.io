<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BPMS Extractor PRO</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:'Consolas', monospace;
  background:black;
  padding:20px;
  color:#00ff9c;
  overflow-x:hidden;
}

/* MATRIX BACKGROUND */
body::before{
  content:"ANOOP MESHRAM";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  color:#00ff9c22;
  font-size:25px;
  white-space:wrap;
  z-index:-1;
  animation:matrix 20s linear infinite;
}

@keyframes matrix{
  0%{transform:translateY(-100%);}
  100%{transform:translateY(100%);}
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  background:rgba(0,0,0,0.85);
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 30px #00ff9c55, inset 0 0 20px #00ff9c22;
  border:1px solid #00ff9c33;
  backdrop-filter:blur(5px);
  animation:flicker 3s infinite;
}

/* TITLE */
h2{
  text-align:center;
  color:#00ff9c;
  text-shadow:0 0 5px #00ff9c,0 0 20px #00ff9c;
  letter-spacing:2px;
}

/* TEXTAREA */
textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:8px;
  border:1px solid #00ff9c;
  background:black;
  color:#00ff9c;
  box-shadow:inset 0 0 10px #00ff9c33;
}

textarea:focus{
  outline:none;
  box-shadow:0 0 15px #00ff9c;
}

/* BUTTONS */
button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:black;
  color:#00ff9c;
  cursor:pointer;
  border:1px solid #00ff9c;
  transition:0.2s;
  text-shadow:0 0 5px #00ff9c;
}

button:hover{
  background:#00ff9c;
  color:black;
  box-shadow:0 0 15px #00ff9c,0 0 30px #00ff9c;
}

.danger{
  border:1px solid #ff0033;
  color:#ff0033;
}

.danger:hover{
  background:#ff0033;
  color:white;
  box-shadow:0 0 15px #ff0033;
}

/* TABLE */
table{
  width:100%;
  margin-top:15px;
  border-collapse:collapse;
  background:black;
}

th,td{
  border:1px solid #00ff9c33;
  padding:10px;
}

th{
  background:#001a12;
  color:#00ff9c;
  text-shadow:0 0 5px #00ff9c;
}

/* STATUS BAR */
.status-bar{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  display:flex;
  justify-content:center;
  border:1px solid #00ff9c33;
  text-shadow:0 0 5px currentColor;
}

.success{background:#001a12;color:#00ff9c;}
.error{background:#1a0000;color:#ff0033;}
.info{background:#00111a;color:#00c3ff;}

/* ROW ANIMATION */
.new-row{
  animation:glitch 1s ease;
}

@keyframes glitch{
  0%{background:#00ff9c55;}
  25%{background:#ff003355;}
  50%{background:#00ff9c22;}
  100%{background:transparent;}
}

/* FLICKER */
@keyframes flicker{
  0%,18%,22%,25%,53%,57%,100%{opacity:1;}
  20%,24%,55%{opacity:0.85;}
}

/* SCROLLBAR */
::-webkit-scrollbar{
  width:6px;
}
::-webkit-scrollbar-thumb{
  background:#00ff9c;
}
</style>
</head>

<body>

<div class="container">

<h2>🏗️ BPMS Extractor PRO 🚀</h2>

<textarea id="report" placeholder="Paste full data here..."></textarea><br>

<button onclick="addEntry()">➕ Extract Table 3</button>
<button onclick="exportExcel()">⬇ Download Excel</button>
<button onclick="clearInput()">🧹 Clear Input</button>
<button onclick="resetData()" class="danger">♻ Reset</button>

<div id="statusBar" class="status-bar"></div>

<table id="table">
<thead>
<tr>
<th>Sr. No.</th>
<th>Technical Person Name</th>
<th>Technical Person Contact No.</th>
<th>Technical Person Type</th>
<th>Owner Name</th>
<th>Owner Contact No.</th>
<th>Owner Address</th>
<th>Structural Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let lastClipboard=""

// STATUS
function setStatus(msg,type="success"){
  let el=document.getElementById("statusBar")
  el.className="status-bar "+type
  el.innerText=msg
}

// DUPLICATE
function isDuplicate(e){
  return data.some(d=>JSON.stringify(d)===JSON.stringify(e))
}

// ✅ FIXED VALIDATION
function isValidEntry(e){

  if(!e.techName || !e.techContact || !e.owner){
    return false
  }

  let phone=/^[0-9]{10}$/

  if(!phone.test(e.techContact)) return false
  if(e.ownerContact && !phone.test(e.ownerContact)) return false

  if(e.techName.length<3 || e.owner.length<3){
    return false
  }

  return true
}

// AUTO PASTE
async function autoPasteAndProcess(){
  try{
    let t=await navigator.clipboard.readText()
    if(!t || t===lastClipboard) return

    lastClipboard=t
    document.getElementById("report").value=t

    addEntry()

  }catch(e){}
}
setInterval(autoPasteAndProcess,0)

// EXTRACT
function extractTable3(text){
  let i=text.toLowerCase().indexOf("table 3")
  if(i===-1){
    i=text.toLowerCase().indexOf("applicant/technical person")
    if(i===-1) return ""
  }
  return text.substring(i)
}

// PARSE
function parseData(text){
  let l=text.split(/\n+/).map(x=>x.trim()).filter(x=>x)
  let r={}

  for(let i=0;i<l.length;i++){
    let line=l[i].toLowerCase()

    if(line.includes("technical person name"))
      r.techName=l[i].replace(/technical person name/i,"")||l[i+1]

    else if(line.includes("contact number")&&!r.techContact)
      r.techContact=l[i].replace(/contact number/i,"")||l[i+1]

    else if(line.includes("technical person type"))
      r.type=l[i].replace(/.*technical person type/i,"")||l[i+1]

    else if(
      (line.includes("owner") || line.includes("government") || line.includes("semi government")) 
      && !r.owner
    ){
      r.owner = l[i].replace(/individual owner|owner/i,"") || l[i+1]
    }

    else if(line.includes("contact number")&&r.techContact&&!r.ownerContact)
      r.ownerContact=l[i].replace(/contact number/i,"")||l[i+1]

    else if(line.includes("postal address"))
      r.ownerAddress=l[i].replace(/postal address/i,"")||l[i+1]

    else if(line.includes("structural engineer name")){
      let v=l[i].replace(/structural engineer name/i,"")||l[i+1]
      r.structural=v.toLowerCase().includes("only")?"-":v
    }
  }

  return r
}

// ADD
function addEntry(){

  let text=document.getElementById("report").value

  if(!text){
    setStatus("⚠️ Please enter data","error")
    return
  }

  let t3=extractTable3(text)
  if(!t3){
    setStatus("❌ Table 3 not found","error")
    return
  }

  let p=parseData(t3)

  let e={
    techName:p.techName?.trim(),
    techContact:p.techContact?.trim(),
    type:p.type?.trim(),
    owner:p.owner?.trim(),
    ownerContact:p.ownerContact?.trim(),
    ownerAddress:p.ownerAddress?.trim(),
    structural:p.structural||"-"
  }

  if(!isValidEntry(e)){
    setStatus("⚠️ Invalid Entry","error")
    return
  }

  if(isDuplicate(e)){
    setStatus("⚠️ Duplicate Entry","error")
    return
  }

  data.push(e)
  generateTable(true)

  setStatus(`✅ Entry Added (Sr. No. ${data.length})`)
  document.getElementById("report").value=""
}

// TABLE
function generateTable(newRow=false){
  let tb=document.querySelector("#table tbody")
  tb.innerHTML=""

  data.forEach((d,i)=>{
    tb.innerHTML+=`
    <tr class="${newRow && i===data.length-1?'new-row':''}">
      <td>${i+1}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td><button class="danger" onclick="deleteRow(${i})">Delete</button></td>
    </tr>`
  })
}

// DELETE
function deleteRow(i){
  data.splice(i,1)
  generateTable()
  setStatus("🗑️ Row Deleted","info")
}

// CLEAR
function clearInput(){
  document.getElementById("report").value=""
  setStatus("🧹 Input Cleared","info")
}

// RESET
function resetData(){
  data=[]
  lastClipboard=""
  document.querySelector("#table tbody").innerHTML=""
  setStatus("Reset Completed ✅")
}

// EXPORT
function exportExcel(){
  if(!data.length){
    setStatus("⚠️ No data to export","error")
    return
  }

  let ws=XLSX.utils.json_to_sheet(data.map((d,i)=>({
    "Sr. No.":i+1,
    "Technical Person Name":d.techName,
    "Technical Person Contact No.":d.techContact,
    "Technical Person Type":d.type,
    "Owner Name":d.owner,
    "Owner Contact No.":d.ownerContact,
    "Owner Address":d.ownerAddress,
    "Structural Engineer":d.structural
  })))

  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Data")
  XLSX.writeFile(wb,"Anoop_Meshram-PRO.xlsx")

  setStatus("⬇️ Excel Downloaded","success")
}

</script>

</body>
</html>
