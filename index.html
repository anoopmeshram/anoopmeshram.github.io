<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Login</title>

<!-- 🔥 FULL YOUR UI CSS (shortened for performance but looks same) -->
<style>
body {
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0a0a2e,#533483);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.future-card {
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.05);
    text-align:center;
    width:320px;
}

button {
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.google {background:#db4437;}
.github {background:#333;}
.login {background:linear-gradient(45deg,#ff00ff,#00ffff);}
</style>
</head>

<body>

<div class="future-card">

<h2>ENTER THE FUTURE 🚀</h2>

<form id="loginForm">
<input type="email" id="email" placeholder="Email" required><br><br>
<input type="password" id="password" placeholder="Password" required><br><br>
<button class="login">LOGIN</button>
</form>

<hr>

<button class="google" id="googleBtn">GOOGLE LOGIN</button>
<button class="github" id="githubBtn">GITHUB LOGIN</button>

</div>

<!-- 🔥 Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCxwMhsc4jlvDBvDXNVjOThR0C2fmJzVNA",
  authDomain: "anoop-meshram.firebaseapp.com",
  projectId: "anoop-meshram",
  storageBucket: "anoop-meshram.firebasestorage.app",
  messagingSenderId: "405659754599",
  appId: "1:405659754599:web:7bb26bb3a4ed9357d774c2",
  measurementId: "G-SDTBQBVPSS"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// 🟢 GOOGLE LOGIN
document.getElementById("googleBtn").onclick = async () => {
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);

        alert("Welcome " + result.user.displayName);

    } catch (err) {
        alert(err.message);
    }
};

// 🐙 GITHUB LOGIN
document.getElementById("githubBtn").onclick = async () => {
    try {
        const provider = new firebase.auth.GithubAuthProvider();
        const result = await auth.signInWithPopup(provider);

        alert("Welcome " + result.user.email);

    } catch (err) {
        alert(err.message);
    }
};

// 🔐 EMAIL LOGIN (DEMO)
document.getElementById("loginForm").addEventListener("submit",(e)=>{
    e.preventDefault();
    alert("Login Successful 🚀");
});
</script>

</body>
</html>
