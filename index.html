<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BPMS Extractor STABLE ⚡</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:#f1f5f9;
  padding:20px;
}
.container{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}
textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}
.danger{background:#dc2626;}
table{
  width:100%;
  margin-top:15px;
  border-collapse:collapse;
}
th,td{
  border:1px solid #ddd;
  padding:10px;
}
th{
  background:#111827;
  color:white;
}
.status-bar{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}
.success{background:#dcfce7;color:#166534;}
.error{background:#fee2e2;color:#991b1b;}
.info{background:#dbeafe;color:#1e3a8a;}
</style>
</head>

<body>

<div class="container">

<h2>🏗️ BPMS Extractor ⚡ (Stable Fast)</h2>

<textarea id="report" placeholder="Copy data → auto detect"></textarea><br>

<button onclick="toggleAuto()">⚡ Auto Mode</button>
<button onclick="exportExcel()">⬇ Download</button>
<button onclick="resetData()" class="danger">Reset</button>

<div id="statusBar" class="status-bar"></div>

<table id="table">
<thead>
<tr>
<th>Sr</th>
<th>Tech Name</th>
<th>Tech Contact</th>
<th>Type</th>
<th>Owner</th>
<th>Owner Contact</th>
<th>Address</th>
<th>Structural</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let lastClipboard=""
let autoMode=true

function setStatus(msg,type="success"){
  let el=document.getElementById("statusBar")
  el.className="status-bar "+type
  el.innerText=msg
}

// SAFE AUTO LOOP (300ms = fast + no lag)
setInterval(async ()=>{
  if(!autoMode) return;

  try{
    let text=await navigator.clipboard.readText()

    if(text && text!==lastClipboard){
      lastClipboard=text
      document.getElementById("report").value=text
      addEntry()
    }

  }catch(e){}
},300)

// TOGGLE
function toggleAuto(){
  autoMode=!autoMode
  setStatus("Auto: "+(autoMode?"ON ⚡":"OFF ❌"),"info")
}

// VALIDATION
function isValidEntry(e){
  if(!e.techName||!e.techContact||!e.owner) return false
  let p=/^[0-9]{10}$/
  if(!p.test(e.techContact)) return false
  return true
}

// PARSE
function parseData(text){
  let l=text.split(/\n+/).map(x=>x.trim()).filter(x=>x)
  let r={}
  for(let i=0;i<l.length;i++){
    let line=l[i].toLowerCase()

    if(line.includes("technical person name"))
      r.techName=l[i].replace(/technical person name/i,"")||l[i+1]

    else if(line.includes("contact number")&&!r.techContact)
      r.techContact=l[i].replace(/contact number/i,"")||l[i+1]

    else if(line.includes("technical person type"))
      r.type=l[i].replace(/.*technical person type/i,"")||l[i+1]

    else if(line.includes("owner")&&!r.owner)
      r.owner=l[i].replace(/owner/i,"")||l[i+1]
  }
  return r
}

// ADD
function addEntry(){
  let t=document.getElementById("report").value
  let p=parseData(t)

  let e={
    techName:p.techName?.trim(),
    techContact:p.techContact?.trim(),
    type:p.type,
    owner:p.owner
  }

  if(!isValidEntry(e)){
    setStatus("Invalid","error")
    return
  }

  data.push(e)
  render()
  setStatus("Added "+data.length)
}

// TABLE
function render(){
  let tb=document.querySelector("#table tbody")
  tb.innerHTML=""
  data.forEach((d,i)=>{
    tb.innerHTML+=`
    <tr>
      <td>${i+1}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td></td>
      <td></td>
      <td></td>
    </tr>`
  })
}

// RESET
function resetData(){
  data=[]
  render()
  setStatus("Reset Done")
}

// EXPORT
function exportExcel(){
  if(!data.length) return

  let ws=XLSX.utils.json_to_sheet(data)
  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Data")
  XLSX.writeFile(wb,"BPMS.xlsx")
}

</script>

</body>
</html>
