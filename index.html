<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BPMS Extractor PRO</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:'Consolas', monospace;
  background:black;
  padding:20px;
  color:#00ff9c;
  overflow-x:hidden;
}

/* MATRIX CANVAS */
#matrix{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-2;
}

/* SCANLINES */
body::after{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:repeating-linear-gradient(
    0deg,
    rgba(0,255,156,0.03) 0px,
    rgba(0,255,156,0.03) 1px,
    transparent 1px,
    transparent 2px
  );
  pointer-events:none;
  z-index:999;
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  background:rgba(0,0,0,0.85);
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 30px #00ff9c55;
  border:1px solid #00ff9c33;
  animation:flicker 3s infinite;
}

@keyframes flicker{
  0%,100%{opacity:1;}
  50%{opacity:0.95;}
}

h2{
  text-align:center;
  color:#00ff9c;
  text-shadow:0 0 10px #00ff9c;
}

textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:8px;
  border:1px solid #00ff9c;
  background:black;
  color:#00ff9c;
  resize:none;
  box-sizing:border-box;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:black;
  color:#00ff9c;
  cursor:pointer;
  border:1px solid #00ff9c;
}

button:hover{
  background:#00ff9c;
  color:black;
  box-shadow:0 0 10px #00ff9c;
}

.danger{
  border:1px solid #ff0033;
  color:#ff0033;
}

.danger:hover{
  background:#ff0033;
  color:white;
}

table{
  width:100%;
  margin-top:15px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #00ff9c33;
  padding:10px;
}

th{
  background:#001a12;
  color:#00ff9c;
}

.status-bar{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  display:flex;
  justify-content:center;
}

.success{background:#001a12;color:#00ff9c;}
.error{background:#1a0000;color:#ff0033;}
.info{background:#00111a;color:#00c3ff;}

.new-row{
  animation:glitch 1s ease;
}

@keyframes glitch{
  0%{background:#00ff9c55;}
  50%{background:#ff003355;}
  100%{background:transparent;}
}

/* HACK SCREEN */
#hackedScreen{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  color:#00ff9c;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  flex-direction:column;
  font-family:monospace;
  animation:fadeOut 0s ease 3s forwards;
}

#hackedScreen h1{
  color:red;
  text-shadow:0 0 20px red;
  animation:glitchText 0.3s infinite;
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

@keyframes glitchText{
  0%{transform:translate(0)}
  25%{transform:translate(-2px,2px)}
  50%{transform:translate(2px,-2px)}
  75%{transform:translate(-1px,1px)}
  100%{transform:translate(0)}
}
</style>
</head>

<body>

<!-- HACK SCREEN -->
<div id="hackedScreen">
  <p>> Initializing system...</p>
  <p>> Bypassing security...</p>
  <p>> Injecting payload...</p>
  <p>> Access Granted ✅</p>
  <h1>⚠️ SYSTEM HACKED ⚠️</h1>
</div>

<canvas id="matrix"></canvas>

<div class="container">

<h2>🏗️ BPMS Extractor PRO 🚀</h2>

<textarea id="report" placeholder="Welcome to Anoop Meshram's BPMS Extractor PRO Tool. Paste full data here..."></textarea><br>

<button onclick="addEntry()">➕ Extract Table 3</button>
<button onclick="exportExcel()">⬇ Download Excel</button>
<button onclick="clearInput()">🧹 Clear Input</button>
<button onclick="resetData()" class="danger">♻ Reset</button>

<div id="statusBar" class="status-bar"></div>

<table id="table">
<thead>
<tr>
<th>Sr. No.</th>
<th>Technical Person Name</th>
<th>Technical Person Contact No.</th>
<th>Technical Person Type</th>
<th>Owner Name</th>
<th>Owner Contact No.</th>
<th>Owner Address</th>
<th>Structural Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let lastClipboard=""

// STATUS
function setStatus(msg,type="success"){
  let el=document.getElementById("statusBar")
  el.className="status-bar "+type
  el.innerText=msg
}

// DUPLICATE
function isDuplicate(e){
  return data.some(d=>JSON.stringify(d)===JSON.stringify(e))
}

// ✅ FIXED VALIDATION
function isValidEntry(e){

  if(!e.techName || !e.techContact || !e.owner){
    return false
  }

  let phone=/^[0-9]{10}$/

  if(!phone.test(e.techContact)) return false
  if(e.ownerContact && !phone.test(e.ownerContact)) return false

  if(e.techName.length<3 || e.owner.length<3){
    return false
  }

  return true
}

// AUTO PASTE
async function autoPasteAndProcess(){
  try{
    let t=await navigator.clipboard.readText()
    if(!t || t===lastClipboard) return

    lastClipboard=t
    document.getElementById("report").value=t

    addEntry()

  }catch(e){}
}
setInterval(autoPasteAndProcess,0)

// EXTRACT
function extractTable3(text){
  let i=text.toLowerCase().indexOf("table 3")
  if(i===-1){
    i=text.toLowerCase().indexOf("applicant/technical person")
    if(i===-1) return ""
  }
  return text.substring(i)
}

// PARSE
function parseData(text){
  let l=text.split(/\n+/).map(x=>x.trim()).filter(x=>x)
  let r={}

  for(let i=0;i<l.length;i++){
    let line=l[i].toLowerCase()

    if(line.includes("technical person name"))
      r.techName=l[i].replace(/technical person name/i,"")||l[i+1]

    else if(line.includes("contact number")&&!r.techContact)
      r.techContact=l[i].replace(/contact number/i,"")||l[i+1]

    else if(line.includes("technical person type"))
      r.type=l[i].replace(/.*technical person type/i,"")||l[i+1]

    else if(
      (line.includes("owner") || line.includes("government") || line.includes("semi government")) 
      && !r.owner
    ){
      r.owner = l[i].replace(/individual owner|owner/i,"") || l[i+1]
    }

    else if(line.includes("contact number")&&r.techContact&&!r.ownerContact)
      r.ownerContact=l[i].replace(/contact number/i,"")||l[i+1]

    else if(line.includes("postal address"))
      r.ownerAddress=l[i].replace(/postal address/i,"")||l[i+1]

    else if(line.includes("structural engineer name")){
      let v=l[i].replace(/structural engineer name/i,"")||l[i+1]
      r.structural=v.toLowerCase().includes("only")?"-":v
    }
  }

  return r
}

// ADD
function addEntry(){

  let text=document.getElementById("report").value

  if(!text){
    setStatus("⚠️ Please enter data","error")
    return
  }

  let t3=extractTable3(text)
  if(!t3){
    setStatus("❌ Table 3 not found","error")
    return
  }

  let p=parseData(t3)

  let e={
    techName:p.techName?.trim(),
    techContact:p.techContact?.trim(),
    type:p.type?.trim(),
    owner:p.owner?.trim(),
    ownerContact:p.ownerContact?.trim(),
    ownerAddress:p.ownerAddress?.trim(),
    structural:p.structural||"-"
  }

  if(!isValidEntry(e)){
    setStatus("⚠️ Invalid Entry","error")
    return
  }

  if(isDuplicate(e)){
    setStatus("⚠️ Duplicate Entry","error")
    return
  }

  data.push(e)
  generateTable(true)

  setStatus(`✅ Entry Added (Sr. No. ${data.length})`)
  document.getElementById("report").value=""
}

// TABLE
function generateTable(newRow=false){
  let tb=document.querySelector("#table tbody")
  tb.innerHTML=""

  data.forEach((d,i)=>{
    tb.innerHTML+=`
    <tr class="${newRow && i===data.length-1?'new-row':''}">
      <td>${i+1}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td><button class="danger" onclick="deleteRow(${i})">Delete</button></td>
    </tr>`
  })
}

// DELETE
function deleteRow(i){
  data.splice(i,1)
  generateTable()
  setStatus("🗑️ Row Deleted","info")
}

// CLEAR
function clearInput(){
  document.getElementById("report").value=""
  setStatus("🧹 Input Cleared","info")
}

// RESET
function resetData(){
  data=[]
  lastClipboard=""
  document.querySelector("#table tbody").innerHTML=""
  setStatus("Reset Completed ✅")
}

// EXPORT
function exportExcel(){
  if(!data.length){
    setStatus("⚠️ No data to export","error")
    return
  }

  let ws=XLSX.utils.json_to_sheet(data.map((d,i)=>({
    "Sr. No.":i+1,
    "Technical Person Name":d.techName,
    "Technical Person Contact No.":d.techContact,
    "Technical Person Type":d.type,
    "Owner Name":d.owner,
    "Owner Contact No.":d.ownerContact,
    "Owner Address":d.ownerAddress,
    "Structural Engineer":d.structural
  })))

  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Data")
  XLSX.writeFile(wb,"Anoop_Meshram-PRO.xlsx")

  setStatus("⬇️ Excel Downloaded","success")
}

/* MATRIX SCRIPT */
let canvas=document.getElementById("matrix")
let ctx=canvas.getContext("2d")

canvas.height=window.innerHeight
canvas.width=window.innerWidth

let letters="01ABCDEFGHIJKLMNOPQRSTUVWXYZ"
letters=letters.split("")

let fontSize=14
let columns=canvas.width/fontSize

let drops=[]
for(let x=0;x<columns;x++) drops[x]=1

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.05)"
  ctx.fillRect(0,0,canvas.width,canvas.height)

  ctx.fillStyle="#00ff9c"
  ctx.font=fontSize+"px monospace"

  for(let i=0;i<drops.length;i++){
    let text=letters[Math.floor(Math.random()*letters.length)]
    ctx.fillText(text,i*fontSize,drops[i]*fontSize)

    if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
      drops[i]=0

    drops[i]++
  }
}

setInterval(draw,33)

</script>

</body>
</html>
