<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BPMS Extractor // HACKER MODE</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:'Consolas', monospace;
  background: radial-gradient(circle at top, #020617, #000000);
  color:#00ff9c;
  padding:20px;
}

.container{
  max-width:1100px;
  margin:auto;
  background:rgba(0,0,0,0.7);
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 25px #00ff9c33;
  border:1px solid #00ff9c33;
}

h2{
  text-align:center;
  color:#00ff9c;
  text-shadow:0 0 10px #00ff9c;
}

textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:8px;
  border:1px solid #00ff9c;
  background:#000;
  color:#00ff9c;
}

button{
  padding:10px;
  margin:5px;
  border-radius:8px;
  background:#001a12;
  color:#00ff9c;
  border:1px solid #00ff9c;
  cursor:pointer;
}

button:hover{
  background:#00ff9c;
  color:#000;
}

.danger{
  border:1px solid #ff0033;
  color:#ff0033;
}

.danger:hover{
  background:#ff0033;
  color:white;
}

table{
  width:100%;
  margin-top:15px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #00ff9c33;
  padding:10px;
}

th{
  background:#001a12;
  color:#00ff9c;
}

.status-bar{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  display:flex;
  justify-content:center;
}

.success{background:#001a12;color:#00ff9c;}
.error{background:#1a0000;color:#ff0033;}
.info{background:#00111a;color:#00c3ff;}
</style>
</head>

<body>

<div class="container">

<h2>💀 BPMS Extractor // HACKER MODE 💻</h2>

<textarea id="report" placeholder="Paste full data here..."></textarea><br>

<button onclick="addEntry()">Extract Table 3</button>
<button onclick="exportExcel()">Download Excel</button>
<button onclick="clearInput()">Clear Input</button>
<button onclick="resetData()" class="danger">Reset</button>

<div id="statusBar" class="status-bar"></div>

<table id="table">
<thead>
<tr>
<th>Sr. No.</th>
<th>Technical Person Name</th>
<th>Technical Person Contact No.</th>
<th>Technical Person Type</th>
<th>Owner Name</th>
<th>Owner Contact No.</th>
<th>Owner Address</th>
<th>Structural Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let lastClipboard=""

// STATUS
function setStatus(msg,type="success"){
  let el=document.getElementById("statusBar")
  el.className="status-bar "+type
  el.innerText=msg
}

// DUPLICATE
function isDuplicate(e){
  return data.some(d=>JSON.stringify(d)===JSON.stringify(e))
}

// VALIDATION
function isValidEntry(e){
  if(!e.techName || !e.techContact || !e.owner) return false

  let phone=/^[0-9]{10}$/
  if(!phone.test(e.techContact)) return false
  if(e.ownerContact && !phone.test(e.ownerContact)) return false

  return true
}

// AUTO PASTE
async function autoPasteAndProcess(){
  try{
    let t=await navigator.clipboard.readText()
    if(!t || t===lastClipboard) return

    lastClipboard=t
    document.getElementById("report").value=t

    addEntry()

  }catch(e){}
}
setInterval(autoPasteAndProcess,300)

// EXTRACT
function extractTable3(text){
  let lower=text.toLowerCase()

  let i=lower.indexOf("table 3")
  if(i===-1){
    i=lower.indexOf("technical person")
    if(i===-1) return ""
  }

  return text.substring(i)
}

// ✅ FIXED PARSER (ROBUST)
function parseData(text){
  let lines=text.split(/\n+/).map(x=>x.trim()).filter(x=>x)

  let r={
    techName:"",
    techContact:"",
    type:"",
    owner:"",
    ownerContact:"",
    ownerAddress:"",
    structural:"-"
  }

  for(let i=0;i<lines.length;i++){
    let line=lines[i]
    let l=line.toLowerCase()

    if(l.includes("technical person name")){
      r.techName = line.replace(/technical person name[:\-]*/i,"").trim() || lines[i+1]
    }

    else if(l.includes("technical person type")){
      r.type = line.replace(/technical person type[:\-]*/i,"").trim() || lines[i+1]
    }

    else if(l.includes("contact number") && !r.techContact){
      r.techContact = line.replace(/contact number[:\-]*/i,"").trim() || lines[i+1]
    }

    else if((l.includes("owner") || l.includes("government")) && !r.owner){
      r.owner = line.replace(/individual owner|owner[:\-]*/i,"").trim() || lines[i+1]
    }

    else if(l.includes("contact number") && r.techContact && !r.ownerContact){
      r.ownerContact = line.replace(/contact number[:\-]*/i,"").trim() || lines[i+1]
    }

    else if(l.includes("postal address")){
      r.ownerAddress = line.replace(/postal address[:\-]*/i,"").trim() || lines[i+1]
    }

    else if(l.includes("structural engineer")){
      let val=line.replace(/structural engineer name[:\-]*/i,"").trim() || lines[i+1]
      r.structural = val.toLowerCase().includes("only") ? "-" : val
    }
  }

  return r
}

// ADD
function addEntry(){
  let text=document.getElementById("report").value

  if(!text){
    setStatus("Please enter data","error")
    return
  }

  let t3=extractTable3(text)
  if(!t3){
    setStatus("Table 3 not found","error")
    return
  }

  let p=parseData(t3)

  let e={
    techName:p.techName,
    techContact:p.techContact,
    type:p.type,
    owner:p.owner,
    ownerContact:p.ownerContact,
    ownerAddress:p.ownerAddress,
    structural:p.structural
  }

  if(!isValidEntry(e)){
    setStatus("Invalid Entry","error")
    return
  }

  if(isDuplicate(e)){
    setStatus("Duplicate Entry","error")
    return
  }

  data.push(e)
  generateTable()

  setStatus("Entry Added Successfully")
  document.getElementById("report").value=""
}

// TABLE
function generateTable(){
  let tb=document.querySelector("#table tbody")
  tb.innerHTML=""

  data.forEach((d,i)=>{
    tb.innerHTML+=`
    <tr>
      <td>${i+1}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td><button class="danger" onclick="deleteRow(${i})">Delete</button></td>
    </tr>`
  })
}

// DELETE
function deleteRow(i){
  data.splice(i,1)
  generateTable()
  setStatus("Row Deleted","info")
}

// CLEAR
function clearInput(){
  document.getElementById("report").value=""
  setStatus("Input Cleared","info")
}

// RESET
function resetData(){
  data=[]
  lastClipboard=""
  document.querySelector("#table tbody").innerHTML=""
  setStatus("Reset Completed")
}

// EXPORT
function exportExcel(){
  if(!data.length){
    setStatus("No data to export","error")
    return
  }

  let ws=XLSX.utils.json_to_sheet(data.map((d,i)=>({
    "Sr. No.":i+1,
    "Technical Person Name":d.techName,
    "Technical Person Contact No.":d.techContact,
    "Technical Person Type":d.type,
    "Owner Name":d.owner,
    "Owner Contact No.":d.ownerContact,
    "Owner Address":d.ownerAddress,
    "Structural Engineer":d.structural
  })))

  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Data")
  XLSX.writeFile(wb,"BPMS_Data.xlsx")

  setStatus("Excel Downloaded","success")
}

</script>

</body>
</html>
