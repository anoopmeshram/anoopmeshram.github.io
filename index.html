<!DOCTYPE html>
<html>
<head>
<title>Anoop Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background:#0d1117;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box {
    background:#161b22;
    padding:30px;
    border-radius:10px;
    text-align:center;
    width:300px;
}

button {
    width:100%;
    padding:10px;
    margin:10px 0;
    cursor:pointer;
    border:none;
}

#google {background:#db4437;color:white;}
#github {background:#333;color:white;}

#dashboard {display:none;}
img {border-radius:50%;}
</style>

</head>

<body>

<div class="box">

<div id="login">
    <h2>Login 🚀</h2>

    <button id="google">Login with Google</button>
    <button id="github">Login with GitHub</button>
</div>

<div id="dashboard">
    <h2>Welcome 🚀</h2>
    <img id="photo" width="100"><br><br>
    <p id="name"></p>
    <p id="email"></p>
    <button onclick="logout()">Logout</button>
</div>

</div>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
// ✅ TERA REAL CONFIG (already set)
const firebaseConfig = {
  apiKey: "AIzaSyCxwMhsc4jlvDBvDXNVjOThR0C2fmJzVNA",
  authDomain: "anoop-meshram.firebaseapp.com",
  projectId: "anoop-meshram",
  storageBucket: "anoop-meshram.firebasestorage.app",
  messagingSenderId: "405659754599",
  appId: "1:405659754599:web:7bb26bb3a4ed9357d774c2",
  measurementId: "G-SDTBQBVPSS"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// Elements
const loginDiv = document.getElementById("login");
const dashboardDiv = document.getElementById("dashboard");

// Auto login
const user = JSON.parse(localStorage.getItem("user"));
if (user) showDashboard(user);

// Google Login
document.getElementById("google").onclick = async () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await auth.signInWithPopup(provider);

    localStorage.setItem("user", JSON.stringify(result.user));
    showDashboard(result.user);
};

// GitHub Login
document.getElementById("github").onclick = async () => {
    const provider = new firebase.auth.GithubAuthProvider();
    const result = await auth.signInWithPopup(provider);

    localStorage.setItem("user", JSON.stringify(result.user));
    showDashboard(result.user);
};

// Show dashboard
function showDashboard(user){
    loginDiv.style.display="none";
    dashboardDiv.style.display="block";

    document.getElementById("name").innerText = user.displayName || "User";
    document.getElementById("email").innerText = user.email || "";

    if(user.photoURL){
        document.getElementById("photo").src = user.photoURL;
    }
}

// Logout
function logout(){
    localStorage.removeItem("user");
    location.reload();
}
</script>

</body>
</html>
