<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anoop Meshram</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#fff;
}

.hero{
    min-height:100vh;
    background:linear-gradient(90deg,#0077b6 0%, #29a3d9 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 8%;
}

.container{
    width:100%;
    max-width:1400px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:80px;
}

.content{
    flex:1;
    color:#fff;
}

.content h1{
    font-size:64px;
    font-weight:700;
    line-height:1.1;
    margin-bottom:40px;
}

.content p{
    font-size:22px;
    line-height:1.8;
    margin-bottom:20px;
}

.contact{
    margin-top:70px;
    display:flex;
    flex-wrap:wrap;
    gap:40px;
}

.contact a{
    color:#fff;
    text-decoration:none;
    font-size:24px;
}

.contact i{
    margin-right:12px;
}

.image-box{
    flex:0 0 420px;
    display:flex;
    justify-content:center;
}

.image-box img{
    width:420px;
    height:420px;
    border-radius:50%;
    object-fit:cover;
}

@media(max-width:992px){

    .container{
        flex-direction:column-reverse;
        text-align:center;
        gap:40px;
    }

    .content h1{
        font-size:42px;
    }

    .content p{
        font-size:18px;
    }

    .contact{
        justify-content:center;
        gap:20px;
    }

    .contact a{
        font-size:18px;
    }

    .image-box{
        flex:auto;
    }

    .image-box img{
        width:280px;
        height:280px;
    }
}
</style>
</head>

<body>

<section class="hero">

    <div class="container">

        <div class="content">

            <h1>
                Please Contact Anoop Bandu Meshram
                to plan your life goal
            </h1>

            <p>
                Anoop Bandu Meshram is an insurance consultant with Bajaj Life Insurance
                and has expertise in tax consultant and financial planning.
            </p>

            <p>
                You can connect with Anoop Bandu Meshram
            </p>

            <div class="contact">

                <a href="tel:8999053974">
                    <i class="fas fa-phone"></i>
                    8999053974
                </a>

                <a href="mailto:anoop.meshram@bajajlifeinsurance.com">
                    <i class="fas fa-envelope"></i>
                    anoop.meshram@bajajlifeinsurance.com
                </a>

            </div>

        </div>

        <div class="image-box">
            <!-- Replace image path with your photo -->
            <img src="anoop.jpg" alt="Anoop Meshram">
        </div>

    </div>

</section>

</body>
</html>
