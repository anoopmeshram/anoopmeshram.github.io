<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BPMS Extractor PRO 🚀</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:#f1f5f9;
  padding:20px;
}

.container{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{text-align:center;}

textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover{background:#1d4ed8;}

.danger{background:#dc2626;}

table{
  width:100%;
  margin-top:15px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
}

th{
  background:#111827;
  color:white;
}

.status-bar{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  display:flex;
  justify-content:center;
  text-align:center;
}

.status-bar.dual{
  justify-content:space-between;
}

.status-left{width:100%;}
.status-right{display:none;}

.status-bar.dual .status-left{
  width:auto;
  text-align:left;
}

.status-bar.dual .status-right{
  display:block;
  color:#2563eb;
}

.success{background:#dcfce7;color:#166534;}
.error{background:#fee2e2;color:#991b1b;}
.info{background:#dbeafe;color:#1e3a8a;}

.new-row{
  animation:highlight 1.5s ease;
}

@keyframes highlight{
  0%{background:#d1fae5;}
  100%{background:white;}
}
</style>
</head>

<body>

<div class="container">

<h2>🏗️ BPMS Extractor PRO 🚀</h2>

<textarea id="report" placeholder="Paste full data here..."></textarea><br>

<button onclick="addEntry()">➕ Extract Table 3</button>
<button onclick="exportExcel()">⬇ Download Excel</button>
<button onclick="clearInput()">🧹 Clear Input</button>
<button onclick="resetData()" class="danger">♻ Reset</button>

<div id="statusBar" class="status-bar">
  <span class="status-left"></span>
  <span class="status-right"></span>
</div>

<table id="table">
<thead>
<tr>
<th>Sr. No.</th>
<th>Technical Person Name</th>
<th>Technical Person Contact No.</th>
<th>Technical Person Type</th>
<th>Owner Name</th>
<th>Owner Contact No.</th>
<th>Owner Address</th>
<th>Structural Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let lastClipboard=""

function cleanValue(v){
  if(!v) return "-"
  let t=v.toLowerCase().trim()
  if(t.includes("only in case") || t==="n/a" || t==="-") return "-"
  return v.trim()
}

function setStatus(left="",type="success",right=""){
  let el=document.getElementById("statusBar")
  el.className="status-bar "+type

  el.querySelector(".status-left").innerText=left
  el.querySelector(".status-right").innerText=right

  if(right){
    el.classList.add("dual")
  }else{
    el.classList.remove("dual")
  }
}

function isDuplicate(e){
  return data.some(d =>
    d.techName===e.techName &&
    d.techContact===e.techContact &&
    d.owner===e.owner
  )
}

function isValidEntry(e){
  if(!e.techName||!e.techContact||!e.owner) return false
  let bad=/function|var |let |const |=>|\{|\}/i
  return !bad.test(Object.values(e).join(" "))
}

async function autoPasteAndProcess(){
  try{
    if(!document.hasFocus()) return

    let t=await navigator.clipboard.readText()
    if(!t||t===lastClipboard) return

    lastClipboard=t
    document.getElementById("report").value=t

    let res=addEntry()

    if(res==="success"){
      setStatus(`✅ Entry Added (Sr. No. ${data.length})`,`success`,`⚡ Auto Processed`)
    }

  }catch(e){}
}

setInterval(autoPasteAndProcess,2000)

function extractTable3(text){
  let i=text.toLowerCase().indexOf("table 3")
  if(i===-1){
    i=text.toLowerCase().indexOf("applicant/technical person")
    if(i===-1) return ""
  }
  return text.substring(i)
}

function parseData(text){
  let l=text.split(/\n+/).map(x=>x.trim()).filter(x=>x)
  let r={}

  for(let i=0;i<l.length;i++){
    let line=l[i].toLowerCase()

    if(line.includes("technical person name"))
      r.techName=l[i].replace(/technical person name/i,"")||l[i+1]

    else if(line.includes("technical person contact"))
      r.techContact=l[i].replace(/.*contact/i,"")||l[i+1]

    else if(line.includes("technical person type"))
      r.type=l[i].replace(/.*type/i,"")||l[i+1]

    else if(line.includes("owner")&&!r.owner)
      r.owner=l[i].replace(/individual owner|owner/i,"")||l[i+1]

    else if(line.includes("owner contact"))
      r.ownerContact=l[i].replace(/.*contact/i,"")||l[i+1]

    else if(line.includes("postal address"))
      r.ownerAddress=l[i].replace(/postal address/i,"")||l[i+1]

    else if(line.includes("structural engineer name")){
      let v=l[i].replace(/structural engineer name/i,"")||l[i+1]
      r.structural=v
    }
  }

  return r
}

function addEntry(){

  let text=document.getElementById("report").value

  if(!text){
    setStatus("⚠️ Please enter data","error")
    return "error"
  }

  let t3=extractTable3(text)
  if(!t3){
    setStatus("❌ Table 3 not found","error")
    return "error"
  }

  let p=parseData(t3)

  let e={
    techName:cleanValue(p.techName),
    techContact:cleanValue(p.techContact),
    type:cleanValue(p.type),
    owner:cleanValue(p.owner),
    ownerContact:cleanValue(p.ownerContact),
    ownerAddress:cleanValue(p.ownerAddress),
    structural:cleanValue(p.structural)
  }

  if(!isValidEntry(e)){
    setStatus("⚠️ Invalid Entry","error")
    return "error"
  }

  if(isDuplicate(e)){
    setStatus("⚠️ Duplicate Entry","error")
    return "duplicate"
  }

  data.push(e)

  setStatus(`✅ Entry Added (Sr. No. ${data.length})`)
  document.getElementById("report").value=""
  document.getElementById("report").focus()
  generateTable(true)

  return "success"
}

function generateTable(n=false){
  let tb=document.querySelector("#table tbody")
  tb.innerHTML=""

  data.forEach((d,i)=>{
    tb.innerHTML+=`
    <tr class="${n&&i===data.length-1?'new-row':''}">
      <td>${i+1}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td><button class="danger" onclick="deleteRow(${i})">Delete</button></td>
    </tr>`
  })
}

function deleteRow(i){
  data.splice(i,1)
  generateTable()
  setStatus("🗑️ Row Deleted","info")
}

function clearInput(){
  document.getElementById("report").value=""
  setStatus("🧹 Input Cleared","info")
}

function resetData(){
  data=[]
  lastClipboard=""
  document.querySelector("#table tbody").innerHTML=""
  document.getElementById("report").value=""
  setStatus("♻️ Reset Completed","success")
}

function exportExcel(){
  if(!data.length){
    setStatus("⚠️ No data","error")
    return
  }

  let ws=XLSX.utils.json_to_sheet(data.map((d,i)=>({
    "Sr. No.":i+1,
    "Technical Person Name":d.techName,
    "Technical Person Contact No.":d.techContact,
    "Technical Person Type":d.type,
    "Owner Name":d.owner,
    "Owner Contact No.":d.ownerContact,
    "Owner Address":d.ownerAddress,
    "Structural Engineer":d.structural
  })))

  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Data")

  let date=new Date().toISOString().split('T')[0]
  XLSX.writeFile(wb,`BPMS_Data_${date}.xlsx`)

  setStatus("⬇️ Excel Downloaded","success")
}

</script>

</body>
</html>
