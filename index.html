<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BPMS Extractor PRO</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:#f1f5f9;
  padding:20px;
}

.container{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{text-align:center;}

textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover{background:#1d4ed8;}
.danger{background:#dc2626;}

table{
  width:100%;
  margin-top:15px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
}

th{
  background:#111827;
  color:white;
}

.status-bar{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  text-align:center;
}

.success{background:#dcfce7;color:#166534;}
.error{background:#fee2e2;color:#991b1b;}
.info{background:#dbeafe;color:#1e3a8a;}

.new-row{
  animation:highlight 1.5s ease;
}

@keyframes highlight{
  0%{background:#d1fae5;}
  100%{background:white;}
}
</style>
</head>

<body>

<div class="container">

<h2>🏗️ BPMS Extractor PRO 🚀</h2>

<textarea id="report" placeholder="Paste full data here..."></textarea><br>

<button onclick="addEntry()">➕ Extract Table 3</button>
<button onclick="exportExcel()">⬇ Download Excel</button>
<button onclick="clearInput()">🧹 Clear Input</button>
<button onclick="resetData()" class="danger">♻ Reset</button>

<div id="statusBar" class="status-bar"></div>

<table id="table">
<thead>
<tr>
<th>Sr. No.</th>
<th>Technical Person Name</th>
<th>Technical Person Contact No.</th>
<th>Technical Person Type</th>
<th>Owner Name</th>
<th>Owner Contact No.</th>
<th>Owner Address</th>
<th>Structural Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let lastClipboard=""

// STATUS
function setStatus(msg,type="success"){
  let el=document.getElementById("statusBar")
  el.className="status-bar "+type
  el.innerText=msg
}

// SAFE VALUE
function safe(v){
  if(!v || v.trim()==="") return "-"
  return v.trim()
}

// DUPLICATE
function isDuplicate(e){
  return data.some(d=>JSON.stringify(d)===JSON.stringify(e))
}

// AUTO PASTE
async function autoPasteAndProcess(){
  try{
    let t=await navigator.clipboard.readText()
    if(!t || t===lastClipboard) return

    lastClipboard=t
    document.getElementById("report").value=t

    let res=addEntry()

    if(res==="success"){
      setStatus(`✅ Entry Added (Sr. No. ${data.length})`)
    }

  }catch(e){}
}

setInterval(autoPasteAndProcess,2000)

// EXTRACT TABLE 3
function extractTable3(text){
  let i=text.toLowerCase().indexOf("table 3")
  if(i===-1){
    i=text.toLowerCase().indexOf("applicant/technical person")
    if(i===-1) return ""
  }
  return text.substring(i)
}

// PARSE DATA (FINAL LOGIC)
function parseData(text){

  let lines=text.split(/\n+/).map(x=>x.trim()).filter(x=>x)

  let r={}

  for(let i=0;i<lines.length;i++){

    let l=lines[i].toLowerCase()

    if(l.includes("technical person name"))
      r.techName=lines[i+1]

    else if(l.includes("technical person type"))
      r.type=lines[i+1]

    else if(l.includes("technical person contact"))
      r.techContact=lines[i+1]

    // 🔥 GOVERNMENT RULE APPLIED
    else if(
      l.includes("owner name") ||
      l.includes("individual owner") ||
      l.includes("government") ||
      l.includes("semi government")
    ){
      let val = lines[i+1] || lines[i]

      if(l.includes("government") || l.includes("semi government")){
        r.owner = val.replace(/government|semi government/ig,"").trim()
      }else{
        r.owner = val
      }
    }

    else if(l.includes("owner contact"))
      r.ownerContact=lines[i+1]

    else if(l.includes("postal address"))
      r.ownerAddress=lines[i+1]

    else if(l.includes("structural engineer")){
      let v=lines[i+1] || "-"
      r.structural = v.toLowerCase().includes("only") ? "-" : v
    }
  }

  return r
}

// ADD ENTRY
function addEntry(){

  let text=document.getElementById("report").value

  if(!text){
    setStatus("⚠️ Please enter data","error")
    return "error"
  }

  let t3=extractTable3(text)

  if(!t3){
    setStatus("❌ Table 3 not found","error")
    return "error"
  }

  let p=parseData(t3)

  let e={
    techName:safe(p.techName),
    techContact:safe(p.techContact),
    type:safe(p.type),
    owner:safe(p.owner),
    ownerContact:safe(p.ownerContact),
    ownerAddress:safe(p.ownerAddress),
    structural:safe(p.structural)
  }

  if(isDuplicate(e)){
    setStatus("⚠️ Duplicate Entry Detected","error")
    return "duplicate"
  }

  data.push(e)

  document.getElementById("report").value=""
  generateTable(true)

  return "success"
}

// GENERATE TABLE
function generateTable(n=false){

  let tb=document.querySelector("#table tbody")
  tb.innerHTML=""

  data.forEach((d,i)=>{
    tb.innerHTML+=`
    <tr class="${n&&i===data.length-1?'new-row':''}">
      <td>${i+1}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td><button class="danger" onclick="deleteRow(${i})">Delete</button></td>
    </tr>`
  })

}

// DELETE
function deleteRow(i){
  data.splice(i,1)
  generateTable()
  setStatus("🗑️ Row Deleted","info")
}

// CLEAR INPUT
function clearInput(){
  document.getElementById("report").value=""
  setStatus("🧹 Input Cleared","info")
}

// RESET
function resetData(){
  data=[]
  lastClipboard=""
  document.querySelector("#table tbody").innerHTML=""
  document.getElementById("report").value=""
  setStatus("Reset Completed ✅")
}

// EXPORT EXCEL
function exportExcel(){

  if(!data.length){
    setStatus("⚠️ No data to export","error")
    return
  }

  let ws=XLSX.utils.json_to_sheet(data.map((d,i)=>({
    "Sr. No.":i+1,
    "Technical Person Name":d.techName,
    "Technical Person Contact No.":d.techContact,
    "Technical Person Type":d.type,
    "Owner Name":d.owner,
    "Owner Contact No.":d.ownerContact,
    "Owner Address":d.ownerAddress,
    "Structural Engineer":d.structural
  })))

  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Data")
  XLSX.writeFile(wb,"Anoop_Meshram-PRO.xlsx")

  setStatus("⬇️ Excel Downloaded","success")
}

</script>

</body>
</html>
