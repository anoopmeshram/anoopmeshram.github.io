<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scrutiny Extractor PRO</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:#f1f5f9;
  padding:20px;
}

.container{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{text-align:center;}

textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
  background:#1d4ed8;
}

.danger{background:#dc2626;}

table{
  width:100%;
  margin-top:15px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
}

th{
  background:#111827;
  color:white;
  font-weight:bold;
}

tr:nth-child(even){background:#f9fafb;}

/* 🔥 SMART STATUS BAR */
.status-bar{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:all 0.3s ease;
  text-align:center;
}

.status-bar.dual{
  justify-content:space-between;
}

.status-left{
  width:100%;
  text-align:center;
}

.status-right{
  display:none;
}

.status-bar.dual .status-left{
  width:auto;
  text-align:left;
}

.status-bar.dual .status-right{
  display:block;
  text-align:right;
  color:#2563eb;
  font-weight:600;
}

.success{background:#dcfce7;color:#166534;}
.error{background:#fee2e2;color:#991b1b;}
.info{background:#dbeafe;color:#1e3a8a;}

.status-bar.show{transform:scale(1.02);}

@keyframes highlight{
  0%{background:#d1fae5;}
  100%{background:white;}
}

.new-row{animation:highlight 1.5s ease;}
</style>
</head>

<body>

<div class="container">

<h2>🏗️ Scrutiny Extractor</h2>

<textarea id="report" placeholder="Paste full data here..."></textarea>

<br>

<button onclick="addEntry()">➕ Extract Table 3</button>
<button onclick="exportExcel()">⬇ Download Excel</button>
<button onclick="clearInput()">🧹 Clear Input</button>
<button onclick="resetData()" class="danger">♻ Reset</button>

<div id="statusBar" class="status-bar">
  <span class="status-left"></span>
  <span class="status-right"></span>
</div>

<table id="table">
<thead>
<tr>
<th>Sr. No.</th>
<th>Technical Person Name</th>
<th>Technical Person Contact No.</th>
<th>Technical Person Type</th>
<th>Owner Name</th>
<th>Owner Contact No.</th>
<th>Owner Address</th>
<th>Structural Engineer</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let data=[]
let lastClipboard=""

// 🔥 STATUS CONTROL
function setStatus(leftMsg="", type="success", rightMsg=""){
  let el=document.getElementById("statusBar")

  el.className="status-bar "+type+" show"

  let left = el.querySelector(".status-left")
  let right = el.querySelector(".status-right")

  left.innerText = leftMsg
  right.innerText = rightMsg

  if(rightMsg && rightMsg.trim() !== ""){
    el.classList.add("dual")
  }else{
    el.classList.remove("dual")
  }
}

// 🔥 DUPLICATE CHECK
function isDuplicate(newEntry){
  return data.some(d => JSON.stringify(d) === JSON.stringify(newEntry))
}

// 🔥 AUTO SYSTEM
async function autoPasteAndProcess(){
  try{
    const text = await navigator.clipboard.readText()

    if(!text || text.trim()==="") return
    if(text.trim() === lastClipboard.trim()) return

    lastClipboard = text

    let input = document.getElementById("report")
    input.value = text

    document.querySelector("button[onclick='addEntry()']").click()

    setStatus(
      `✅ Entry Added (Sr. No. ${data.length})`,
      "success",
      "⚡ New Data Auto Processed"
    )

  }catch(err){
    console.log("Clipboard permission needed")
  }
}

// TAB SWITCH
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    autoPasteAndProcess()
  }
})

// BACKGROUND CHECK
setInterval(autoPasteAndProcess,2000)

// TABLE 3
function extractTable3(text){
  let start=text.toLowerCase().indexOf("table 3")
  if(start===-1){
    start=text.toLowerCase().indexOf("applicant/technical person")
    if(start===-1) return ""
  }
  return text.substring(start)
}

// PARSER
function parseData(text){
  let lines=text.split(/\n+/).map(l=>l.trim()).filter(l=>l)
  let r={}

  for(let i=0;i<lines.length;i++){
    let line=lines[i].toLowerCase()

    if(line.includes("technical person name"))
      r.techName = lines[i].replace(/technical person name/i,"") || lines[i+1]

    else if(line.includes("contact number") && !r.techContact)
      r.techContact = lines[i].replace(/contact number/i,"") || lines[i+1]

    else if(line.includes("technical person type"))
      r.type = lines[i].replace(/.*technical person type/i,"") || lines[i+1]

    else if(line.includes("owner") && !r.owner)
      r.owner = lines[i].replace(/individual owner|owner/i,"") || lines[i+1]

    else if(line.includes("contact number") && r.techContact && !r.ownerContact)
      r.ownerContact = lines[i].replace(/contact number/i,"") || lines[i+1]

    else if(line.includes("postal address"))
      r.ownerAddress = lines[i].replace(/postal address/i,"") || lines[i+1]

    else if(line.includes("structural engineer name")){
      let val = lines[i].replace(/structural engineer name/i,"") || lines[i+1]
      r.structural = val.toLowerCase().includes("only") ? "-" : val
    }
  }

  return r
}

// ADD ENTRY
function addEntry(){

  let text=document.getElementById("report").value

  if(!text){
    setStatus("⚠️ Please enter data","error")
    return
  }

  let table3=extractTable3(text)

  if(!table3){
    setStatus("❌ Table 3 not found","error")
    return
  }

  let p=parseData(table3)

  let newEntry = {
    techName:p.techName?.trim(),
    techContact:p.techContact?.trim(),
    type:p.type?.trim(),
    owner:p.owner?.trim(),
    ownerContact:p.ownerContact?.trim(),
    ownerAddress:p.ownerAddress?.trim(),
    structural:p.structural||"-"
  }

  // 🔥 DUPLICATE BLOCK
  if(isDuplicate(newEntry)){
    setStatus("⚠️ Duplicate Entry Detected","error")
    document.getElementById("report").value=""
    return
  }

  data.push(newEntry)

  // ✅ MANUAL → CENTER
  setStatus(`✅ Entry Added (Sr. No. ${data.length})`)

  document.getElementById("report").value=""

  generateTable(true)
}

// TABLE
function generateTable(newEntry=false){
  let tbody=document.querySelector("#table tbody")
  tbody.innerHTML=""

  data.forEach((d,i)=>{
    tbody.innerHTML+=`
    <tr class="${newEntry && i===data.length-1 ? 'new-row':''}">
      <td>${i+1}</td>
      <td>${d.techName}</td>
      <td>${d.techContact}</td>
      <td>${d.type}</td>
      <td>${d.owner}</td>
      <td>${d.ownerContact}</td>
      <td>${d.ownerAddress}</td>
      <td>${d.structural}</td>
      <td>
        <button class="danger" onclick="deleteRow(${i})">Delete</button>
      </td>
    </tr>`
  })
}

// DELETE
function deleteRow(i){
  data.splice(i,1)
  generateTable()
  setStatus("🗑️ Row Deleted","info")
}

// CLEAR
function clearInput(){
  document.getElementById("report").value=""
  setStatus("🧹 Input Cleared","info")
}

// RESET
function resetData(){
  data=[]
  lastClipboard=""
  document.querySelector("#table tbody").innerHTML=""
  document.getElementById("report").value=""
  setStatus("Reset Successful ✅")
}

// EXPORT
function exportExcel(){

  if(data.length===0){
    setStatus("⚠️ No data to export","error")
    return
  }

  let ws=XLSX.utils.json_to_sheet(data.map((d,i)=>({
    "Sr. No.":i+1,
    "Technical Person Name":d.techName,
    "Technical Person Contact No.":d.techContact,
    "Technical Person Type":d.type,
    "Owner Name":d.owner,
    "Owner Contact No.":d.ownerContact,
    "Owner Address":d.ownerAddress,
    "Structural Engineer":d.structural
  })))

  let wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,"Data")
  XLSX.writeFile(wb,"table3_data.xlsx")

  setStatus("⬇️ Excel Downloaded","success")
}

</script>

</body>
</html>
