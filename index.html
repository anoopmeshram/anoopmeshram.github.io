<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anoop Login</title>

<style>
body {
    background: #0d1117;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: #161b22;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    width: 300px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}

button {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    cursor: pointer;
}

#googleBtn { background: #db4437; color: white; }
#githubBtn { background: #333; color: white; }

#dashboard {
    display: none;
}
</style>

</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="login">
        <h1>Login 🚀</h1>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Enter Email" required>
            <input type="password" id="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>

        <hr>

        <button id="googleBtn">Login with Google</button>
        <button id="githubBtn">Login with GitHub</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <h1>Welcome 🚀</h1>
        <img id="photo" width="100" style="border-radius:50%">
        <p id="name"></p>
        <p id="userEmail"></p>
        <button onclick="logout()">Logout</button>
    </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
// 🔥 Firebase Config (APNA DAL)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "anoop-meshram.firebaseapp.com",
  projectId: "anoop-meshram",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// Elements
const loginDiv = document.getElementById("login");
const dashboardDiv = document.getElementById("dashboard");

// Check user on load
const user = JSON.parse(localStorage.getItem("user"));
if (user) showDashboard(user);

// Email Login
document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;

    const user = { email };

    localStorage.setItem("user", JSON.stringify(user));

    showDashboard(user);
});

// Google Login
document.getElementById("googleBtn").addEventListener("click", async () => {
    const provider = new firebase.auth.GoogleAuthProvider();

    try {
        const result = await auth.signInWithPopup(provider);
        localStorage.setItem("user", JSON.stringify(result.user));
        showDashboard(result.user);
    } catch (err) {
        alert(err.message);
    }
});

// GitHub Login
document.getElementById("githubBtn").addEventListener("click", async () => {
    const provider = new firebase.auth.GithubAuthProvider();

    try {
        const result = await auth.signInWithPopup(provider);
        localStorage.setItem("user", JSON.stringify(result.user));
        showDashboard(result.user);
    } catch (err) {
        alert(err.message);
    }
});

// Show Dashboard
function showDashboard(user) {
    loginDiv.style.display = "none";
    dashboardDiv.style.display = "block";

    document.getElementById("name").innerText = user.displayName || "User";
    document.getElementById("userEmail").innerText = user.email || "";

    if (user.photoURL) {
        document.getElementById("photo").src = user.photoURL;
    }
}

// Logout
function logout() {
    localStorage.removeItem("user");
    location.reload();
}
</script>

</body>
</html>
