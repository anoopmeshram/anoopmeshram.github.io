<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Birthday Shruti ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

canvas{
position:absolute;
inset:0;
}

.container{
position:relative;
z-index:5;
text-align:center;
}

h1{
font-size:80px;
font-weight:800;
opacity:0;
transform:scale(.5);
transition:1s;
background:linear-gradient(
90deg,
#FFD700,
#FFFFFF,
#FFD700
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:
0 0 30px gold,
0 0 60px gold;
}

h1.show{
opacity:1;
transform:scale(1);
}

.subtitle{
color:white;
font-size:22px;
letter-spacing:3px;
margin-bottom:30px;
}

.cake{
position:relative;
width:380px;
height:300px;
margin:auto;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-20px);
}
}

.layer{
position:absolute;
left:50%;
transform:translateX(-50%);
border-radius:30px;
box-shadow:
0 20px 50px rgba(0,0,0,.5);
}

.layer1{
bottom:0;
width:380px;
height:120px;
background:
linear-gradient(
45deg,
#b8860b,
#ffd700
);
}

.layer2{
bottom:100px;
width:300px;
height:100px;
background:
linear-gradient(
45deg,
#d4af37,
#fff1a8
);
}

.layer3{
bottom:180px;
width:220px;
height:80px;
background:
linear-gradient(
45deg,
#f4d03f,
#fff6c2
);
}

.candle{
position:absolute;
left:50%;
top:-20px;
transform:translateX(-50%);
width:22px;
height:90px;
background:white;
border-radius:5px;
cursor:pointer;
}

.flame{
position:absolute;
left:50%;
top:-42px;
transform:translateX(-50%);
width:34px;
height:50px;

background:
radial-gradient(
circle,
#fff176,
#ff9800,
#ff5722
);

border-radius:50%;
box-shadow:
0 0 20px gold,
0 0 50px orange,
0 0 100px red;

animation:flicker .15s infinite alternate;
}

@keyframes flicker{

from{
transform:
translateX(-50%)
rotate(-8deg);
}

to{
transform:
translateX(-50%)
rotate(8deg)
scale(1.2);
}

}

.hidden{
display:none;
}

#instruction{
margin-top:30px;
color:white;
font-size:24px;
font-weight:700;
}

.firework{
position:absolute;
width:8px;
height:8px;
border-radius:50%;
pointer-events:none;
}

.balloon{
position:absolute;
width:70px;
height:90px;
border-radius:50%;
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

<h1 id="title">
🎉 Happy Birthday Shruti 🎉
</h1>

<div class="subtitle">
A Day Full Of Happiness ❤️
</div>

<div class="cake">

<div class="layer layer1"></div>
<div class="layer layer2"></div>
<div class="layer layer3"></div>

<div class="candle" id="candle">
<div class="flame" id="flame"></div>
</div>

</div>

<div id="instruction">
Tap Flame 🔥
</div>

</div>

<script>

const flame =
document.getElementById("flame");

const candle =
document.getElementById("candle");

const title =
document.getElementById("title");

const instruction =
document.getElementById("instruction");

let state=0;

const canvas=
document.getElementById("bg");

const ctx=
canvas.getContext("2d");

function resize(){

canvas.width=
window.innerWidth;

canvas.height=
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);
/* =========================
   GALAXY BACKGROUND
   ========================= */

let stars=[];

for(let i=0;i<250;i++){

stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
s:Math.random()*1.5
});

}

function drawGalaxy(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

let g=
ctx.createRadialGradient(
canvas.width/2,
canvas.height/2,
50,
canvas.width/2,
canvas.height/2,
700
);

g.addColorStop(0,"#16213e");
g.addColorStop(.5,"#0f3460");
g.addColorStop(1,"#050816");

ctx.fillStyle=g;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

for(let s of stars){

ctx.beginPath();

ctx.fillStyle=
"rgba(255,255,255,.9)";

ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
);

ctx.fill();

s.y+=s.s;

if(s.y>canvas.height){

s.y=0;

s.x=
Math.random()*canvas.width;

}

}

requestAnimationFrame(
drawGalaxy
);

}

drawGalaxy();

/* =========================
   BALLOONS
   ========================= */

for(let i=0;i<20;i++){

let b=
document.createElement("div");

b.className="balloon";

b.style.left=
Math.random()*100+"vw";

b.style.bottom=
"-150px";

b.style.background=
`hsl(
${Math.random()*360},
100%,
60%
)`;

document.body.appendChild(b);

let duration=
8+Math.random()*8;

b.animate(

[
{
transform:
"translateY(0)"
},

{
transform:
"translateY(-130vh)"
}

],

{
duration:
duration*1000,

iterations:
Infinity
}

);

}

/* =========================
   FIREWORKS ENGINE
   ========================= */

function fireworks(){

for(let i=0;i<160;i++){

let p=
document.createElement("div");

p.className=
"firework";

p.style.left=
(window.innerWidth/2)+"px";

p.style.top=
(window.innerHeight/3)+"px";

p.style.background=
`hsl(
${Math.random()*360},
100%,
60%
)`;

document.body.appendChild(
p
);

let angle=
(Math.PI*2*i)/160;

let dist=
100+
Math.random()*250;

let x=
Math.cos(angle)*dist;

let y=
Math.sin(angle)*dist;

p.animate(

[
{
transform:
"translate(0,0)",
opacity:1
},

{
transform:
`translate(${x}px,${y}px)`,

opacity:0
}

],

{
duration:2200,
easing:"ease-out"
}

);

setTimeout(()=>{

p.remove();

},2200);

}

}

/* =========================
   FLOATING HEARTS
   ========================= */

setInterval(()=>{

let h=
document.createElement("div");

h.innerHTML="❤️";

h.style.position=
"absolute";

h.style.left=
Math.random()*100+"vw";

h.style.bottom=
"-30px";

h.style.fontSize=
(20+Math.random()*25)
+"px";

document.body.appendChild(h);

h.animate(

[
{
transform:
"translateY(0)",
opacity:0
},

{
opacity:1
},

{
transform:
"translateY(-120vh)",
opacity:0
}

],

{
duration:8000
}

);

setTimeout(()=>{

h.remove();

},8000);

},1200);

/* =========================
   CANDLE INTERACTION
   ========================= */

function revealBirthday(){

title.classList.add(
"show"
);

instruction.innerHTML=
"🎉 HAPPY BIRTHDAY SHRUTI 🎉";

fireworks();

setTimeout(
fireworks,
600
);

setTimeout(
fireworks,
1200
);

setTimeout(
fireworks,
1800
);

}

/* =========================
   MAIN CYCLE
   ========================= */

function nextStep(){

if(state===0){

flame.classList.add(
"hidden"
);

instruction.innerHTML=
"Tap Candle 🕯️";

state=1;

}

else if(state===1){

flame.classList.remove(
"hidden"
);

title.classList.remove(
"show"
);

instruction.innerHTML=
"Tap Flame 🔥";

state=2;

}

else if(state===2){

flame.classList.add(
"hidden"
);

revealBirthday();

state=3;

}

else{

title.classList.remove(
"show"
);

flame.classList.remove(
"hidden"
);

instruction.innerHTML=
"Tap Flame 🔥";

state=0;

}

}

flame.addEventListener(
"click",
nextStep
);

candle.addEventListener(
"click",
()=>{

if(
state===1 ||
state===3
){

nextStep();

}

}
);

/* =========================
   AUTO FIREWORKS
   ========================= */

setInterval(()=>{

if(state===3){

fireworks();

}

},3000);

/* =========================
   GOLD SPARKLES
   ========================= */

setInterval(()=>{

let s=
document.createElement("div");

s.innerHTML="✨";

s.style.position=
"absolute";

s.style.left=
Math.random()*100+"vw";

s.style.top=
Math.random()*100+"vh";

s.style.fontSize=
(10+Math.random()*25)
+"px";

document.body.appendChild(
s
);

s.animate(

[
{
opacity:0,
transform:"scale(0)"
},

{
opacity:1,
transform:"scale(1.5)"
},

{
opacity:0,
transform:"scale(0)"
}

],

{
duration:2000
}

);

setTimeout(()=>{

s.remove();

},2000);

},250);

/* =========================
   SHOOTING STARS
   ========================= */

setInterval(()=>{

let star=
document.createElement("div");

star.style.position=
"absolute";

star.style.left=
Math.random()*100+"vw";

star.style.top=
Math.random()*30+"vh";

star.style.width="3px";
star.style.height="3px";

star.style.background=
"white";

star.style.boxShadow=
"0 0 20px white";

document.body.appendChild(
star
);

star.animate(

[
{
transform:
"translate(0,0)"
},

{
transform:
"translate(-800px,400px)"
}

],

{
duration:1800,
easing:"linear"
}

);

setTimeout(()=>{

star.remove();

},1800);

},2200);

/* =========================
   AUTO RESET
   ========================= */

setInterval(()=>{

if(state===3){

setTimeout(()=>{

title.classList.remove(
"show"
);

flame.classList.remove(
"hidden"
);

instruction.innerHTML=
"Tap Flame 🔥";

state=0;

},8000);

}

},10000);

/* =========================
   GRAND ENTRY
   ========================= */

setTimeout(
fireworks,
1000
);

setTimeout(
fireworks,
2000
);

setTimeout(
fireworks,
3000
);

console.log(
"Ultra Premium Birthday Loaded ❤️"
);

</script>

</body>
</html>
